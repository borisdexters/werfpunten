<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d97406">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Werfpunten">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Werfpunten</title>
<style>
  :root{
    --ground:#eef0ec; --surface:#ffffff; --surface-2:#f7f8f5;
    --ink:#161a1e; --ink-soft:#5d646b; --ink-faint:#8c9299;
    --line:#d7dad4; --line-soft:#e6e8e3;
    --accent:#d97406; --accent-ink:#ffffff;
    --zone:#2c5a78; --zone-soft:#e4edf3;
    --ok:#3d7550; --warn:#b04527;
    --radius:10px;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#13161a; --surface:#1b2026; --surface-2:#222830;
      --ink:#e9ebed; --ink-soft:#a3abb3; --ink-faint:#767e86;
      --line:#2d343c; --line-soft:#252b32;
      --accent:#f08a1c; --accent-ink:#16191c;
      --zone:#7fb3d5; --zone-soft:#22303a;
      --ok:#6aab7f; --warn:#e0715a;
    }
  }
  :root[data-theme="dark"]{
    --ground:#13161a; --surface:#1b2026; --surface-2:#222830;
    --ink:#e9ebed; --ink-soft:#a3abb3; --ink-faint:#767e86;
    --line:#2d343c; --line-soft:#252b32;
    --accent:#f08a1c; --accent-ink:#16191c;
    --zone:#7fb3d5; --zone-soft:#22303a;
    --ok:#6aab7f; --warn:#e0715a;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

  header{
    background:var(--surface); border-bottom:1px solid var(--line);
    padding:10px 14px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
    position:sticky; top:0; z-index:6;
  }
  h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em}
  .meta{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-faint);margin-left:auto}
  .versie{font:10px ui-monospace,Menlo,monospace;color:var(--ink-faint);opacity:.6;margin-left:6px}

  .dagboek{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;padding:10px 14px;
    background:var(--surface-2);border-bottom:1px solid var(--line-soft);align-items:center}
  .dagboek label{font:11px ui-monospace,Menlo,monospace;color:var(--ink-soft);letter-spacing:.04em}
  .weerveld{display:flex;gap:6px}
  .weerveld input{flex:1}
  #weerknop{padding:6px 10px;font-size:15px;line-height:1;border:1px solid var(--line);
    background:var(--surface-2);color:var(--ink-soft);border-radius:8px;flex:0 0 auto}
  #weerknop.bezig{opacity:.5}
  #weerknop.klaar{border-color:var(--ok);color:var(--ok)}
  .weerinfo{grid-column:1/-1;font:11px ui-monospace,Menlo,monospace;color:var(--ink-faint);margin:0}
  .dagboek input{
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    border-radius:8px;padding:7px 9px;font-size:14px;width:100%;
  }

  .aanwezig{padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line-soft)}
  .aanwezig-kop{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .aw-label{font:11px ui-monospace,Menlo,monospace;color:var(--ink-soft);letter-spacing:.04em}
  .aw-beheer{background:none;border:none;color:var(--accent);font-size:12px;padding:0;margin-left:auto;cursor:pointer}
  .aw-chips{display:flex;flex-wrap:wrap;gap:6px}
  .aw-chip{border:1.5px solid var(--line);background:transparent;color:var(--ink-soft);
    font-size:13px;padding:6px 11px;border-radius:999px;cursor:pointer}
  .aw-chip[aria-pressed="true"]{background:var(--zone-soft);border-color:var(--zone);color:var(--zone);font-weight:600}
  .aw-leeg{font-size:12.5px;color:var(--ink-faint)}
  .sprekers{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}
  .spreker-knop{border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);
    font:12px ui-monospace,Menlo,monospace;padding:5px 9px;border-radius:7px;cursor:pointer}
  .spreker-knop.actief{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .zone-btn.met-plan{border-color:var(--zone);font-weight:650}
  .zones{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--surface);
    border-bottom:1px solid var(--line);position:sticky;top:44px;z-index:5;-webkit-overflow-scrolling:touch}
  .zones::-webkit-scrollbar{display:none}
  .zone-btn{
    flex:0 0 auto;border:1.5px solid var(--line);background:transparent;color:var(--ink-soft);
    font:13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em;
    padding:11px 14px;border-radius:999px;cursor:pointer;transition:background .12s,color .12s,border-color .12s;
  }
  .zone-btn[aria-pressed="true"]{background:var(--zone);border-color:var(--zone);color:var(--ground)}
  .zone-btn:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px}

  main{flex:1;padding:12px 14px 8px;display:flex;flex-direction:column;gap:8px}
  .leeg{color:var(--ink-faint);font-size:14px;text-align:center;padding:32px 12px;line-height:1.6}

  .punt{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
    padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
  .punt .thumb{width:52px;height:52px;flex:0 0 auto;border-radius:7px;object-fit:cover;background:var(--surface-2);
    border:1px solid var(--line-soft)}
  .punt .body{flex:1;min-width:0}
  .punt .kop{display:flex;gap:7px;align-items:center;margin-bottom:3px;flex-wrap:wrap}
  .chip{font:11px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;padding:4px 7px;border-radius:5px;
    background:var(--zone-soft);color:var(--zone);font-weight:600}
  .tijd{font:11px ui-monospace,Menlo,monospace;color:var(--ink-faint)}
  .spreker{font:11px ui-monospace,Menlo,monospace;color:var(--accent);font-weight:600}
  .punt p{margin:0;font-size:15px;word-wrap:break-word;overflow-wrap:anywhere}
  .punt p.leegnotitie{color:var(--ink-faint);font-style:italic}
  .punt-wrap{position:relative;overflow:hidden;border-radius:var(--radius);touch-action:pan-y}
  .wisknop{position:absolute;top:0;right:0;bottom:0;width:96px;border:none;border-radius:0;
    background:var(--warn);color:#fff;font-size:14px;font-weight:600;padding:0}
  .punt{position:relative;transition:transform .18s ease;will-change:transform;touch-action:pan-y}
  .punt.open{transform:translateX(-96px)}
  .toast{display:flex;align-items:center;gap:14px}
  .toast-actie{background:none;border:none;color:var(--accent);font-weight:650;font-size:14px;padding:0;cursor:pointer}

  .invoer{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);
    padding:10px 14px calc(10px + var(--safe-b));display:flex;flex-direction:column;gap:8px;z-index:6}
  textarea{
    width:100%;min-height:64px;resize:none;border:1px solid var(--line);border-radius:var(--radius);
    padding:10px 11px;font:16px/1.4 inherit;background:var(--surface);color:var(--ink)}
  textarea::placeholder{color:var(--ink-faint)}
  .onaf{font-size:11.5px;font-weight:650;color:var(--accent);border:1px solid var(--accent);
    border-radius:5px;padding:1px 5px}
  .rij{display:flex;gap:8px;flex-wrap:wrap}
  .rij .bewaar{flex:1 0 100%}
  button{font:inherit;cursor:pointer;border-radius:var(--radius);border:1px solid var(--line);
    background:var(--surface-2);color:var(--ink);padding:13px 14px;font-size:15px}
  .fotoknop,.docknop{flex:0 0 auto;min-width:80px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:14px}
  .docknop.heeft{border-color:var(--ok);color:var(--ok);font-weight:600}
  .bijlage{width:52px;height:52px;flex:0 0 auto;border-radius:7px;border:1px solid var(--line);
    background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;font:9px ui-monospace,Menlo,monospace;color:var(--ink-soft);text-align:center;padding:3px;overflow:hidden}
  .bijlage span:first-child{font-size:19px;line-height:1}
  .fotoknop.heeft{border-color:var(--ok);color:var(--ok);font-weight:600}
  .bewaar{flex:1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:650}
  .bewaar:disabled{opacity:.4}
  input[type=file]{display:none}

  .acties{display:flex;gap:8px;padding:4px 14px 16px;flex-wrap:wrap}
  .acties button{flex:1;font-size:14px;padding:11px}
  /* Een toast fadet weg; het grootste risico van deze app mag niet met hem meeverdwijnen.
     Staat er iets te wachten, dan draagt de knop het tot je hem indrukt. */
  #backup.wacht{border-color:var(--accent);color:var(--accent);font-weight:650}
  #backup.wacht::before{content:"● ";font-size:10px;vertical-align:2px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--safe-b));
    background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:8px;font-size:14px;
    opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
  .toast.aan{opacity:1}
  dialog{border:none;border-radius:12px;padding:0;max-width:92vw;width:520px;background:var(--surface);color:var(--ink)}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  .dlg-kop{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .dlg-kop h2{margin:0;font-size:15px}
  .dlg-body{padding:14px 16px;max-height:64vh;overflow:auto}
  .dlg-body pre{white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,monospace;margin:0;color:var(--ink)}
  .dlg-body img{width:100%;border-radius:8px;margin-bottom:10px;border:1px solid var(--line-soft)}
  .dlg-voet{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
  .dlg-voet button{flex:1}
  #invoerdlg{width:min(94vw,520px);max-width:94vw}
  #invoerdlg textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:var(--radius);
    padding:10px;font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface);color:var(--ink);resize:vertical}
  .inv-uitleg{margin:0 0 10px;font-size:13px;color:var(--ink-soft);white-space:pre-line}
  #invoerdlg .inv-ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
  #tekendlg{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;background:#111;border-radius:0}
  #tekendlg::backdrop{background:#000}
  /* Snelvastleggen: alles wat niet het beeld of de sluiter is, moet wijken. Geen tussenvraag,
     geen bevestiging — het gezelschap staat al bij het volgende euvel. */
  /* De keet: één punt tegelijk, groot genoeg om samen naar te kijken. */
  #keetdlg{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;background:var(--ground);
    border-radius:0;display:flex;flex-direction:column}
  #keetdlg::backdrop{background:#000a}
  .keet-vlak{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
  #keet-foto{width:100%;max-height:38dvh;object-fit:contain;background:#111;border-radius:var(--radius);
    cursor:crosshair}
  .keet-voortgang{margin-left:auto;margin-right:auto;font:600 14px ui-monospace,Menlo,monospace;color:#f2f2f7}
  #keet-tekst{width:100%;border:1px solid var(--line);border-radius:var(--radius);padding:11px;
    font:16px/1.45 -apple-system,system-ui,sans-serif;background:var(--surface);color:var(--ink);resize:vertical}
  .keet-blok{display:flex;flex-direction:column;gap:7px}
  .keet-label{font-size:12.5px;font-weight:650;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
  .keet-knoppen{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .keet-knoppen button{font-size:14px;padding:9px 12px}
  .keet-knoppen select{font-size:15px;padding:9px 10px;border:1px solid var(--line);
    border-radius:var(--radius);background:var(--surface);color:var(--ink);flex:1;min-width:0}
  #keet-urgent.actief{background:#b3261e;border-color:#b3261e;color:#fff}
  .keet-knoppen button.actief{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}
  #keet-verbod.actief{background:#b3261e;border-color:#b3261e;color:#fff}
  .keet-uitleg{font-size:12.5px;color:var(--ink-soft);font-style:italic;flex-basis:100%}
  .keet-vouw{align-self:flex-start;font-size:12.5px;font-weight:650;color:var(--ink-soft);
    background:none;border:none;padding:0;text-transform:uppercase;letter-spacing:.04em}
  .keet-woorden{display:flex;flex-direction:column;gap:6px}
  .keet-woorden[hidden]{display:none}
  .keet-soortkop{font-size:11.5px;font-weight:650;color:var(--ink-faint);text-transform:uppercase;
    letter-spacing:.05em;margin-top:4px;background:none;border:none;padding:2px 0;
    align-self:flex-start;text-align:left}
  .keet-soortkop.actief{color:var(--accent)}
  .keet-woordrij{display:flex;flex-wrap:wrap;gap:5px}
  .keet-woordrij button{font-size:13px;padding:6px 10px;border-radius:14px}
  .keet-woordrij button.actief{background:var(--zone);border-color:var(--zone);color:#fff;font-weight:650}
  .keet-gevolg{font-size:12.5px;color:var(--ink-soft);font-style:italic;margin-top:-6px}
  .keet-plek{font-size:13px;color:var(--ink-soft)}
  .keet-plek button{font-size:13px;padding:6px 10px}
  #sneldlg{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;background:#000;
    border-radius:0;overflow:hidden}
  #sneldlg::backdrop{background:#000}
  #snelbeeld{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  .snel-kop{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
    padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;color:#fff;z-index:2;
    background:linear-gradient(#000c,#0000)}
  .snel-kop button{background:#ffffff22;color:#fff;border:1px solid #ffffff44;font-size:14px;padding:9px 13px}
  .snel-teller{margin-left:auto;font:600 15px ui-monospace,Menlo,monospace;color:#fff}
  .snel-voet{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;
    justify-content:center;gap:22px;padding:20px 14px calc(24px + env(safe-area-inset-bottom,0px));
    z-index:2;background:linear-gradient(#0000,#000c)}
  .snel-sluiter{width:78px;height:78px;border-radius:50%;background:#fff;border:5px solid #ffffff66;
    padding:0;flex:none}
  .snel-sluiter:active{transform:scale(.93)}
  .snel-flits{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
  .snel-flits.aan{animation:snelflits .22s ease-out}
  @keyframes snelflits{from{opacity:.85}to{opacity:0}}
  .snel-mislukt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;color:#fff;padding:24px;text-align:center;font-size:15px;z-index:2}
  .teken-balk{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#1c1c1e;
    padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .teken-balk button{background:#2c2c2e;color:#f2f2f7;border:1px solid #3a3a3c;font-size:14px;padding:9px 12px}
  /* het planscherm heeft vijf knoppen; op 375px moeten die krapper om te passen */
  #plandlg .teken-balk{gap:6px;padding-left:8px;padding-right:8px;padding-top:calc(7px + env(safe-area-inset-top,0px));padding-bottom:7px}
  #plandlg .teken-balk button{font-size:13px;padding:9px 9px;white-space:nowrap}
  /* Een plan klaarmaken en lokalen nummeren is desktopwerk — op een werf ben je daar een uur
     mee bezig. Op een smal scherm staan die knoppen daarom achter ⋯: bereikbaar, niet opvallend.
     Vanaf 700px (iPad, Mac) staan ze gewoon in de balk en verdwijnt de ⋯. */
  #plandlg .pl-klaarmaak{display:none}
  #plandlg.klaarmaken .pl-klaarmaak{display:inline-block}
  @media (min-width:700px){
    #plandlg .pl-klaarmaak{display:inline-block}
    #pl-meer{display:none}
  }
  .teken-balk .tk-klaar{margin-left:auto;background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}
  .tk-kleuren{display:flex;gap:6px}
  .tk-kleur{width:26px;height:26px;border-radius:50%;border:2px solid #48484a;padding:0;cursor:pointer}
  .tk-kleur.actief{border-color:#fff;transform:scale(1.12)}
  .teken-vlak{flex:1;display:flex;align-items:center;justify-content:center;height:calc(100dvh - 60px);background:#111}
  #tekencanvas{max-width:100%;max-height:100%;touch-action:none;background:#fff}
  /* plan: zelfde schermvullende opzet als het tekenscherm */
  #plandlg{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;background:#111;border-radius:0}
  #plandlg::backdrop{background:#000}
  .plan-vlak{position:relative;height:calc(100dvh - 56px);background:#111;overflow:hidden}
  #plancanvas{display:block;width:100%;height:100%;touch-action:none}
  /* display:flex zou het hidden-attribuut overstemmen */
  /* `hidden` verliest het van een klasse die display zet, dus elk van deze drie moet er staan.
     .plan-invoer ontbrak hier: het invoerveld bleef daardoor altijd zichtbaar, ook zonder pin —
     terwijl "Punt bewaren" dan toch weigert met "Tik eerst waar het is". */
  .plan-leeg[hidden],.plan-voet[hidden],.plan-invoer[hidden]{display:none}
  .plan-leeg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;color:#c7cbd0;font-size:14px;text-align:center;padding:24px;line-height:1.6}
  .plan-leeg button{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}
  .plan-voet{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:8px;
    padding:10px 12px calc(10px + var(--safe-b));color:#f2f2f7;font-size:13px;
    background:rgba(24,24,26,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-top:1px solid rgba(255,255,255,.10)}
  .plan-kop{display:flex;align-items:center;gap:10px}
  .plan-teller{flex:0 0 auto;font:11px ui-monospace,Menlo,monospace;color:#8e949b}
  .plan-vouw{flex:0 0 auto;background:none!important;border:none!important;color:#8e949b!important;
    font-size:18px!important;padding:4px 8px!important;line-height:1}
  /* ingeklapt: alleen de regel met het lokaal, de rest van het scherm is kaart */
  .plan-voet.klein .plan-buren,.plan-voet.klein .plan-invoer{display:none}
  .plan-voet.klein{gap:0}
  .plan-zoom{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
  .plan-zoom button{width:38px;height:38px;padding:0;font-size:19px;line-height:1;
    background:rgba(28,28,30,.9);color:#f2f2f7;border:1px solid #3a3a3c;border-radius:9px}
  /* de buren: als de gok ernaast zit, is de juiste ruimte bijna altijd een van de dichtstbijzijnde */
  .plan-buren{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  /* de lokalenknoppen schuiven horizontaal, maar de koppelknoppen zijn handelingen: die mogen
     niet half buiten beeld vallen omdat je er net niet naast scrolde */
  .plan-buren.koppel{flex-wrap:wrap;overflow-x:visible}
  .plan-buren::-webkit-scrollbar{display:none}
  .plan-buren button{flex:0 0 auto;background:#2c2c2e;color:#c9ced4;border:1px solid #3a3a3c;
    font:12px ui-monospace,Menlo,monospace;padding:7px 10px}
  .plan-buren button.actief{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}
  .plan-invoer{display:flex;flex-direction:column;gap:7px}
  .plan-invoer textarea{width:100%;background:rgba(28,28,30,.85);color:#f2f2f7;
    border:1px solid rgba(255,255,255,.18);

  /* ---- het verslagvenster en de doorstuurlijsten ----
     Eén rij per keuze: links wát het is en hoe groot, rechts de knop. Dit is keetwerk, dus mag
     er staan wat er meegaat — op de werf zou die uitleg in de weg staan, hier is ze de reden

  .door-rij{display:flex;align-items:center;gap:12px;padding:11px 0;

  /* ---- de afdruk ----
     Op het scherm bestaat dit blok niet; bij het afdrukken is het het enige wat overblijft.

  .afdruk{display:none}

    /* Een verbod is een eigen rechtshandeling van de architect; dat mag je op een blad zien

  }

<script>
const ZONES=["N3","N4","N5","DAK","KAPEL","KELDER","STELLING","BUITEN"];
const SLEUTEL="werfpunten-v1";
const VERSIE="v48";
let staat={datum:new Date().toISOString().slice(0,10),weer:"",bezetting:"",zone:"N3",punten:[]};
let wachtendeFoto=null;
let wachtendeBijlage=null;

/* opslag: punten in localStorage, foto's in IndexedDB */
let db=null;
function opendb(){return new Promise(res=>{
  let klaar=false;
  const af=v=>{if(!klaar){klaar=true;res(v)}};
  setTimeout(()=>af(null),1500);           // nooit blijven hangen
  try{
    const q=indexedDB.open("werfpunten",3);
    q.onupgradeneeded=()=>{
      // versie 2 voegt de plannen toe, versie 3 het archief per dag; bestaande toestellen
      // houden hun foto's en plannen
      try{if(!q.result.objectStoreNames.contains("fotos"))q.result.createObjectStore("fotos")}catch(e){}
      try{if(!q.result.objectStoreNames.contains("plannen"))q.result.createObjectStore("plannen")}catch(e){}
      try{if(!q.result.objectStoreNames.contains("dagen"))q.result.createObjectStore("dagen")}catch(e){}
    };
    q.onsuccess=()=>{db=q.result;af(db)};
    q.onerror=()=>af(null);
    q.onblocked=()=>af(null);
  }catch(e){af(null)}
});}
function zetFoto(id,blob){return new Promise(res=>{
  if(!db)return res();
  const t=db.transaction("fotos","readwrite");t.objectStore("fotos").put(blob,id);t.oncomplete=()=>res();
});}
function haalFoto(id){return new Promise(res=>{
  if(!db)return res(null);
  const q=db.transaction("fotos","readonly").objectStore("fotos").get(id);
  q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);
});}

/* Contacten staan los van de dag: ze blijven bewaard over vergaderingen heen.
   De lijst zit alleen op dit toestel; er staan geen namen in de app zelf. */
/* ---- profielen ----
   Wat een rol mág en wat een soort betekent, verschilt per beroep. Een architect leidt,
   controleert, adviseert en kan verbieden. Een veiligheidscoördinator coördineert en noteert,
   maar geeft geen bevel. Een EPB-verslaggever stelt vast en rapporteert; hij ontwerpt niets en
   draagt de aangifte niet. Een aannemer voert uit, meldt, en maakt voorbehoud.

   Alles eromheen is beroepsneutraal: de zones, de plek op het plan, de hoofdstukken, ⚡ Snel, de
   keet, de herhaling van wat openstaat. Alleen deze tabel wisselt. Dezelfde tabel staat als
   PROFIELEN in werf_verwerk.py, en de app stuurt met een `PROFIEL:`-regel bovenaan de export mee
   welk profiel geldt; zonder die regel is het de architect, zodat oudere notities blijven werken.

   ⚠️ De drie profielen naast dat van de architect zijn een eerste opzet, opgesteld naar de
   rechtshandelingen die bij elk beroep horen, en nog niet nagelezen door iemand die dat beroep
   uitoefent. De woorden zijn bedoeld om vervangen te worden — dat kan al, via **woorden**.

   Wat er bewust níet in staat is een wetsartikel. De regels kloppen, maar een verslag dat een
   verkeerd artikelnummer citeert geeft de tegenpartij een argument. Dat geldt hier zoals overal. */

const PROFIELEN=[
{sleutel:"architect", naam:"architect",
 uitleg:"leiden, controleren, adviseren, verbieden",
 rest:{kop:"Op te volgen", toelichting:""},
 // De eigen rechtshandeling van dit beroep: het ene dat geen vaststelling is maar een daad.
 bijzonder:{knop:"⛔ Verbod", kop:"Verbod",
   uitleg:"Een eigen rechtshandeling van de architect. Wordt er geen gevolg aan gegeven, dan "+
     "gebeurt dat op verantwoordelijkheid van de aannemer.",
   verslag:"De architect verbiedt de hierna vermelde uitvoering. Wordt hieraan geen gevolg "+
     "gegeven, dan gebeurt dat op verantwoordelijkheid van de aannemer."},
 rollen:[
  {sleutel:"aannemer", naam:"aannemer", kop:"Aanwijzingen aan de aannemer",
   toelichting:"uit te voeren binnen de aanneming; meerwerk pas na akkoord van de opdrachtgever"},
  {sleutel:"opdrachtgever", naam:"opdrachtgever", kop:"Ter beslissing van de opdrachtgever",
   toelichting:"de architect adviseert, de opdrachtgever beslist"},
  {sleutel:"studiebureau", naam:"studiebureau", kop:"Ter advies",
   toelichting:"gevraagd advies, geen uitvoeringsopdracht"},
  {sleutel:"architect", naam:"architect", kop:"Op te volgen door de architect", toelichting:""}],
 soorten:[
  {sleutel:"gebrek", kop:"Gebrek",
   uitleg:"het uitgevoerde werk deugt niet — herstel binnen de aanneming",
   woorden:["scheur","vocht","lek","uitbloeiing","corrosie","schimmelvorming","verkleuring",
            "loszittend materiaal","doorbuiging","zetting","open voeg","oneffenheid"]},
  {sleutel:"nietconform", kop:"Niet conform",
   uitleg:"wijkt af van plan, bestek of vergunning — ook al is het goed uitgevoerd",
   blok:"Niet conform plan of bestek",
   blokuitleg:"afwijking van wat is voorgeschreven, ongeacht de uitvoeringskwaliteit; "+
              "te herstellen of ter aanvaarding voor te leggen aan de opdrachtgever",
   woorden:["afwijkend materiaal","afwijkende afmeting","afwijkende plaatsing",
            "niet volgens detail"]},
  {sleutel:"beschadiging", kop:"Beschadiging",
   uitleg:"schade aan werk dat goed was — wie ze veroorzaakte bepaalt wie herstelt",
   blok:"Beschadigingen",
   blokuitleg:"schade aan werk dat was uitgevoerd. Vóór herstel binnen de aanneming gevorderd "+
              "wordt, moet vaststaan wie ze veroorzaakt heeft",
   woorden:["beschadiging","breuk","vervuiling"]},
  {sleutel:"onafgewerkt", kop:"Niet afgewerkt",
   uitleg:"het werk is niet af — dit raakt de termijn, niet de kwaliteit",
   blok:"Nog uit te voeren",
   blokuitleg:"niet-voltooiing, geen gebrek; dit raakt de uitvoeringstermijn en de oplevering",
   woorden:["onafgewerkt","ontbrekend materiaal","ontbrekende afdichting"]},
  {sleutel:"esthetiek", kop:"Esthetiek",
   uitleg:"beoordeling van de architect, geen technisch gebrek",
   blok:"Esthetische opmerkingen",
   blokuitleg:"beoordeling van de architect, geen technisch gebrek",
   woorden:["kleurverschil","zichtbare naad","onregelmatig voegwerk","zichtbare bevestiging",
            "scheve plaatsing"]},
  {sleutel:"veiligheid", kop:"Veiligheid",
   uitleg:"onveilige toestand — te melden aan de veiligheidscoördinator",
   blok:"Veiligheid",
   blokuitleg:"onveilige toestand, vastgesteld en gemeld; de coördinatie ervan behoort tot de "+
              "opdracht van de veiligheidscoördinator",
   woorden:["ontbrekende leuning","onbeveiligde sparing","obstakel in doorgang",
            "ontbrekende afscherming"]},
  {sleutel:"meerwerk", kop:"Meerwerk",
   uitleg:"vast te stellen en te adviseren; uitvoering pas na voorafgaand schriftelijk akkoord "+
          "van de opdrachtgever over aard en prijs",

const PROFIELSLEUTEL="werfpunten-profiel";
let profiel=null;
let ROLLEN=[];
let SOORTEN=[];

function laadProfiel(sleutel){
  let s=sleutel;
  if(!s){try{s=localStorage.getItem(PROFIELSLEUTEL)||""}catch(e){s=""}}
  profiel=PROFIELEN.find(p=>p.sleutel===s)||PROFIELEN[0];
  ROLLEN=profiel.rollen;
  SOORTEN=profiel.soorten;
  STANDAARDWOORDEN=null;      // de standaardlijst hoort bij dít profiel, niet bij het vorige
  laadGebrekwoorden();
}

/* Het profiel wisselen laat de punten staan. Dat is niet vrijblijvend: een punt draagt de
   sleutel van zijn soort, en die sleutel bestaat in het andere profiel meestal niet. Zo'n punt
   verliest daarmee zijn blok in het verslag — niet zijn tekst, niet zijn plek, niet zijn
   toewijzing. Dat is de zachte degradatie die overal in deze app geldt, maar ze moet wel gezegd
   worden vóór je kiest, en niet achteraf blijken. */
function kiesProfiel(){
  const anders=(staat.punten||[]).filter(p=>p.soort).length;
  const regels=PROFIELEN.map(p=>
    "<b>"+veilig(p.naam)+"</b> — "+veilig(p.uitleg)+
    (p.sleutel===profiel.sleutel?" · <i>nu actief</i>":""));
  regels.unshift("Het profiel bepaalt wat een rol mág en wat een soort betekent. De rest van de "+
    "app verandert niet: de zones, het plan, de hoofdstukken en de keet blijven zoals ze zijn.");
  if(anders)regels.push("⚠️ "+stuks(anders,"punt draagt","punten dragen")+" een soort uit het "+
    "huidige profiel. Wissel je, dan houden ze hun tekst, hun plek en hun toewijzing, maar valt "+
    "hun soort weg uit de indeling van het verslag — kies ze daar opnieuw.");
  regels.push("De woordenlijsten zijn per profiel; wat je bij <b>woorden</b> aanpaste blijft "+
    "bewaard en komt terug als je terugwisselt.");
  const dlg=document.getElementById("dlg");
  document.getElementById("dlg-titel").textContent="Profiel";
  const body=document.getElementById("dlg-body");
  body.innerHTML=regels.map(t=>'<p class="inv-uitleg" style="margin:0 0 10px">'+t+"</p>").join("");
  const rij=document.createElement("div");
  rij.style.cssText="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px";
  PROFIELEN.forEach(p=>{
    const b=document.createElement("button");
    b.type="button";
    b.style.cssText="font-size:15px;font-weight:650;padding:12px 16px;background:var(--zone-soft);"+
      "color:var(--zone);border-color:var(--zone-soft)";
    if(p.sleutel===profiel.sleutel)b.style.borderColor="var(--accent)";
    b.textContent=p.naam;
    // De keuze doet haar werk hier en niet in een afhandelaar op het sluiten van het venster:
    // één handeling, één plaats.
    b.onclick=()=>{
      dlg.close();
      if(p.sleutel===profiel.sleutel)return;
      try{localStorage.setItem(PROFIELSLEUTEL,p.sleutel)}catch(e){}
      laadProfiel(p.sleutel);
      merkProfiel();
      tekenLijst();
      melding("Profiel: "+profiel.naam);
    };
    rij.appendChild(b);
  });
  body.appendChild(rij);
  document.getElementById("dlg-kopieer").style.display="none";
  dlg.showModal();
}

function merkProfiel(){
  const k=document.getElementById("profielbeheer");
  if(k)k.textContent=profiel.sleutel==="architect"?"profiel":profiel.naam;
  const b=document.getElementById("keet-verbod");
  if(b){
    b.hidden=!profiel.bijzonder;
    if(profiel.bijzonder)b.textContent=profiel.bijzonder.knop;
  }
}

function rolVan(code){
  const c=contacten.find(x=>x.code===code);
  return c&&c.rol?ROLLEN.find(r=>r.sleutel===c.rol)||null:null;
}
function leesRol(t){
  const w=(t||"").trim().toLowerCase();
  if(!w)return "";
  // Zowel op de sleutel als op de naam die dit profiel eraan geeft: in het contactenvenster
  // staan de namen, dus die typt men over. "bouwdirectie" is de opdrachtgever van een
  // veiligheidscoördinator, en hoort dus in dezelfde rol te vallen.
  const past=o=>[o.sleutel,o.naam].some(n=>{
    const k=n.toLowerCase();
    return k.startsWith(w)||w.startsWith(k.slice(0,4));
  });
  const r=ROLLEN.find(past);
  return r?r.sleutel:"";
}

/* ---- de bestekhoofdstukken ----
   De hoofdindeling van een verslag is niet waar je stond maar wélk deel van het werk het betreft.
   Dat is precies de indeling van het bestek, en dat is geen toeval: het bestek is het contract, en
   een vaststelling die naar een hoofdstuk verwijst staat op contractuele grond in plaats van op
   een mening. Het maakt bovendien doorsturen mogelijk — de dakwerker krijgt hoofdstuk dak.

   Deze lijst hoort dus bij het project, niet bij de app. Wat hieronder staat is een vertrekpunt;
   vervang het door de hoofdstukken van jóuw bestek, met hun eigen nummers. */
/* ---- de woorden per soort ----
   De zeven soorten liggen vast: ze dragen elk hun juridische betekenis, en dat is de ruggengraat
   van het verslag. Wie "beschadiging" zelf tot "gebrek" kan herbenoemen, haalt de bescherming er
   meteen uit.

   De wóórden binnen elke soort liggen niet vast. Die zijn vakgebonden en werfgebonden — wat op een
   restauratie elke week terugkomt, zie je op een kantoorgebouw nooit. Er staat een bruikbare lijst
   klaar zodat het dag één werkt; vervang ze door wat jij werkelijk tegenkomt.

   Kort houden blijft wel de bedoeling: hoe minder bijna-synoniemen, hoe groter de kans dat
   hetzelfde gebrek twee vergaderingen na elkaar dezelfde naam krijgt — en dat is wat het blok
   "Nog steeds open" laat werken. */
const WOORDSLEUTEL="werfpunten-gebrekwoorden";
let STANDAARDWOORDEN=null;

/* Per profiel een eigen bewaarplaats: de soorten van een veiligheidscoördinator zijn andere
   soorten, en wat je voor het ene beroep aanpaste hoort niet in het andere te verschijnen.
   Het profiel van de architect houdt de oude sleutel, zodat wat er al stond gewoon blijft. */
function woordsleutel(){
  return profiel.sleutel==="architect"?WOORDSLEUTEL:(WOORDSLEUTEL+":"+profiel.sleutel);
}

function laadGebrekwoorden(){
  if(!STANDAARDWOORDEN)
    STANDAARDWOORDEN=Object.fromEntries(SOORTEN.map(s=>[s.sleutel,s.woorden.slice()]));
  let eigen=null;
  try{const r=localStorage.getItem(woordsleutel()); if(r)eigen=JSON.parse(r);}catch(e){}
  SOORTEN.forEach(s=>{
    s.woorden = eigen && Array.isArray(eigen[s.sleutel])
      ? eigen[s.sleutel] : STANDAARDWOORDEN[s.sleutel].slice();
  });
}

async function beheerGebrekwoorden(){
  const huidig=SOORTEN.map(s=>s.kop+": "+s.woorden.join(", ")).join("\n");
  const uitleg="Eén soort per regel:  Soort: woord, woord, woord\n"+
    "De soorten van het profiel ‘"+profiel.naam+"’ liggen vast — die dragen elk hun juridische\n"+
    "betekenis. De woorden erbinnen zijn van jou: vervang ze door wat je op jouw werven\n"+
    "werkelijk tegenkomt.\n\n"+
    "Houd ze kort en vermijd bijna-synoniemen. Eén “vocht” in plaats van vochtvlek naast\n"+
    "waterinsijpeling zorgt dat hetzelfde gebrek twee vergaderingen na elkaar dezelfde naam\n"+
    "krijgt — en dat is wat “Nog steeds open” laat werken.\n\n"+
    "Een regel weglaten laat die soort zonder woorden; je typt de tekst dan zelf.\n"+
    "Alles leeg laten zet de standaardlijsten terug.";
  const nieuw=await vraagTekst("Woorden per soort", uitleg, huidig);
  if(nieuw===null)return;
  if(!nieuw.trim()){
    try{localStorage.removeItem(woordsleutel())}catch(e){}
    laadGebrekwoorden();
    melding("Standaardwoorden teruggezet");
    return;
  }
  const sleutelvan=t=>{
    const w=(t||"").trim().toLowerCase().replace(/\s+/g,"");
    const s=SOORTEN.find(o=>o.sleutel===w||o.kop.toLowerCase().replace(/\s+/g,"")===w);
    return s?s.sleutel:null;
  };
  const eigen=Object.fromEntries(SOORTEN.map(s=>[s.sleutel,[]]));
  nieuw.split("\n").forEach(regel=>{
    const d=regel.indexOf(":");
    if(d<0)return;
    const sl=sleutelvan(regel.slice(0,d));
    if(!sl)return;
    eigen[sl]=regel.slice(d+1).split(",").map(w=>w.trim()).filter(Boolean);
  });
  try{localStorage.setItem(woordsleutel(),JSON.stringify(eigen))}catch(e){}
  laadGebrekwoorden();
  const totaal=Object.values(eigen).reduce((n,a)=>n+a.length,0);
  melding(totaal+" woorden bewaard");
}

const HOOFDSTUKSLEUTEL="werfpunten-hoofdstukken";
const STANDAARDHOOFDSTUKKEN=[
  {nr:"01", naam:"afbraak en voorbereiding"},
  {nr:"02", naam:"grondwerken"},
  {nr:"03", naam:"funderingen"},
  {nr:"04", naam:"riolering"},
  {nr:"05", naam:"ruwbouw"},
  {nr:"06", naam:"gevel"},
  {nr:"07", naam:"dak"},
  {nr:"08", naam:"buitenschrijnwerk"},
  {nr:"09", naam:"binnenschrijnwerk"},
  {nr:"10", naam:"technieken"},
  {nr:"11", naam:"pleisterwerk"},
  {nr:"12", naam:"vloeren"},
  {nr:"13", naam:"schilderwerk"},
  {nr:"14", naam:"omgevingsaanleg"}
];
let hoofdstukken=[];
function laadHoofdstukken(){
  try{const r=localStorage.getItem(HOOFDSTUKSLEUTEL);
    hoofdstukken=r?(JSON.parse(r)||[]):STANDAARDHOOFDSTUKKEN.slice();}
  catch(e){hoofdstukken=STANDAARDHOOFDSTUKKEN.slice();}
}
function bewaarHoofdstukken(){
  try{localStorage.setItem(HOOFDSTUKSLEUTEL,JSON.stringify(hoofdstukken))}catch(e){}
}
function hoofdstukVan(nr){return hoofdstukken.find(h=>h.nr===nr)||null;}

async function beheerHoofdstukken(){
  const huidig=hoofdstukken.map(h=>h.nr+" = "+h.naam).join("\n");
  const uitleg="Eén hoofdstuk per regel:  NUMMER = naam\n"+
    "Neem de hoofdstukken en nummers over uit het bestek van dit project. Elk punt dat je aan een\n"+
    "hoofdstuk hangt, verwijst daarmee naar het contract in plaats van naar een mening.\n\n"+
    "Voorbeeld:\n07 = dak\n12 = vloeren\n\n"+
    "Leeg laten zet de standaardlijst terug.";
  const nieuw=await vraagTekst("Bestekhoofdstukken", uitleg, huidig);
  if(nieuw===null)return;
  hoofdstukken=nieuw.split("\n").map(r=>r.trim()).filter(Boolean).map(r=>{

    "Rollen in het profiel ‘"+profiel.naam+"’: "+ROLLEN.map(r=>r.naam).join(" · ")+"\n\n"+
    // Firma's als voorbeeld en geen persoonsnaam: een contact is even vaak een bedrijf, en een
    // naam in het voorbeeld suggereert dat je er een moet intikken.
    "Voorbeeld:\nAannemer BV = AB = "+ROLLEN[0].naam+"\nGemeente = GEM = "+ROLLEN[1].naam;

/* Vegen naar links legt de verwijderknop bloot. Verwijderen vraagt dus altijd een
   tweede, bewuste handeling - en blijft daarna nog even terug te draaien. */
const VEEG=96;
function sluitAlle(behalve){
  document.querySelectorAll(".punt.open").forEach(el=>{ if(el!==behalve) el.classList.remove("open"); });
}
function maakVeegbaar(el){
  let x0=null,y0=null,dx=0,sleept=false;
  el.addEventListener("pointerdown",e=>{
    if(e.target.closest(".wisknop"))return;
    x0=e.clientX;y0=e.clientY;dx=0;sleept=false;el.style.transition="none";
  });
  el.addEventListener("pointermove",e=>{
    if(x0===null)return;
    const vx=e.clientX-x0, vy=e.clientY-y0;
    if(!sleept && Math.abs(vx)>8 && Math.abs(vx)>Math.abs(vy)){sleept=true;sluitAlle(el);}
    if(!sleept)return;
    dx=Math.max(-VEEG,Math.min(0,vx + (el.classList.contains("open")?-VEEG:0)));
    el.style.transform="translateX("+dx+"px)";
  });
  const eind=()=>{
    if(x0===null)return;
    el.style.transition="";el.style.transform="";
    if(sleept) el.classList.toggle("open", dx < -VEEG/2);
    x0=null;sleept=false;
  };
  el.addEventListener("pointerup",eind);
  el.addEventListener("pointercancel",eind);
  el.addEventListener("pointerleave",eind);
  el.addEventListener("click",e=>{
    if(sleept||el.classList.contains("open")){e.stopPropagation();sluitAlle(null);}
  },true);
}

let laatstVerwijderd=null;
async function verwijderPunt(id){
  const idx=staat.punten.findIndex(x=>x.id===id); if(idx<0)return;
  const p=staat.punten[idx];
  const blob=p.foto?await haalFoto(id):null;
  laatstVerwijderd={punt:p,index:idx,blob};
  staat.punten.splice(idx,1);
  bewaarStaat(); await tekenLijst();
  meldingMetActie("Punt verwijderd","Ongedaan maken",async()=>{
    if(!laatstVerwijderd)return;
    const g=laatstVerwijderd;
    staat.punten.splice(Math.min(g.index,staat.punten.length),0,g.punt);
    if(g.blob) await zetFoto(g.punt.id,g.blob);
    laatstVerwijderd=null;bewaarStaat();tekenLijst();
  });
}

async function bewerkPunt(id){
  const p=staat.punten.find(x=>x.id===id); if(!p) return;
  const huidig=(p.spreker?p.spreker+": ":"")+(p.tekst||"");
  const codes=contacten.map(c=>c.code).join(" · ");
  const nieuw=await vraagTekst("Notitie — "+p.zone+", "+p.tijd,
    codes? "Begin met een code om toe te wijzen:  "+codes : "", huidig);
  if(nieuw===null) return;
  let tekst=nieuw.trim(), spreker=null;
  const m=tekst.match(/^([A-Za-z0-9]{1,4})\s*:\s*(.*)$/);
  if(m){spreker=m[1].toUpperCase();tekst=m[2].trim();}
  p.tekst=tekst; p.spreker=spreker;
  if(tekst)delete p.onaf;          // woorden erbij is precies wat "onaf" nog miste
  raakAan(p);
  bewaarStaat(); tekenLijst();
}

/* ---- back-up en herstel ----
   Alles staat op één toestel. Voor een app die zichzelf als bewijsmateriaal aandient is dat het
   grootste risico dat erin zit — groter dan welke ontbrekende functie ook. Eén verloren telefoon
   is een verloren dossier, en een vaststelling die je niet meer kunt tonen is geen vaststelling.

   Daarom: één bestand met álles erin, dat je zelf wegzet waar je wil. Geen server, geen account,
   geen abonnement — dezelfde eigenschap die de app op de werf bruikbaar houdt.

   Het bestand draagt bewust een `toestel` en een tijdstempel, en elk punt krijgt bij elke
   wijziging een `gewijzigd`. Dat is nu nergens voor nodig; het is het minimum waarmee twee
   toestellen later samengevoegd kunnen worden zonder dat het formaat op de schop moet.

   Foto's zitten er op ware grootte in, want een back-up die minder bewaart dan het origineel is
   geen back-up. Dat valt mee: de app verkleint elke foto al bij het maken tot 1400 px, dus een
   vergadering van dertig foto's weegt een stuk of tien megabyte. Het lichte formaat is voor het
   verslag, niet voor de kluis. */
const BACKSLEUTEL="werfpunten-backup";
const TOESTELSLEUTEL="werfpunten-toestel";

function toestelId(){
  try{
    let t=localStorage.getItem(TOESTELSLEUTEL);
    if(!t){t="t"+Math.random().toString(36).slice(2,10);localStorage.setItem(TOESTELSLEUTEL,t);}
    return t;
  }catch(e){return "t?";}
}

/* Elke wijziging aan een punt krijgt een tijdstempel. Zonder dat kan een latere samenvoeging niet
   uitmaken welke van twee versies de jongste is, en dan wordt het raden. */
function raakAan(p){ if(p) p.gewijzigd=new Date().toISOString(); return p; }

function blobNaarTekst(b){return new Promise(res=>{
  const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>res(null);r.readAsDataURL(b);
});}
function tekstNaarBlob(s){
  try{
    const [kop,data]=s.split(",");
    const soort=(kop.match(/:(.*?);/)||[])[1]||"application/octet-stream";
    const bin=atob(data), arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    return new Blob([arr],{type:soort});
  }catch(e){return null;}
}
function alleSleutels(winkel){return new Promise(res=>{
  if(!db)return res([]);
  const q=db.transaction(winkel,"readonly").objectStore(winkel).getAllKeys();
  q.onsuccess=()=>res(Array.from(q.result||[]));q.onerror=()=>res([]);
});}

async function maakBackup(){
  const plannen={};
  for(const z of await alleSleutels("plannen"))plannen[z]=await haalPlan(z);
  // paren, geen object: een JSON-sleutel is altijd tekst, dus een id die géén tekst is zou bij
  // het terugzetten stilletjes van soort veranderen en de foto onvindbaar maken
  const fotos=[];
  for(const id of await alleSleutels("fotos")){
    const b=await haalFoto(id);
    if(b)fotos.push([id,await blobNaarTekst(b)]);
  }
  return {
    formaat:"werfpunten-backup", versie:1,
    gemaakt:new Date().toISOString(), toestel:toestelId(), app:VERSIE,
    staat, contacten, plannen, fotos,
    dagen:await haalDagen()
  };
}

async function herstelBackup(d){
  if(!d||d.formaat!=="werfpunten-backup")throw new Error("geen back-upbestand");
  if(d.staat){staat=d.staat;bewaarStaat();}
  if(d.contacten){contacten=d.contacten;bewaarContacten();}
  for(const [z,p] of Object.entries(d.plannen||{}))if(p)await zetPlan(z,p);
  for(const dag of d.dagen||[])if(dag&&dag.datum)await zetDag(dag.datum,dag);
  for(const [id,s] of (Array.isArray(d.fotos)?d.fotos:Object.entries(d.fotos||{}))){
    const b=tekstNaarBlob(s);
    if(b)await zetFoto(id,b);
  }
  archief=await haalDagen();
  planLijst=await planZones();
}

function tel(d){
  return {punten:(d.staat&&d.staat.punten||[]).length,
          dagen:(d.dagen||[]).length,
          plannen:Object.keys(d.plannen||{}).length,
          fotos:(Array.isArray(d.fotos)?d.fotos:Object.keys(d.fotos||{})).length};
}

document.getElementById("backup").onclick=async()=>{
  melding("Back-up wordt gemaakt…");
  let d;
  try{d=await maakBackup();}catch(e){melding("Back-up mislukt: "+(e.message||"onbekende fout"));return;}
  const tekst=JSON.stringify(d);
  const t=tel(d);
  const naam="werfpunten-"+staat.datum+".werfback";
  try{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([tekst],{type:"application/json"}));
    a.download=naam;
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  }catch(e){melding("Bewaren lukte niet in deze browser");return;}
  try{localStorage.setItem(BACKSLEUTEL,d.gemaakt);}catch(e){}
  merkBackupknop();
  meldingMetActie(naam+" — "+t.punten+" punten, "+t.plannen+" plannen, "+t.fotos+" foto's, "+
    Math.round(tekst.length/1e6*10)/10+" MB","terugzetten",kiesHerstel);
};

function kiesHerstel(){document.getElementById("backupbestand").click();}

document.getElementById("backupbestand").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";
  if(!f)return;
  let d;
  try{d=JSON.parse(await f.text());}
  catch(err){melding((f.name||"bestand")+" is geen back-up");return;}
  if(!d||d.formaat!=="werfpunten-backup"){melding((f.name||"bestand")+" is geen back-up");return;}
  const t=tel(d);
  const eigen=d.toestel===toestelId();
  // wat er nú staat alleen tellen, niet inpakken: een back-up maken om te kunnen tellen zou
  // elke foto voor niets omzetten
  const nu={punten:(staat.punten||[]).length, dagen:archief.length,
            plannen:(await alleSleutels("plannen")).length};
  const regels=[
    "Back-up van <b>"+(d.gemaakt||"").slice(0,10)+"</b>"+(eigen?" van dit toestel":" van een ánder toestel")+
      ", gemaakt met "+(d.app||"een oudere versie")+".",
    "Erin: <b>"+t.punten+"</b> punten van die dag, "+t.dagen+" gearchiveerde vergaderingen, "+
      t.plannen+" plannen en "+t.fotos+" foto's.",
    "<b>Terugzetten overschrijft wat er nu op dit toestel staat</b> — nu "+nu.punten+" punten, "+
      nu.dagen+" vergaderingen, "+nu.plannen+" plannen. Wat in de back-up niet voorkomt maar hier "+
      "wel, blijft staan: plannen en vergaderingen worden aangevuld, de dag zelf wordt vervangen.",
    "Twijfel je? Maak eerst een back-up van wat er nú staat."
  ];
  if(!await vraagJa("Back-up terugzetten",regels,"Terugzetten"))return;
  try{await herstelBackup(d);}
  catch(err){melding("Terugzetten mislukt: "+(err.message||"onbekende fout"));return;}
  await tekenLijst();tekenZones();merkPlanknop();merkBackupknop();
  melding(t.punten+" punten en "+t.plannen+" plannen teruggezet");
};

/* Herinneren, niet zeuren: één keer bij het openen, en alleen als er sinds de laatste back-up
   werkelijk iets bijgekomen is. Wie het negeert, ziet het morgen weer. */
function merkBackupknop(){
  const k=document.getElementById("backup");
  if(k)k.classList.toggle("wacht",backupAchterstand());
}

function backupAchterstand(){
  let laatst=null;
  try{laatst=localStorage.getItem(BACKSLEUTEL);}catch(e){}
  const jongste=(staat.punten||[]).reduce((m,p)=>{
    const t=p.gewijzigd||null; return t&&(!m||t>m)?t:m;},null);
  if(!(staat.punten||[]).length&&!archief.length)return false;
  if(!laatst)return true;
  if(jongste&&jongste>laatst)return true;
  // ook een gearchiveerde vergadering die na de laatste back-up is afgesloten telt
  return archief.some(d=>d.datum>laatst.slice(0,10));
}

/* ---- de keet ----
   Op de werf vang je, in de keet werk je af. Dat zijn twee verschillende handelingen op twee
   momenten, en de app kende alleen de eerste. Wat er in de keet gebeurt is niet "de notities
   netjes maken" maar de handeling waar het hele verslag op steunt: beslissen wát elke
   vaststelling ís. Een verbod is een rechtshandeling van de architect. Een aanwijzing aan de
   aannemer valt binnen de aanneming. Aan de opdrachtgever leg je voor, je draagt hem niets op.
   Wie dat door elkaar haalt schrijft zijn eigen aansprakelijkheid op.

   Daarom staat de gevolgtrekking hier voluit op het scherm zodra je iemand kiest. Niet als
   uitleg achteraf maar op het moment van de keuze, want dat is waar ze telt.

   Eén punt tegelijk en groot, zodat het scherm rond de tafel kan. De foto ernaast is wat het
   gesprek stuurt: je schrijft de woorden erbij terwijl je ernaar kijkt. */
/* De woordenlijst waaruit een vaststelling wordt opgebouwd staat in het profiel hierboven.
   Bewust klein en bewust saai: het zijn de dingen die op elke werf terugkomen, in de taal van een
   verslag. Tik aan wat je ziet en de zin schrijft zichzelf — sneller dan typen, en het levert
   elke keer dezelfde formulering, wat in een dossier meer waard is dan variatie.

   Wat er níet in staat is een gevolg: geen "moet hersteld worden", geen "is niet conform". Een
   vaststelling stelt vast. Wat er moet gebeuren volgt uit aan wie je het punt toewijst, en dat
   zet het verslag er zelf bij. Twee keer hetzelfde zeggen is twee keer kunnen tegenspreken. */
let keet={i:0,lijst:[],gebrek:null,woordenOpen:null,hoofdstuk:null};

/* De zin uit wat je aantikte plus wat de app al weet. Niets hiervan is verzonnen: de plaats komt
   uit de pin, de woorden uit jouw keuze. Daarom kan er ook niets fout in staan wat jij niet zelf
   hebt aangewezen. */
function keetZin(p){
  if(!keet.gebrek)return "";
  const plek=p.plek&&p.plek.lokaal?("In "+p.plek.lokaal):
             (p.plek?("Op "+p.zone+" ("+plaatsKort(p.plek)+")"):("Op "+p.zone));
  return plek+" "+keet.gebrek+" vastgesteld.";
}

function keetPunt(){return keet.lijst[keet.i]||null;}

function keetDatum(dagen){
  const d=new Date();d.setDate(d.getDate()+dagen);
  return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");
}

async function keetToon(){
  const p=keetPunt();
  const vg=document.getElementById("keet-voortgang");
  if(!p){document.getElementById("keetdlg").close();return;}
  const onaf=keet.lijst.filter(x=>x.onaf).length;
  vg.textContent=(keet.i+1)+" / "+keet.lijst.length+(onaf?("  ·  "+onaf+" onaf"):"");

  const img=document.getElementById("keet-foto");
  img.hidden=!p.foto;
  if(p.foto){
    const b=await haalFoto(p.id);
    if(b){img.src=URL.createObjectURL(b);
      img.onclick=()=>{document.getElementById("keetdlg").close();openTekenscherm(b,p.id);};}
  }

  const pk=document.getElementById("keet-plek");
  pk.innerHTML="";
  const wat=document.createElement("span");
  wat.textContent=p.zone+" · "+p.tijd+" · "+(p.plek?("📍 "+(p.plek.lokaal||plaatsKort(p.plek))):"geen plek");
  pk.appendChild(wat);
  const zet=document.createElement("button");
  zet.type="button";zet.style.marginLeft="8px";
  zet.textContent=p.plek?"plek rechtzetten":"plek aanduiden";
  zet.onclick=()=>{document.getElementById("keetdlg").close();openPlan(p.plek?p.plek.zone:undefined);};
  pk.appendChild(zet);

  // Het hoofdstuk blijft gelden voor het volgende punt, net als de plek: werk je aan het dak,
  // dan gaan er meestal meerdere punten na elkaar over het dak. Zo kost het nul tikken.
  const hs=document.getElementById("keet-hoofdstuk");
  hs.innerHTML="";
  const leeg=document.createElement("option");
  leeg.value="";leeg.textContent="— geen hoofdstuk —";hs.appendChild(leeg);
  hoofdstukken.forEach(h=>{
    const o=document.createElement("option");
    o.value=h.nr;o.textContent=h.nr+" · "+h.naam;hs.appendChild(o);
  });
  if(!p.hoofdstuk&&keet.hoofdstuk)p.hoofdstuk=keet.hoofdstuk;
  hs.value=p.hoofdstuk||"";
  hs.onchange=()=>{
    p.hoofdstuk=hs.value||null;
    keet.hoofdstuk=hs.value||null;
    raakAan(p);bewaarStaat();keetToon();
  };

  const ta=document.getElementById("keet-tekst");
  ta.value=p.tekst||"";

  const wd=document.getElementById("keet-woorden");
  // open bij een punt zonder woorden — dán heb je hem nodig; anders uit de weg, want de lijst
  // duwt de rest van het scherm anders ver naar beneden
  if(keet.woordenOpen===null||keet.woordenOpen===undefined)keet.woordenOpen=!p.tekst;
  wd.hidden=!keet.woordenOpen;
  // De kop van de lijst is de gewone gang van zaken van dit beroep — de soort zonder eigen
  // verslagblok. Heeft het profiel die niet, dan is "Vaststelling" wat er overblijft.
  const eerste=SOORTEN.find(o=>!o.blok);
  document.getElementById("keet-vouwwoorden").textContent=
    ((eerste&&eerste.kop)||"Vaststelling")+" "+(keet.woordenOpen?"▴":"▾");
  wd.innerHTML="";
  SOORTEN.forEach(soort=>{
    // De kop is zelf een knop. Anders is een soort zonder woorden onbereikbaar, en kun je de
    // soort van een bestaand punt niet wijzigen zonder de tekst opnieuw te laten schrijven.
    const kop=document.createElement("button");
    kop.type="button";
    kop.className="keet-soortkop"+(p.soort===soort.sleutel?" actief":"");
    kop.textContent=soort.kop;
    kop.title=soort.uitleg;
    kop.onclick=()=>{
      if(p.soort===soort.sleutel)delete p.soort; else p.soort=soort.sleutel;
      raakAan(p);bewaarStaat();keetToon();
    };
    wd.appendChild(kop);
    const rij=document.createElement("div");rij.className="keet-woordrij";
    soort.woorden.forEach(g=>{
      const b=document.createElement("button");
      b.type="button";b.textContent=g;
      if(keet.gebrek===g)b.className="actief";
      b.onclick=()=>{
        const uit=keet.gebrek===g;               // nog eens tikken zet hem weer af
        keet.gebrek=uit?null:g;
        if(uit)delete p.soort; else p.soort=soort.sleutel;
        const zin=keetZin(p);
        if(zin){p.tekst=zin;delete p.onaf;}
        raakAan(p);bewaarStaat();
        keetToon();
      };
      rij.appendChild(b);
    });
    wd.appendChild(rij);
  });

  // wie moet er iets mee — de rol erbij, want die bepaalt wat het wordt
  const aan=document.getElementById("keet-aan");
  aan.innerHTML="";
  const maak=(label,code,titel)=>{
    const b=document.createElement("button");
    b.type="button";b.textContent=label;if(titel)b.title=titel;
    if((p.aan||null)===code)b.className="actief";
    b.onclick=()=>{p.aan=code;raakAan(p);bewaarStaat();keetToon();};
    aan.appendChild(b);
  };
  maak("niemand",null,"blijft een vaststelling zonder opdracht");
  const rolnaam=sl=>{const r=ROLLEN.find(o=>o.sleutel===sl);return r?r.naam:sl;};
  contacten.forEach(c=>maak(c.naam+(c.rol?" · "+rolnaam(c.rol):""),c.code,
    c.rol?"":"deze contactpersoon heeft nog geen rol — het punt valt dan onder “Op te volgen”"));
  if(!contacten.length){
    const w=document.createElement("span");
    w.className="keet-uitleg";
    w.textContent="Nog geen contacten. Voeg ze toe op het hoofdscherm; de rol erbij bepaalt onder welke kop een punt belandt.";
    aan.appendChild(w);
  }

  // wat de keuze juridisch betekent, op het moment van de keuze
  const rol=p.aan?rolVan(p.aan):null;
  const soort=SOORTEN.find(o=>o.sleutel===p.soort);
  const u=document.getElementById("keet-uitleg");
  // De soort gaat voor op de rol. Een beschadiging aan de aannemer toewijzen onder "uit te
  // voeren binnen de aanneming" is precies de fout die het onderscheid moet voorkomen.
  if(p.verbod&&profiel.bijzonder)
    u.textContent=profiel.bijzonder.uitleg;
  // De scherpste soort van een profiel waarschuwt op het moment van de keuze zelf: wijs je die
  // toe aan de verkeerde rol, dan staat er iets wat je niet kunt waarmaken.
  else if(soort&&soort.waarschuwing&&rol&&rol.sleutel===soort.waarschuwtBij)
    u.textContent=soort.waarschuwing;
  // Een soort zonder eigen blok is de gewone gang van zaken; die loopt via de rol.
  else if(soort&&soort.blok)u.textContent=soort.kop+" — "+soort.uitleg+
    (p.aan?"":". Wijs nog aan wie er iets mee moet.");
  else if(rol)u.textContent=rol.kop+" — "+(rol.toelichting||"geen uitvoeringsopdracht");
  else if(p.aan)u.textContent="Deze contactpersoon heeft geen rol, dus dit punt komt onder “Op te volgen”.";
  else u.textContent="Zonder toewijzing blijft dit een vaststelling in het verslag.";

  const vb=document.getElementById("keet-verbod");
  vb.className=p.verbod?"actief":"";
  document.getElementById("keet-urgent").className=p.urgent?"actief":"";

  // Wat het verslag er straks zelf bij zet. Zo zie je dat het gevolg gedekt is zonder het in de
  // zin te herhalen — twee keer hetzelfde zeggen is twee keer kunnen tegenspreken.
  const gv=document.getElementById("keet-gevolg");
  const naam=p.aan?((contacten.find(c=>c.code===p.aan)||{}).naam||p.aan):null;
  const bij=[];
  if(naam)bij.push("→ "+naam);
  if(p.deadline)bij.push("tegen "+p.deadline);
  if(p.verbod)bij.unshift("⛔ verbod");
  if(p.urgent)bij.unshift("🔴 urgent");
  const h=p.hoofdstuk?hoofdstukVan(p.hoofdstuk):null;
  if(h)bij.unshift("hoofdstuk "+h.nr+" "+h.naam);
  gv.textContent=bij.length?("Het verslag zet hier zelf bij: "+bij.join(", ")+"."):"";

  const dl=document.getElementById("keet-deadline");
  dl.innerHTML="";
  const dknop=(label,waarde)=>{
    const b=document.createElement("button");
    b.type="button";b.textContent=label;
    if((p.deadline||null)===waarde)b.className="actief";
    b.onclick=()=>{p.deadline=waarde;raakAan(p);bewaarStaat();keetToon();};
    dl.appendChild(b);
  };
  dknop("geen",null);
  dknop("+1 week",keetDatum(7));
  dknop("+2 weken",keetDatum(14));
  dknop("+1 maand",keetDatum(30));
  const eigen=document.createElement("input");
  eigen.type="date";eigen.style.cssText="font-size:14px;padding:8px";
  eigen.onchange=()=>{
    if(!eigen.value)return;
    const d=new Date(eigen.value);
    p.deadline=String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");
    raakAan(p);bewaarStaat();keetToon();
  };
  dl.appendChild(eigen);
}

/* Elke knop hertekent het scherm, en dat zou de tekst die je net intikte overschrijven met wat
   er al stond. Dus schrijven we bij elke aanslag door naar het punt zelf; naar de opslag gaan we
   pas bij het bladeren, want localStorage bij elke letter is zonde. */
document.getElementById("keet-tekst").oninput=()=>{
  const p=keetPunt();
  if(!p)return;
  p.tekst=document.getElementById("keet-tekst").value;
  if(p.tekst.trim())delete p.onaf; else p.onaf=true;
};

function keetBewaarTekst(){
  const p=keetPunt();
  if(!p)return;
  const t=document.getElementById("keet-tekst").value.trim();
  p.tekst=t;
  if(t)delete p.onaf; else p.onaf=true;
  raakAan(p);bewaarStaat();
}

function keetGa(stap){
  keetBewaarTekst();
  const n=keet.i+stap;
  if(n<0||n>=keet.lijst.length)return;
  keet.i=n;keet.gebrek=null;keet.woordenOpen=null;keetToon();
}

function openKeet(){
  if(!staat.punten.length){melding("Nog geen punten om af te werken");return;}
  keet.lijst=staat.punten;keet.i=0;
  const dlg=document.getElementById("keetdlg");
  if(!dlg.open)dlg.showModal();
  keetToon();
}

document.getElementById("keet").onclick=openKeet;
document.getElementById("keet-vouwwoorden").onclick=()=>{
  keet.woordenOpen=!keet.woordenOpen;keetToon();
};
document.getElementById("keet-vorige").onclick=()=>keetGa(-1);
document.getElementById("keet-volgende").onclick=()=>keetGa(1);
document.getElementById("keet-woordbeheer").onclick=async()=>{
  await beheerGebrekwoorden();keetToon();
};
document.getElementById("keet-hoofdstukbeheer").onclick=async()=>{
  await beheerHoofdstukken();keetToon();
};
document.getElementById("keet-urgent").onclick=()=>{
  const p=keetPunt();if(!p)return;
  p.urgent=!p.urgent;raakAan(p);bewaarStaat();keetToon();
};
document.getElementById("keet-verbod").onclick=()=>{
  const p=keetPunt();if(!p)return;
  p.verbod=!p.verbod;raakAan(p);bewaarStaat();keetToon();
};
document.getElementById("keet-klaar").onclick=async()=>{
  keetBewaarTekst();
  document.getElementById("keetdlg").close();
  await tekenLijst();merkBackupknop();
  const onaf=staat.punten.filter(p=>p.onaf).length;
  melding(onaf?(onaf+" punt"+(onaf===1?"":"en")+" nog zonder woorden")
             :"Alles afgewerkt — klaar voor het verslag");
};

/* ---- snelvastleggen ----
   Het tempo ligt bij het gesprek, niet bij jou. Je loopt met de aannemer en de bouwheer; die
   wijzen iets aan, zeggen er iets over en stappen door. Elke tussenvraag — "opslaan?", "ok?",
   "annoteren?" — is een stop, en na drie stops staat het gezelschap al twee euvels verder en
   noteer je de rest op papier. Dat is niet traagheid maar afhaken, en het is precies waar een
   verslag in tweeën breekt.

   Dus: de sluiter maakt een punt. Meer niet. Geen voorbeeld, geen bevestiging, geen naam. De foto
   ís de vaststelling; de woorden komen in de keet, met het beeld erbij. De plek die geldt gaat
   mee zoals ze is — klopt ze niet precies, dan zet je dat later recht, want een pin een halve
   meter verleggen terwijl iemand tegen je praat is dezelfde stop.

   Daarom slaan we de camera van het toestel over: die dwingt op iOS een "Retake / Use Photo"
   tussen elke opname. Een eigen sluiter op de videostroom heeft die stap niet. Lukt dat niet —
   geen toestemming, geen camera — dan valt het terug op de gewone fotoknop, mét die tussenstap,
   want een trage weg is nog altijd beter dan geen. */
let snel={stroom:null,aantal:0,bezig:false};

function snelPlekTekst(){
  if(!wachtendePlek)return "📍 —";
  return "📍 "+(wachtendePlek.lokaal||(Math.round(wachtendePlek.x)+","+Math.round(wachtendePlek.y)));
}

async function openSnel(){
  const dlg=document.getElementById("sneldlg");
  const mislukt=document.getElementById("snel-mislukt");
  snel.aantal=0;
  document.getElementById("snel-teller").textContent="0";
  document.getElementById("snel-plek").textContent=snelPlekTekst();
  mislukt.hidden=true;
  if(!dlg.open)dlg.showModal();
  try{
    snel.stroom=await navigator.mediaDevices.getUserMedia(
      {video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1440}},audio:false});
    const v=document.getElementById("snelbeeld");
    v.srcObject=snel.stroom;
    await v.play().catch(()=>{});
  }catch(e){
    mislukt.hidden=false;
    mislukt.innerHTML="";
    const p=document.createElement("p");
    p.style.margin="0";
    p.textContent=(e&&e.name==="NotAllowedError")
      ? "De camera is niet vrijgegeven voor deze app. Zet dat aan bij de instellingen van je browser, of gebruik de gewone fotoknop."
      : "Geen camera beschikbaar in deze weergave.";
    mislukt.appendChild(p);
    const k=document.createElement("button");
    k.type="button";k.textContent="Gewone fotoknop";
    k.style.cssText="background:#ffffff22;color:#fff;border:1px solid #ffffff44";
    k.onclick=()=>{sluitSnel();document.getElementById("foto").click();};
    mislukt.appendChild(k);
    return;
  }
  // Er ligt een plan maar er geldt geen plek: dan dragen twintig foto's straks geen enkele
  // coördinaat, en dat is werk dat je in de keet dubbel betaalt. Zeggen, niet tegenhouden —
  // soms wíl je gewoon schieten en later plaatsen.
  if(!wachtendePlek&&planLijst.length)
    melding("Geen plek ingesteld — deze foto's krijgen er geen");
}

function sluitSnel(){
  if(snel.stroom){snel.stroom.getTracks().forEach(t=>t.stop());snel.stroom=null;}
  const v=document.getElementById("snelbeeld");
  if(v)v.srcObject=null;
  const dlg=document.getElementById("sneldlg");
  if(dlg.open)dlg.close();
}

async function knip(){
  if(snel.bezig)return;                      // dubbeltik mag geen twee punten maken
  const v=document.getElementById("snelbeeld");
  if(!v||!v.videoWidth){melding("Nog geen beeld");return;}
  snel.bezig=true;
  try{
    const max=1400, sc=Math.min(1,max/Math.max(v.videoWidth,v.videoHeight));
    const c=document.createElement("canvas");
    c.width=Math.round(v.videoWidth*sc); c.height=Math.round(v.videoHeight*sc);
    c.getContext("2d").drawImage(v,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.75));
    if(!blob)throw new Error("geen beeld");
    const id="p"+Date.now()+"-"+snel.aantal;
    const punt=raakAan({id,zone:staat.zone,tekst:"",spreker:null,
      tijd:new Date().toTimeString().slice(0,5),foto:true,bijlage:null,
      plek:wachtendePlek, onaf:true});
    await zetFoto(id,blob);
    staat.punten.push(punt); bewaarStaat();
    snel.aantal++;
    document.getElementById("snel-teller").textContent=String(snel.aantal);
    const f=document.getElementById("snelflits");
    f.classList.remove("aan"); void f.offsetWidth; f.classList.add("aan");
    merkBackupknop();
  }catch(e){
    melding("Vastleggen mislukt");
  }
  snel.bezig=false;
}

document.getElementById("snel-knip").onclick=knip;
document.getElementById("snel-stop").onclick=async()=>{
  const n=snel.aantal;
  sluitSnel();
  await tekenLijst();
  if(n)melding(n+(n===1?" foto vastgelegd":" foto's vastgelegd")+" — de woorden komen in de keet");
};
document.getElementById("snel-plek").onclick=()=>{
  // de plek rechtzetten is een andere handeling; die hoort niet tussen twee opnames
  sluitSnel();
  openPlan(wachtendePlek?wachtendePlek.zone:undefined);
};
document.getElementById("snelknop").onclick=openSnel;
document.getElementById("pl-snel").onclick=()=>{
  document.getElementById("plandlg").close();
  openSnel();
};

function verkleinFoto(file){return new Promise(res=>{
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=1400,sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=img.width*sc;c.height=img.height*sc;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>res(b||file),"image/jpeg",.75);
    };
    img.onerror=()=>res(file);
    img.src=r.result;
  };
  r.onerror=()=>res(file);
  r.readAsDataURL(file);
});}

/* Eerste tik maakt de foto; is er al een foto, dan opent dezelfde knop het tekenscherm.
   Zo kun je meteen aanduiden wat je bedoelt, vóór het punt bewaard is. */
document.getElementById("fotoknop").onclick=()=>{
  if(wachtendeFoto && (!wachtendeBijlage || wachtendeBijlage.beeld!==false)){
    openTekenscherm(wachtendeFoto,"nieuw");
  }else{
    document.getElementById("foto").click();
  }
};
document.getElementById("docknop").onclick=()=>document.getElementById("doc").click();

/* Scans en documenten: de knop opent de keuze van iOS — fotheek, Bestanden, of camera.
   Een plan, een papier of een bon scan je met de scanner van Notities of Bestanden
   (die maakt een PDF) en kies je hier; de app bewaart hem bij het punt. */
document.getElementById("doc").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const isBeeld=f.type.startsWith("image/");
  wachtendeFoto = isBeeld ? await verkleinFoto(f) : f;
  wachtendeBijlage = {naam:f.name||"document", type:f.type||"onbekend", beeld:isBeeld,
                      grootte:Math.round((f.size||0)/1024)};
  const k=document.getElementById("docknop");k.classList.add("heeft");k.textContent="✓ Doc";
  document.getElementById("bewaar").disabled=false;
};
document.getElementById("foto").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  wachtendeFoto=await verkleinFoto(f);
  const k=document.getElementById("fotoknop");k.classList.add("heeft");k.textContent="✏️ Aanduiden";
  document.getElementById("bewaar").disabled=false;
  // ook op de kaart moet je zien dat er een foto klaarstaat
  const pf=document.getElementById("pl-foto");
  if(pf){pf.classList.add("heeft");pf.textContent="📷 ✓";}
};

const tekstEl=document.getElementById("tekst");
tekstEl.oninput=()=>{
  document.getElementById("bewaar").disabled=!(tekstEl.value.trim()||wachtendeFoto);
  tekenSprekers();
};

/* Eén plek waar een punt ontstaat, aangeroepen vanuit het hoofdscherm én vanaf de kaart.
   `bron` bepaalt alleen waar de tekst vandaan komt; de rest is identiek, zodat een punt van de
   kaart in niets verschilt van een punt uit de lijst. */
async function bewaarPunt(veld){
  const el=veld||tekstEl;
  let tekst=el.value.trim();
  if(!tekst&&!wachtendeFoto)return false;
  let spreker=null;
  const m=tekst.match(/^([A-Za-z0-9]{1,4})\s*:\s*(.*)$/);
  if(m){spreker=m[1].toUpperCase();tekst=m[2].trim();}
  const id="p"+Date.now();
  const punt=raakAan({id,zone:staat.zone,tekst:tekst,spreker,
    tijd:new Date().toTimeString().slice(0,5),foto:!!wachtendeFoto,bijlage:wachtendeBijlage,
    plek:wachtendePlek});
  if(wachtendeFoto)await zetFoto(id,wachtendeFoto);
  staat.punten.push(punt);bewaarStaat();
  el.value=""; if(el!==tekstEl)tekstEl.value="";
  wachtendeFoto=null;wachtendeBijlage=null;
  // De plek blijft staan. Je zegt één keer waar je bent en elk volgend punt landt daar, tot je
  // iets anders zegt — op een werf komen vaststellingen in trossen per ruimte. Zolang de plek
  // geldt staat ze op de knop, zodat je ziet dat ze meegaat.
  merkPlanknop();
  const k=document.getElementById("fotoknop");k.classList.remove("heeft");k.textContent="📷 Foto";
  const kd=document.getElementById("docknop");kd.classList.remove("heeft");kd.textContent="📄 Doc";
  const ks=document.getElementById("schetsknop");ks.classList.remove("heeft");ks.textContent="✏️ Schets";
  document.getElementById("bewaar").disabled=true;
  document.getElementById("foto").value="";document.getElementById("doc").value="";
  await tekenLijst();
  if(document.getElementById("plandlg").open) planVoet();
  melding("Punt "+staat.punten.length+" bewaard"+(wachtendePlek?(" in "+(wachtendePlek.lokaal||"deze plek")):""));
  if(!staat.weerdata) haalWeer(true);
  return true;
}
document.getElementById("bewaar").onclick=()=>bewaarPunt();

["weer","bezetting"].forEach(k=>{
  const el=document.getElementById(k);
  el.value=staat[k]||"";
  el.oninput=()=>{staat[k]=el.value;bewaarStaat();};
});


/* ---- weer: automatisch op basis van locatie + tijdstip ---- */
function weerOmschrijving(bew, neerslag){
  const lucht = bew < 20 ? "onbewolkt" : bew < 60 ? "halfbewolkt" : "bewolkt";
  return (neerslag > 0 ? "neerslag, " : "droog, ") + lucht;
}
async function haalWeer(stil){
  const k = document.getElementById("weerknop");
  const info = document.getElementById("weerinfo");
  k.classList.add("bezig");
  try{
    if(!staat.coords){
      const pos = await new Promise((res,rej)=>{
        if(!navigator.geolocation) return rej(new Error("geen locatiedienst"));
        navigator.geolocation.getCurrentPosition(res,rej,{timeout:9000,maximumAge:900000});
      });
      staat.coords={lat:+pos.coords.latitude.toFixed(4), lon:+pos.coords.longitude.toFixed(4)};
      bewaarStaat();
    }
    const {lat,lon}=staat.coords;
    const u="https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+
      "&current=temperature_2m,precipitation,wind_speed_10m,cloud_cover"+
      "&daily=temperature_2m_min,temperature_2m_max,precipitation_sum,wind_speed_10m_max"+
      "&forecast_days=1&timezone=Europe%2FBrussels";
    const d = await (await fetch(u)).json();
    const c=d.current, g=d.daily;
    staat.weerdata={
      moment:{tijd:c.time, temp:c.temperature_2m, neerslag:c.precipitation,
              wind:c.wind_speed_10m, bewolking:c.cloud_cover},
      dag:{min:g.temperature_2m_min[0], max:g.temperature_2m_max[0],
           neerslag:g.precipitation_sum[0], windmax:g.wind_speed_10m_max[0]},
      coords:staat.coords, opgehaald:new Date().toISOString()
    };
    const veld=document.getElementById("weer");
    const tekst=weerOmschrijving(c.cloud_cover,c.precipitation)+", "+Math.round(c.temperature_2m)+"°C, wind "+Math.round(c.wind_speed_10m)+" km/u";
    if(!veld.value.trim()){ veld.value=tekst; staat.weer=tekst; }
    info.textContent="dag: "+g.temperature_2m_min[0]+"–"+g.temperature_2m_max[0]+"°C · neerslag "+
      g.precipitation_sum[0]+" mm · max wind "+g.wind_speed_10m_max[0]+" km/u  (open-meteo, "+lat+","+lon+")";
    bewaarStaat();
    k.classList.add("klaar"); k.textContent="✓";
  }catch(e){
    if(!stil) melding("Weer niet opgehaald: "+(e.message||"geen netwerk"));
    // bestaande gegevens laten staan; alleen melden als er nog niets is
    if(!staat.weerdata){
      document.getElementById("weerinfo").textContent="weer nog niet opgehaald — knop rechts van W: (lukt zodra er netwerk is)";
    }
  }finally{ k.classList.remove("bezig"); }
}
document.getElementById("weerknop").onclick=()=>haalWeer(false);

/* prompt() is op iOS eenregelig; voor meerregelige invoer gebruiken we een eigen dialoog. */
