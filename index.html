/* ---- plan: één tik levert de plek ----
   De pin bewaart altijd zijn coördinaat op het plan. Het lokaalnummer is een etiket dat de app
   erbij zoekt; klopt het niet, of draagt het plan geen nummers, dan verandert dat niets aan de
   bruikbaarheid van de coördinaat. Je kunt een plek ook zelf benoemen — die naam gaat het plan
   in en geldt vanaf dan voor elk volgend punt op die plek. */
let planLijst=[];        // welke plannen op dit toestel staan: [{zone, ...}]
let plan=null;           // het plan dat nu open staat
let planBeeld=null;      // het ingeladen beeld
let wachtendePlek=null;  // de plek die geldt: blijft staan tot je hem wist of verlegt
let archief=[];          // vorige vergaderdagen, om te tonen wat er nog openstaat
const pl={schaal:1,dx:0,dy:0,pin:null,wijzers:new Map(),start:null,knijp:null,nummeren:false,gekozen:null};

function zetPlan(zone,data){return new Promise(res=>{
  if(!db)return res(false);
  const t=db.transaction("plannen","readwrite");t.objectStore("plannen").put(data,zone);
  t.oncomplete=()=>res(true);t.onerror=()=>res(false);
});}
function haalPlan(zone){return new Promise(res=>{
  if(!db)return res(null);
  const q=db.transaction("plannen","readonly").objectStore("plannen").get(zone);
  q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);
});}
/* Het archief: één record per vergaderdag. Zonder dit verdwijnt de vorige vergadering zodra de
   datum omslaat, en dan valt er niets te tonen van wat er nog openstaat. Dat is precies wat een
   architect wil zien als hij een ruimte binnenkomt. */
function zetDag(datum,data){return new Promise(res=>{
  if(!db)return res(false);
  const t=db.transaction("dagen","readwrite");t.objectStore("dagen").put(data,datum);
  t.oncomplete=()=>res(true);t.onerror=()=>res(false);
});}
function haalDagen(){return new Promise(res=>{
  if(!db)return res([]);
  const st=db.transaction("dagen","readonly").objectStore("dagen");
  const q=st.getAll();
  q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([]);
});}

function wisPlan(zone){return new Promise(res=>{
  if(!db)return res(false);
  const t=db.transaction("plannen","readwrite");t.objectStore("plannen").delete(zone);
  t.oncomplete=()=>res(true);t.onerror=()=>res(false);
});}
function planZones(){return new Promise(res=>{
  if(!db)return res([]);
  const q=db.transaction("plannen","readonly").objectStore("plannen").getAllKeys();
  q.onsuccess=()=>res(Array.from(q.result||[]));q.onerror=()=>res([]);
});}

function laadBeeld(src){return new Promise((res,rej)=>{
  const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;
});}

/* Welk lokaal hoort bij deze pin? Het dichtstbijzijnde label, mits het niet absurd ver ligt —
   anders liever niets dan een verkeerd lokaal in een verslag. */
function lokaalBij(x,y,welk){
  const pn=welk||plan;                   // meestal het geopende plan, bij overnemen een ander
  if(!pn||!pn.lokalen||!pn.lokalen.length)return null;
  const verh=pn.hoogte/pn.breedte;       // procenten zijn per as; y terugschalen voor echte afstand
  let best=null,bd=1e9;
  for(const l of pn.lokalen){
    const dx=l.x-x, dy=(l.y-y)*verh;
    const d=Math.hypot(dx,dy);
    if(d<bd){bd=d;best=l;}
  }
  return bd<=14?best:null;
}

/* ---- zelf nummeren ----
   Het plan komt binnen met een voorstel: nummers die het voorbereidingsscript herkend heeft, of
   rastervakken als er niets te herkennen viel. Klopt dat niet, of ontbreekt er een lokaal, dan
   tik je ze er hier zelf bij — oplopend, zonder tussenvraag, want dat is het enige tempo dat op
   een werf haalbaar is. Het nummer mag je daarna aanpassen met Benoem.

   Standaardvorm: niveau_lokaal_index, bijvoorbeeld N3_01_1. */
function volgendNummer(){
  const patroon=new RegExp("^"+plan.zone+"_(\\d+)_(\\d+)$");
  let hoogste=0;
  (plan.lokalen||[]).forEach(l=>{
    const m=patroon.exec(l.nr);
    if(m) hoogste=Math.max(hoogste, +m[1]);
  });
  return plan.zone+"_"+String(hoogste+1).padStart(2,"0")+"_1";
}

async function nummerHier(x,y){
  const nieuw={nr:volgendNummer(), naam:"", x:+x.toFixed(2), y:+y.toFixed(2)};
  plan.lokalen=(plan.lokalen||[]).concat([nieuw]);
  await zetPlan(plan.zone,plan);
  pl.pin={x,y,lokaal:nieuw};
  planTeken(); planVoet();
  melding(nieuw.nr+" toegevoegd — Benoem past het aan");
}

/* De punten die op dit plan thuishoren, in de volgorde waarin ze genoteerd zijn — dezelfde
   nummering als plan_verslag.py op de A4-bijlage zet. */
function puntenOpDitPlan(){
  if(!plan)return [];
  return staat.punten.filter(p=>p.plek&&p.plek.zone===plan.zone);
}

/* Wat er van vorige vergaderingen op dit plan staat. Alleen wat nog openstaat is interessant:
   afgehandelde punten hoeven de kaart niet vol te zetten, maar blijven wel opvraagbaar. */
/* Hoelang staat dit al open? Gerekend in hele dagen tussen de vaststelling en vandaag. */
function dagenOpen(p){
  const a=Date.parse(p.datum+"T00:00:00"), b=Date.parse(staat.datum+"T00:00:00");
  if(isNaN(a)||isNaN(b))return 0;
  return Math.max(0,Math.round((b-a)/86400000));
}

/* De kleurtrap voor ouderdom. Drie banden, niet meer: een week, een maand, langer. Fijner
   verdelen zou schijnnauwkeurigheid geven — je leest een kaart met een oogopslag, niet met een
   meetlat. Kleur is hier de eerste indruk; het getal in de cirkel is de eigenlijke informatie,
   want kleur alleen leest niet in fel zonlicht en niet voor wie kleurenblind is. */
const OUDERDOM=[
  {tot:7,   rand:"#c98a10", tekst:"#8a5c05"},   // deze week nog
  {tot:30,  rand:"#d97406", tekst:"#a2560a"},   // loopt op
  {tot:1e9, rand:"#a8341c", tekst:"#7d2413"}    // ouder dan een maand
];
function ouderdomskleur(dagen){
  return OUDERDOM.find(o=>dagen<=o.tot)||OUDERDOM[OUDERDOM.length-1];
}

function oudePuntenOpDitPlan(){
  if(!plan)return [];
  const uit=[];
  archief.forEach(dag=>{
    (dag.punten||[]).forEach(p=>{
      if(p.plek&&p.plek.zone===plan.zone&&p.status!=="klaar")
        uit.push({...p,datum:dag.datum});
    });
  });
  return uit;
}

function planTeken(){
  const c=document.getElementById("plancanvas");
  const dpr=Math.min(devicePixelRatio||1,2);
  const b=c.getBoundingClientRect();
  if(c.width!==Math.round(b.width*dpr)||c.height!==Math.round(b.height*dpr)){
    c.width=Math.round(b.width*dpr);c.height=Math.round(b.height*dpr);
  }
  const x=c.getContext("2d");
  x.setTransform(dpr,0,0,dpr,0,0);
  x.fillStyle="#111";x.fillRect(0,0,b.width,b.height);
  if(!planBeeld)return;
  x.imageSmoothingQuality="high";
  x.drawImage(planBeeld,pl.dx,pl.dy,plan.breedte*pl.schaal,plan.hoogte*pl.schaal);
  if(pl.nummeren&&plan.lokalen){
    x.fillStyle="rgba(217,116,6,.85)";
    plan.lokalen.forEach(l=>{
      const lx=pl.dx+l.x/100*plan.breedte*pl.schaal, ly=pl.dy+l.y/100*plan.hoogte*pl.schaal;
      x.beginPath();x.arc(lx,ly,4,0,7);x.fill();
    });
  }

  /* De punten van vandaag, op de kaart waar ze horen. Dit maakt van het plan een overzicht in
     plaats van een invoerveld: je ziet in één blik waar je geweest bent en waar niets staat.
     Genummerd zoals in de verslagbijlage, zodat het plan op je scherm en het blad in het dossier
     hetzelfde zeggen. */
  /* Eerst wat er nog openstaat van vorige keren, onder de punten van vandaag. Hol en amber:
     zichtbaar genoeg om op te vallen, rustig genoeg om niet met vandaag te verwarren. */
  oudePuntenOpDitPlan().forEach(p=>{
    const gx=pl.dx+p.plek.x/100*plan.breedte*pl.schaal;
    const gy=pl.dy+p.plek.y/100*plan.hoogte*pl.schaal;
    const gekozen=pl.gekozen===p.id;
    const d=dagenOpen(p), kl=ouderdomskleur(d);
    // hoe ouder, hoe zwaarder de rand: ook zonder kleur te zien valt het verschil op
    const straal=gekozen?13:10, dikte=(d>30?3.5:d>7?2.8:2.2)*(gekozen?1.3:1);
    x.beginPath();x.arc(gx,gy,straal,0,7);
    x.fillStyle="rgba(255,255,255,.94)";x.fill();
    x.lineWidth=dikte;x.strokeStyle=kl.rand;x.stroke();
    x.fillStyle=kl.tekst;
    x.textAlign="center";x.textBaseline="middle";
    // het aantal dagen als de cirkel het draagt, anders een uitroepteken
    const label=d>99?"99+":String(d);
    if(straal>=10&&label.length<=3){
      x.font="600 "+(label.length>2?9:11)+"px ui-monospace,Menlo,monospace";
      x.fillText(label,gx,gy+0.5);
    }else{
      x.font="600 11px ui-monospace,Menlo,monospace";
      x.fillText("!",gx,gy+0.5);
    }
  });
  x.textAlign="start";x.textBaseline="alphabetic";

  const mijne=puntenOpDitPlan();
  mijne.forEach((p,i)=>{
    const gx=pl.dx+p.plek.x/100*plan.breedte*pl.schaal;
    const gy=pl.dy+p.plek.y/100*plan.hoogte*pl.schaal;
    const gekozen=pl.gekozen===p.id;
    x.beginPath();x.arc(gx,gy,gekozen?12:9,0,7);
    x.fillStyle=gekozen?"#1b4f8a":"rgba(27,79,138,.86)";
    x.fill();
    x.lineWidth=2;x.strokeStyle="#fff";x.stroke();
    x.fillStyle="#fff";
    x.font="600 "+(gekozen?13:11)+"px ui-monospace,Menlo,monospace";
    x.textAlign="center";x.textBaseline="middle";
    x.fillText(String(i+1),gx,gy+0.5);
  });
  x.textAlign="start";x.textBaseline="alphabetic";

  if(pl.pin){
    const px=pl.dx+pl.pin.x/100*plan.breedte*pl.schaal;
    const py=pl.dy+pl.pin.y/100*plan.hoogte*pl.schaal;
    x.lineWidth=2.5;x.strokeStyle="#fff";x.fillStyle="#d92b06";
    x.beginPath();x.arc(px,py,11,0,7);x.fill();x.stroke();
    x.beginPath();x.arc(px,py,3,0,7);x.fillStyle="#fff";x.fill();
  }
  if(kp.aan)tekenKoppelPunten(x);
  tekenSchaal(x,b);
}

/* ---- de schaal ----
   Een ingescand architectenplan is een blad: een pin staat op 53% van de breedte en dat is
   alles wat je weet. Een omtrek uit het GRB is een kaart — die staat in Lambert 72 en dus in
   meters, en draagt daarom van nature een ware schaal. Het plan zegt dat zelf via `georef`.

   Draagt het plan die niet, dan tekenen we niets. Een schaalbalk verzinnen bij een blad zonder
   maat zou beweren wat de app niet weet, en dat is precies wat ze nergens anders doet. */
const SCHAALMATEN=[0.5,1,2,5,10,20,25,50,100,200,500,1000];

function meterPerPixel(){
  const g=plan&&plan.georef;
  // Een plaatselijk raam zegt alleen waar dit blad ligt ten opzichte van zijn voorganger. Dat is
  // geen maat, dus ook geen schaalbalk — anders zou de app meters beweren die ze niet kent.
  if(!g||g.plaatselijk||!g.eenheid_m||!pl.schaal)return null;
  return g.eenheid_m/pl.schaal;
}

function tekenSchaal(x,b){
  const mpp=meterPerPixel();
  if(!mpp)return;
  // een balk van ongeveer een derde van de breedte, maar altijd op een rond aantal meter:
  // "22 m" laat zich niet schatten, "20 m" wel
  const ruimte=Math.min(140,b.width*0.34);
  const passen=SCHAALMATEN.filter(v=>v/mpp<=ruimte);
  const m=passen.length?passen[passen.length-1]:SCHAALMATEN[0];
  const lang=m/mpp;
  if(lang<18)return;              // te klein om iets te zeggen: dan liever niets
  const x0=14, y0=34;      // op ooghoogte met de zoomknoppen aan de overkant
  x.save();
  x.lineCap="butt";
  // twee keer trekken, donker eronder: de balk ligt soms op wit papier en soms op de zwarte rand
  [["rgba(0,0,0,.55)",5],["#fff",2.5]].forEach(([kl,dk])=>{
    x.strokeStyle=kl;x.lineWidth=dk;
    x.beginPath();
    x.moveTo(x0,y0-5);x.lineTo(x0,y0+5);
    x.moveTo(x0,y0);x.lineTo(x0+lang,y0);
    x.moveTo(x0+lang,y0-5);x.lineTo(x0+lang,y0+5);
    x.stroke();
  });
  const tekst=m<1?(m*100)+" cm":m+" m";
  x.font="600 11px ui-monospace,Menlo,monospace";
  x.textAlign="center";x.textBaseline="bottom";
  x.lineWidth=3;x.strokeStyle="rgba(0,0,0,.55)";x.strokeText(tekst,x0+lang/2,y0-7);
  x.fillStyle="#fff";x.fillText(tekst,x0+lang/2,y0-7);
  x.restore();
  x.textAlign="start";x.textBaseline="alphabetic";
}

/* ---- van een plan naar de kaart, en terug ----
   Een plan met `georef` weet waar het ligt. Twee getallenparen volstaan daarvoor niet: een
   architectenplan staat zelden met het noorden boven, dus er hoort een draaiing bij.

       u = px/100 * breedte        (beeldeenheden, x naar rechts)
       v = py/100 * hoogte         (beeldeenheden, y naar beneden)
       X = x + ( u·cos θ − v·sin θ) · eenheid_m
       Y = y + (−u·sin θ − v·cos θ) · eenheid_m

   θ is `noord`: het aantal graden waarover je het beeld met de klok mee moet draaien om het
   noorden boven te krijgen. Bij een GRB-omtrek is dat nul, en dan valt de formule terug op wat
   ze eerst was — bestaande omtrekplannen blijven dus gewoon werken.

   De matrix erin is orthogonaal én haar eigen omgekeerde (ze spiegelt, want beeld-y wijst
   omlaag en Lambert-y omhoog). Daarom is de terugweg dezelfde vermenigvuldiging. */
function naarLambert(p,px,py){
  const g=p&&p.georef;
  if(!g||!g.eenheid_m)return null;
  const u=px/100*p.breedte, v=py/100*p.hoogte;
  const t=(g.noord||0)*Math.PI/180, c=Math.cos(t), s=Math.sin(t);
  return {X:g.x+(u*c-v*s)*g.eenheid_m, Y:g.y+(-u*s-v*c)*g.eenheid_m};
}
function naarBeeld(p,X,Y){
  const g=p&&p.georef;
  if(!g||!g.eenheid_m)return null;
  const t=(g.noord||0)*Math.PI/180, c=Math.cos(t), s=Math.sin(t);
  const dx=(X-g.x)/g.eenheid_m, dy=(Y-g.y)/g.eenheid_m;
  return {x:(dx*c-dy*s)/p.breedte*100, y:(-dx*s-dy*c)/p.hoogte*100};
}

/* ---- de uitlijning ----
   Wijs op beide tekeningen dezelfde hoeken aan, en daaruit volgen verschuiving, draaiing en
   schaal. In het platte vlak is dat één complexe vermenigvuldiging: keer de beeld-y om, en de
   afbeelding wordt q = t + k·p, waarbij |k| de schaal is en arg(k) de draaiing. Twee hoeken
   geven een sluitend antwoord; meer hoeken lost dezelfde som op in kleinste kwadraten, en het
   verschil tussen wat je aanwees en waar het uitkomt is dan meteen de controle.

   Wat hier bewust níet gebeurt is scheeftrekken. Drie punten zouden ook scheefheid kunnen
   opvangen, maar een affiene afbeelding door precies drie punten past altijd perfect — ze
   slikt een misgetikte hoek zonder een kik te geven, en je ziet nooit meer dat het mis is.
   Een gelijkvormigheid kan dat niet: die kan alleen schuiven, draaien en schalen, en wat er
   dan overblijft aan afwijking is echte informatie. Voor een blad dat werkelijk scheef staat —
   een foto van een plan aan de muur — helpt dit niet; dat staat in PLANMETHODE.md nog altijd
   onder wat niet opgelost is, en het hoort daar thuis. */
function berekenKoppeling(p,paren){
  const n=paren.length;
  if(n<2)return null;
  // beeld-y omkeren: dan is het een gewone gelijkvormigheid zonder spiegeling
  const P=paren.map(pr=>({re:pr.bron.x/100*p.breedte, im:-pr.bron.y/100*p.hoogte}));
  const Q=paren.map(pr=>({re:pr.doel.X, im:pr.doel.Y}));
  const mid=a=>({re:a.reduce((s,z)=>s+z.re,0)/n, im:a.reduce((s,z)=>s+z.im,0)/n});
  const pm=mid(P), qm=mid(Q);
  let kr=0,ki=0,noemer=0;
  for(let i=0;i<n;i++){
    const a={re:P[i].re-pm.re, im:P[i].im-pm.im};
    const b={re:Q[i].re-qm.re, im:Q[i].im-qm.im};
    kr+=b.re*a.re+b.im*a.im;      // Re(b · conj(a))
    ki+=b.im*a.re-b.re*a.im;      // Im(b · conj(a))
    noemer+=a.re*a.re+a.im*a.im;
  }
  if(noemer<1e-9)return null;     // alle hoeken op één plek: er valt niets af te leiden
  kr/=noemer; ki/=noemer;
  const tr=qm.re-(kr*pm.re-ki*pm.im), ti=qm.im-(kr*pm.im+ki*pm.re);
  const afwijking=paren.map((pr,i)=>{
    const zr=tr+(kr*P[i].re-ki*P[i].im), zi=ti+(kr*P[i].im+ki*P[i].re);
    return Math.hypot(zr-Q[i].re, zi-Q[i].im);
  });
  // hoe verder de hoeken uit elkaar liggen, hoe minder een tik van een paar pixels uitmaakt.
  // Vandaar deze verhouding: ze zegt hoe hard een misgetikte hoek doorweegt in de schaal.
  let spreiding=0;
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)
    spreiding=Math.max(spreiding,Math.hypot(P[i].re-P[j].re,P[i].im-P[j].im));
  return {
    georef:{epsg:31370, eenheid_m:+Math.hypot(kr,ki).toFixed(8),
            x:+tr.toFixed(3), y:+ti.toFixed(3),
            noord:+(-Math.atan2(ki,kr)*180/Math.PI).toFixed(3)},
    afwijking,
    hefboom:spreiding/Math.hypot(p.breedte,p.hoogte)   // 1 = de hele diagonaal, 0.1 = krap
  };
}

/* ---- de koppelstand ----
   Je wijst om beurten dezelfde hoek aan op twee plannen. Elke aanwijzing wisselt van plan, want
   dat is de handeling zelf: "die hoek daar" ↔ "die hoek hier". Het zicht van elk plan blijft
   onthouden, anders zoek je bij elke wissel je plek terug — en je wisselt minstens vier keer. */
const kp={aan:false,bron:null,doel:null,paren:[],half:null,zicht:{}};

function koppelKnop(){
  const k=document.getElementById("pl-koppel");
  if(!k)return;
  k.textContent=kp.aan?"Stop":"Koppel";
  k.style.background=kp.aan?"var(--accent)":"";
  k.style.borderColor=kp.aan?"var(--accent)":"";
}

function koppelStop(bericht){
  kp.aan=false;kp.bron=null;kp.doel=null;kp.paren=[];kp.half=null;kp.zicht={};
  koppelKnop();planTeken();planVoet();
  if(bericht)melding(bericht);
}

async function koppelNaar(zone){
  if(plan)kp.zicht[plan.zone]={schaal:pl.schaal,dx:pl.dx,dy:pl.dy};
  await toonPlan(zone);
  pl.pin=null;pl.gekozen=null;
  const z=kp.zicht[zone];
  if(z){pl.schaal=z.schaal;pl.dx=z.dx;pl.dy=z.dy;}
  else planPasIn();
  document.getElementById("pl-plan").textContent="Plan: "+zone;
  planTeken();planVoet();
}

async function koppelTik(x,y){
  if(!kp.half&&plan.zone===kp.bron){
    kp.half={x,y};
    await koppelNaar(kp.doel);
  }else if(kp.half&&plan.zone===kp.doel){
    const l=naarLambert(plan,x,y);
    if(!l){koppelStop("Dat plan draagt geen schaal meer — koppelen gestopt");return;}
    kp.paren.push({bron:kp.half,doel:{x,y,X:l.X,Y:l.Y}});
    kp.half=null;
    await koppelNaar(kp.bron);
  }else{
    // je bent op het verkeerde plan beland; breng jezelf terug in plaats van iets te bewaren
    await koppelNaar(kp.half?kp.doel:kp.bron);
  }
}

function tekenKoppelPunten(x){
  const opDit=[];
  kp.paren.forEach((pr,i)=>{
    if(plan.zone===kp.bron)opDit.push({x:pr.bron.x,y:pr.bron.y,n:i+1,vol:true});
    else if(plan.zone===kp.doel)opDit.push({x:pr.doel.x,y:pr.doel.y,n:i+1,vol:true});
  });
  // de halve: aangewezen op het ene plan, nog niet op het andere. Hol, want ze telt nog niet mee
  if(kp.half&&plan.zone===kp.bron)
    opDit.push({x:kp.half.x,y:kp.half.y,n:kp.paren.length+1,vol:false});
  x.save();
  opDit.forEach(o=>{
    const gx=pl.dx+o.x/100*plan.breedte*pl.schaal, gy=pl.dy+o.y/100*plan.hoogte*pl.schaal;
    x.beginPath();x.arc(gx,gy,11,0,7);
    x.fillStyle=o.vol?"rgba(15,157,118,.92)":"rgba(255,255,255,.92)";x.fill();
    x.lineWidth=2.5;x.strokeStyle="#0f9d76";x.stroke();
    // een kruisje: je wijst een hoek aan, geen gebied
    x.beginPath();x.moveTo(gx-5,gy);x.lineTo(gx+5,gy);x.moveTo(gx,gy-5);x.lineTo(gx,gy+5);
    x.lineWidth=1.6;x.strokeStyle=o.vol?"#fff":"#0f9d76";x.stroke();
    x.font="600 11px ui-monospace,Menlo,monospace";
    x.textAlign="center";x.textBaseline="middle";
    x.lineWidth=3;x.strokeStyle="rgba(255,255,255,.92)";
    x.strokeText(String(o.n),gx,gy-18);
    x.fillStyle="#0b6b51";x.fillText(String(o.n),gx,gy-18);
  });
  x.restore();
  x.textAlign="start";x.textBaseline="alphabetic";
}

function koppelVoet(){
  document.getElementById("pl-invoer").hidden=true;
  const el=document.getElementById("pl-lokaal");
  const box=document.getElementById("pl-buren"); box.innerHTML="";
  box.classList.add("koppel");
  const t=document.getElementById("pl-teller");
  if(t)t.textContent=kp.paren.length+" hoek"+(kp.paren.length===1?"":"en");
  el.innerHTML="<b>koppelen · hoek "+(kp.paren.length+1)+"</b><span>"+
    (kp.half?("wijs <b>dezelfde</b> hoek aan op "+veilig(kp.doel))
            :("wijs een herkenbare hoek aan op "+veilig(kp.bron)))+"</span>";
  const knop=(tekst,klasse,fn)=>{
    const b=document.createElement("button");b.type="button";
    if(klasse)b.className=klasse;
    b.textContent=tekst;b.onclick=fn;box.appendChild(b);
  };
  if(kp.paren.length>=2&&!kp.half)
    knop("Koppel op "+kp.paren.length+" hoeken","actief",koppelKlaar);
  if(kp.paren.length||kp.half)
    knop("Laatste weg",null,async()=>{
      if(kp.half)kp.half=null; else kp.paren.pop();
      await koppelNaar(kp.bron);
    });
  knop("Stoppen",null,()=>koppelStop("Koppelen afgebroken"));
}

async function koppelStart(){
  if(!plan){melding("Laad eerst een plan");return;}
  const bron=plan.zone;
  const kandidaten=[];
  for(const z of await planZones()){
    if(z===bron)continue;
    const d=await haalPlan(z);
    if(d&&d.georef&&d.georef.eenheid_m)kandidaten.push(z);
  }
  if(!kandidaten.length){
    melding("Geen plan om op te leggen — maak eerst een omtrekplan");
    return;
  }
  const doel=kandidaten.length===1?kandidaten[0]
    :await kiesZone("Waarop koppelen?",kandidaten,
       "Kies het plan waarop dit blad moet gaan liggen — het omtrekplan uit het GRB als je een "+
       "schaal wil, of de vorige versie van dit blad als je er punten van wil overnemen.");
  if(!doel)return;
  if(plan.georef)
    melding(bron+" draagt al een schaal; die wordt vervangen");
  pl.nummeren=false;                 // twee standen tegelijk gaat niet
  const k=document.getElementById("pl-nummer");
  if(k){k.textContent="Nummer";k.style.background="";k.style.borderColor="";}
  kp.aan=true;kp.bron=bron;kp.doel=doel;kp.paren=[];kp.half=null;kp.zicht={};
  koppelKnop();
  await koppelNaar(bron);
}

async function koppelKlaar(){
  const bronPlan=await haalPlan(kp.bron);
  if(!bronPlan){koppelStop("Plan "+kp.bron+" niet gevonden");return;}
  const doelPlan=await haalPlan(kp.doel);
  const r=berekenKoppeling(bronPlan,kp.paren);
  if(!r){melding("De hoeken liggen op één plek — daar valt geen schaal uit af te leiden");return;}
  // Lag je op een plaatselijk raam, dan is wat je krijgt óók plaatselijk: dit blad weet nu waar
  // het ligt ten opzichte van het vorige, en verder niets. Een echte projectie erop plakken zou
  // een maat beweren die nergens gemeten is.
  if(doelPlan&&doelPlan.georef&&doelPlan.georef.plaatselijk){
    r.georef.epsg=null; r.georef.plaatselijk=true;
  }
  bronPlan.georef=r.georef;
  if(!await zetPlan(kp.bron,bronPlan)){melding("Opslag weigert — ruimte vol?");return;}
  const zone=kp.bron;
  koppelStop();
  await toonPlan(zone);
  toonKoppelUitslag(bronPlan,r,doelPlan);
}

/* De uitslag is geen felicitatie maar een controle: wat is dit plan nu groot, hoe staat het
   gedraaid, en hoe zeker is dat. Daarom een venster en geen toast — dit lees je één keer per
   project, en als er iets niet klopt wil je het hier zien en niet op de werf. */
function toonKoppelUitslag(p,r,doelPlan){
  const g=r.georef;
  const komma=(v,n)=>v.toFixed(n).replace(".",",");
  const draai=Math.abs(g.noord)<0.5
    ?(g.plaatselijk?"het staat even recht als het vorige":"het noorden staat boven")
    :((g.plaatselijk?"het staat ":"het noorden staat ")+komma(Math.abs(g.noord),1)+"° "+
      (g.noord>0?"naar links":"naar rechts")+" gedraaid"+(g.plaatselijk?" ten opzichte van het vorige":""));
  const ergste=Math.max.apply(null,r.afwijking);
  const regels=[];
  // Twee soorten uitslag, want er is twee soorten kennis. Een plan dat op een kaart ligt weet
  // hoeveel meter het meet; een plan dat op zijn voorganger ligt weet dat alleen ten opzichte
  // van dat blad. Het verschil hardop zeggen is de hele reden dat dit klopt.
  if(g.plaatselijk){
    // de maatverhouding: 1 betekent dat beide bladen even groot getekend staan
    const verhouding=g.eenheid_m;
    const diagonaal=doelPlan?Math.hypot(doelPlan.breedte,doelPlan.hoogte):null;
    regels.push("Dit blad ligt nu vast <b>ten opzichte van het vorige</b>: het staat op <b>"+
      komma(verhouding*100,1)+"%</b> van diens maat, en "+draai+".");
    regels.push("Bij twee versies van dezelfde tekening ligt die verhouding zelden ver van 100%. "+
      "Wijkt ze sterk af, dan wees je waarschijnlijk twee verschillende hoeken aan.");
    if(r.afwijking.length<3)
      regels.push("Twee hoeken sluiten altijd, dus er valt nu niets na te rekenen. "+
        "Wijs een derde hoek aan als je wil weten óf het klopt.");
    else if(diagonaal)
      regels.push("Grootste afwijking over "+r.afwijking.length+" hoeken: <b>"+
        komma(ergste/diagonaal*100,2)+"%</b> van de bladdiagonaal. "+
        (ergste/diagonaal<0.005?"Dat sluit."
         :ergste/diagonaal<0.02?"Dat is aan de ruime kant — kijk of je elke hoek op hetzelfde punt aanwees."
         :"Dat is te veel. Waarschijnlijk wees je twee verschillende hoeken aan."));
    regels.push("Dit levert géén schaal op: het blad weet waar het ligt ten opzichte van zijn "+
      "voorganger, niet hoeveel meter het meet. Er komt dus ook geen schaalbalk bij.");
  }else{
    const breed=p.breedte*g.eenheid_m, hoog=p.hoogte*g.eenheid_m;
    regels.push("Het blad meet nu <b>"+komma(breed,1)+" bij "+komma(hoog,1)+" m</b>, en "+draai+".");
    regels.push("Eén beeldeenheid is "+komma(g.eenheid_m*1000,2)+" mm.");
    if(r.afwijking.length<3)
      regels.push("Twee hoeken sluiten altijd, dus er valt nu niets na te rekenen. "+
        "Wijs een derde hoek aan als je wil weten óf het klopt.");
    else
      regels.push("Grootste afwijking over "+r.afwijking.length+" hoeken: <b>"+
        komma(ergste,2)+" m</b>. "+
        (ergste<0.5?"Dat sluit."
         :ergste<2?"Dat is aan de ruime kant — kijk of je elke hoek op hetzelfde punt aanwees."
         :"Dat is te veel. Waarschijnlijk wees je twee verschillende hoeken aan, of het blad "+
          "staat scheef — en scheeftrekken doet deze koppeling bewust niet."));
  }
  if(r.hefboom<0.15)
    regels.push("⚠️ De hoeken lagen dicht bij elkaar — samen maar "+
      Math.round(r.hefboom*100)+"% van de diagonaal. Een tik van een paar pixels weegt dan zwaar "+
      "door in de schaal. Neem hoeken die zo ver mogelijk uit elkaar liggen.");
  regels.push(g.plaatselijk
    ? ("Met <b>Bewaar</b> gaat deze koppeling mee het bestand in.")
    : ("Vanaf nu draagt "+p.zone+" een schaalbalk. Met <b>Bewaar</b> gaat de koppeling "+
       "mee het bestand in."));
  const dlg=document.getElementById("dlg");
  document.getElementById("dlg-titel").textContent="Plan "+p.zone+" gekoppeld";
  const body=document.getElementById("dlg-body");
  body.innerHTML=regels.map(t=>'<p class="inv-uitleg" style="margin:0 0 10px">'+t+"</p>").join("");
  document.getElementById("dlg-kopieer").style.display="none";
  dlg.onclose=()=>{
    dlg.onclose=null;
    // Dit is waarvoor je koppelde: de punten die je op de omtrek prikte horen nu hier. Meteen
    // aanbieden, want een minuut later is de aanleiding weg en zoek je de knop niet meer.
    overnameAangeboden.delete(p.zone);
    biedOvernameAan(p);
  };
  dlg.showModal();
}

/* Als aanbod, niet als vraag — zoals het nummervoorstel. Negeer je het, dan verdwijnt het, en
   per plan bieden we het één keer per sessie aan zodat het niet gaat zeuren. */
async function biedOvernameAan(doel){
  if(!doel||!doel.georef||kp.aan)return;
  if(overnameAangeboden.has(doel.zone))return;
  const t=await teNemenPunten(doel);
  if(!t||!t.passen.length)return;
  overnameAangeboden.add(doel.zone);
  meldingMetActie(stuks(t.passen.length,"punt van elders past","punten van elders passen")+
    " op "+doel.zone,"overnemen",()=>neemPuntenOver(doel));
}

/* Eén vraag, één knop per keuze. Dezelfde vorm als "Op welk niveau sta je?" — dat is het enige
   keuzepatroon dat deze app kent, en twee patronen voor hetzelfde is er een te veel. */
function kiesZone(titel,zones,uitleg){
  return new Promise(res=>{
    const dlg=document.getElementById("dlg");
    document.getElementById("dlg-titel").textContent=titel;
    const body=document.getElementById("dlg-body");
    body.innerHTML="";
    const rij=document.createElement("div");
    rij.style.cssText="display:flex;flex-wrap:wrap;gap:8px";
    let gekozen=null;
    zones.forEach(z=>{
      const b=document.createElement("button");
      b.type="button";
      b.style.cssText="font-size:17px;font-weight:650;padding:16px 22px;background:var(--zone-soft);"+
        "color:var(--zone);border-color:var(--zone-soft)";
      b.textContent=z;
      b.onclick=()=>{gekozen=z;dlg.close();};
      rij.appendChild(b);
    });
    body.appendChild(rij);
    if(uitleg){
      const u=document.createElement("p");
      u.className="inv-uitleg";u.style.marginTop="12px";u.textContent=uitleg;
      body.appendChild(u);
    }
    document.getElementById("dlg-kopieer").style.display="none";
    dlg.onclose=()=>{dlg.onclose=null;res(gekozen);};
    dlg.showModal();
  });
}

/* ---- de punten overnemen ----
   Op de werf stond er geen plannenset, dus prikte je op de omtrek. Thuis koppel je het echte plan,
   en dan horen die punten dáárop te staan en niet meer op de noodoplossing.

   Overnemen is een verhuizing, geen kopie: een vaststelling heeft één plek. Wat verandert is niet
   wáár ze ligt maar op welke tekening dat wordt uitgedrukt — het punt op de kaart van Vlaanderen
   blijft hetzelfde. Precies daarom kan dit alleen tussen twee plannen die allebei weten waar ze
   liggen, en is het rekenwerk een omweg langs Lambert en terug.

   Het etiket verhuist niet mee. "C4" is een rastervak van de omtrek en zegt niets op een
   architectenplan, dus het lokaal wordt op het nieuwe plan opnieuw opgezocht. Dat is dezelfde
   regel als overal: de coördinaat is het feit, het nummer een interpretatie.

   Wat buiten het nieuwe blad valt, blijft staan waar het staat. Een punt in de tuin hoort niet
   met geweld op een verdiepingsplan geduwd te worden. */
let laatsteOverdracht=null;      // om de laatste verhuizing te kunnen terugdraaien
const overnameAangeboden=new Set();

function stuks(n,enkel,meer){return n+" "+(n===1?enkel:meer);}

async function teNemenPunten(doel){
  if(!doel||!doel.georef)return null;
  const bronnen={}, uit={passen:[],buiten:[],zonderSchaal:0};
  const lijst=[];
  (staat.punten||[]).forEach(p=>{ if(p.plek)lijst.push({p,dag:null}); });
  // ook wat van vorige vergaderingen nog openstaat: juist dát wil je zien als je een ruimte
  // binnenkomt, en dus op het plan waarop je straks werkt
  archief.forEach(dag=>(dag.punten||[]).forEach(p=>{
    if(p.plek&&p.status!=="klaar")lijst.push({p,dag});
  }));
  for(const it of lijst){
    const z=it.p.plek.zone;
    if(!z||z===doel.zone)continue;
    if(!(z in bronnen))bronnen[z]=await haalPlan(z);
    const bp=bronnen[z];
    if(!bp||!bp.georef){uit.zonderSchaal++;continue;}
    const L=naarLambert(bp,it.p.plek.x,it.p.plek.y);
    const b=naarBeeld(doel,L.X,L.Y);
    if(b.x>=0&&b.x<=100&&b.y>=0&&b.y<=100)uit.passen.push({...it,naar:b});
    else uit.buiten.push(it);
  }
  return uit;
}

async function neemPuntenOver(doel){
  const t=await teNemenPunten(doel);
  if(!t)return false;
  if(!t.passen.length){
    melding(t.buiten.length?("Geen enkel punt valt binnen "+doel.zone)
                           :"Er staat niets klaar om over te nemen");
    return false;
  }
  const vandaag=t.passen.filter(o=>!o.dag).length, oud=t.passen.length-vandaag;
  const vanwaar=[...new Set(t.passen.map(o=>o.p.plek.zone))].join(", ");
  const regels=[
    "<b>"+stuks(t.passen.length,"punt","punten")+"</b> van "+veilig(vanwaar)+
      (t.passen.length===1?" verhuist":" verhuizen")+" naar "+veilig(doel.zone)+
      (oud?(" — "+vandaag+" van vandaag, "+oud+" van vorige vergaderingen"):"")+".",
    "Ze houden hun plek; die wordt alleen op deze tekening uitgedrukt in plaats van op de "+
      "tekening waar ze vandaan komen. Het lokaalnummer wordt hier opnieuw opgezocht, want een "+
      "etiket van dat andere blad zegt op dit plan niets."
  ];
  if(t.buiten.length)
    regels.push("<b>"+stuks(t.buiten.length,"punt valt","punten vallen")+"</b> buiten dit blad en "+
      "blijft staan waar het staat.");
  if(t.zonderSchaal)
    regels.push(stuks(t.zonderSchaal,"punt staat","punten staan")+" op een plan zonder schaal en "+
      "kan niet mee — koppel dat plan eerst.");
  if(!await vraagJa("Punten overnemen op "+doel.zone,regels,"Overnemen"))return false;

  const dagen=new Set();
  laatsteOverdracht=[];
  t.passen.forEach(o=>{
    const p=o.p, k=p.plek;
    const van={zone:k.zone,x:k.x,y:k.y,lokaal:k.lokaal||null,naam:k.naam||"",puntzone:p.zone};
    laatsteOverdracht.push({p,van,dag:o.dag});
    const l=lokaalBij(o.naar.x,o.naar.y,doel);
    k.van=van;                       // waar het vandaan kwam blijft in het punt staan
    k.zone=doel.zone;
    k.x=+o.naar.x.toFixed(2); k.y=+o.naar.y.toFixed(2);
    k.lokaal=l?l.nr:null; k.naam=l?(l.naam||""):"";
    // de zonecode in het verslag hoort mee: anders staat een punt onder "BUITEN" met een
    // lokaalnummer van N3 erbij, en dat leest niemand goed
    if(ZONES.includes(doel.zone))p.zone=doel.zone;
    raakAan(p);
    if(o.dag)dagen.add(o.dag);
  });
  bewaarStaat();
  for(const dag of dagen)await zetDag(dag.datum,dag);
  await tekenLijst();
  planTeken();planVoet();
  meldingMetActie(stuks(t.passen.length,"punt staat","punten staan")+" nu op "+doel.zone,
                  "ongedaan maken",draaiOverdrachtTerug);
  // Het terugdraaien gaat voor; pas als die melding is uitgewerkt bieden we aan op te ruimen.
  setTimeout(ruimVersiesOp,6500);
  return true;
}

async function draaiOverdrachtTerug(){
  if(!laatsteOverdracht||!laatsteOverdracht.length){melding("Niets om terug te draaien");return;}
  const dagen=new Set();
  laatsteOverdracht.forEach(({p,van,dag})=>{
    p.plek.zone=van.zone;p.plek.x=van.x;p.plek.y=van.y;
    p.plek.lokaal=van.lokaal;p.plek.naam=van.naam;
    p.zone=van.puntzone;
    delete p.plek.van; raakAan(p);
    if(dag)dagen.add(dag);
  });
  const n=laatsteOverdracht.length;
  laatsteOverdracht=null;
  bewaarStaat();
  for(const dag of dagen)await zetDag(dag.datum,dag);
  await tekenLijst();
  planTeken();planVoet();
  melding(stuks(n,"punt","punten")+" teruggezet");
}

/* Eén vraag met één bevestiging. De kopieerknop van het venster doet dienst als jaknop — dat
   venster heeft er maar twee, en een derde bijzetten voor één handeling is het niet waard. */

/* ---- een nieuwe versie van hetzelfde plan ----
   Punten hangen aan een zone en dragen procenten van het blad. Laad je een ánder plan voor
   dezelfde zone, dan wijzen diezelfde procenten op de nieuwe tekening een andere plek aan — en
   dat gebeurde tot nu toe zwijgend. Tussen twee zones was dit al opgelost (zie *De punten
   overnemen*), binnen één zone niet.

   De oplossing is dat de zone niet langer één plan is. Het vorige blad blijft staan onder een
   eigen naam, mét zijn punten, tot je ze hebt overgezet. Daarna is het dezelfde handeling als
   overal: twee keer dezelfde hoek aanwijzen, en de punten rekenen zichzelf om.

   Wat er nieuw bij komt is dat dit óók moet werken voor twee bladen die geen van beide een
   schaal dragen — en dat is juist het gewone geval: twee versies van hetzelfde
   architectenplan. Daarom krijgt het geparkeerde blad een **plaatselijk raam**: een stelsel dat
   alleen ten opzichte van zichzelf geldt. Genoeg om er een opvolger op te leggen, en nadrukkelijk
   geen kaart — de app tekent er geen schaalbalk bij en beweert nergens meters. */

function puntenOpZone(z){
  const uit=[];
  (staat.punten||[]).forEach(p=>{ if(p.plek&&p.plek.zone===z)uit.push({p,dag:null}); });
  archief.forEach(dag=>(dag.punten||[]).forEach(p=>{
    if(p.plek&&p.plek.zone===z&&p.status!=="klaar")uit.push({p,dag});
  }));
  return uit;
}

async function vrijeVersienaam(zone){
  const bestaand=await planZones();
  let naam=zone+" oud", n=1;
  while(bestaand.includes(naam)){n++;naam=zone+" oud "+n;}
  return naam;
}

/* Het vorige blad opzijzetten, met de punten die erop staan. Die verhuizen mee: ze horen bij de
   tekening waarop ze geprikt zijn, niet bij de naam van de zone. */
async function parkeerPlan(oud,naam,raakt){
  const kopie={...oud, zone:naam, versieVan:oud.zone};
  if(!kopie.georef)
    kopie.georef={epsg:null, eenheid_m:1, x:0, y:0, noord:0, plaatselijk:true};
  if(!await zetPlan(naam,kopie)){melding("Opslag weigert — ruimte vol?");return null;}
  const dagen=new Set();
  raakt.forEach(({p,dag})=>{ p.plek.zone=naam; raakAan(p); if(dag)dagen.add(dag); });
  bewaarStaat();
  for(const dag of dagen)await zetDag(dag.datum,dag);
  return kopie;
}

/* Staat er niets meer op een geparkeerd blad, dan mag het weg. Als aanbod, niet als vraag — en
   pas nadat de melding over het terugdraaien is uitgewerkt, want die gaat voor. */
async function ruimVersiesOp(){
  for(const z of await planZones()){
    const d=await haalPlan(z);
    if(!d||!d.versieVan)continue;
    if(puntenOpZone(z).length)continue;
    meldingMetActie("Op "+z+" staat niets meer","wegdoen",async()=>{
      await wisPlan(z);
      planLijst=await planZones();
      if(plan&&plan.zone===z)await toonPlan(d.versieVan);
      tekenZones();
      melding(z+" weggedaan");
    });
    return;
  }
}

function planPasIn(){
  const c=document.getElementById("plancanvas");
  const b=c.getBoundingClientRect();
  if(!plan||!b.width)return;
  pl.schaal=Math.min(b.width/plan.breedte,b.height/plan.hoogte);
  pl.dx=(b.width-plan.breedte*pl.schaal)/2;
  pl.dy=(b.height-plan.hoogte*pl.schaal)/2;
}

/* Zoomt naar een plek toe. `factor` bepaalt hoe strak: strak voor een punt waar je mee bezig
   bent, ruimer voor een herinnering — een werfrondgang springt van hak op tak, dus de vorige
   plek is géén voorspelling van de volgende. Te strak inzoomen op een gok kost een uitzoombeweging
   in plaats van er een te sparen. */
function planNaarPlek(x,y,factor){
  const c=document.getElementById("plancanvas");
  const b=c.getBoundingClientRect();
  if(!plan||!b.width)return;
  pl.schaal=Math.min(b.width/plan.breedte,b.height/plan.hoogte)*factor;
  pl.dx=b.width/2-x/100*plan.breedte*pl.schaal;
  pl.dy=b.height/2-y/100*plan.hoogte*pl.schaal;
}
function planNaarPin(){ if(pl.pin) planNaarPlek(pl.pin.x,pl.pin.y,4); }

/* Springen naar een lokaal. Op een werf die van verdieping naar verdieping springt is dit de
   enige navigatie die altijd werkt: niet pannen tot je het vindt, maar zeggen waar je bent. */
function toonLokalenlijst(){
  if(!plan||!(plan.lokalen||[]).length){melding("Dit plan heeft geen lokalen");return;}
  const dlg=document.getElementById("dlg");
  document.getElementById("dlg-titel").textContent="Naar welk lokaal?";
  const body=document.getElementById("dlg-body");
  body.innerHTML="";
  const zoek=document.createElement("input");
  zoek.type="search";zoek.placeholder="filter op nummer of naam";
  zoek.style.cssText="width:100%;padding:10px;font-size:16px;border:1px solid var(--line);"+
    "border-radius:8px;margin-bottom:10px;background:var(--surface);color:var(--ink)";
  body.appendChild(zoek);
  const lijst=document.createElement("div");
  lijst.style.cssText="display:flex;flex-wrap:wrap;gap:6px";
  body.appendChild(lijst);
  const teken=filter=>{
    lijst.innerHTML="";
    (plan.lokalen||[])
      .filter(l=>!filter||(l.nr+" "+(l.naam||"")).toLowerCase().includes(filter))
      .forEach(l=>{
        const b=document.createElement("button");
        b.type="button";b.style.cssText="font:13px ui-monospace,Menlo,monospace;padding:9px 11px";
        b.textContent=l.nr;
        b.title=l.naam||"";
        b.onclick=()=>{
          dlg.close();
          planNaarPlek(l.x,l.y,4);
          planTeken();
          melding("Naar "+l.nr+(l.naam?" — "+l.naam:""));
        };
        lijst.appendChild(b);
      });
    if(!lijst.children.length)lijst.innerHTML='<span class="aw-leeg">niets gevonden</span>';
  };
  teken("");
  zoek.oninput=()=>teken(zoek.value.trim().toLowerCase());
  document.getElementById("dlg-kopieer").style.display="none";
  dlg.showModal();
}

/* De dichtstbijzijnde lokalen rond een punt. Zit de gok ernaast, dan staat de juiste ruimte
   bijna altijd hiertussen — één tik, geen zoektocht. De app schat, jij beslist, en fout zijn
   kost één tik; daarom mag ze schatten. */
function burenBij(x,y,hoeveel){
  if(!plan||!plan.lokalen)return [];
  const verh=plan.hoogte/plan.breedte;
  return plan.lokalen
    .map(l=>({l,d:Math.hypot(l.x-x,(l.y-y)*verh)}))
    .sort((a,b)=>a.d-b.d).slice(0,hoeveel).map(o=>o.l);
}

function tekenBuren(){
  const box=document.getElementById("pl-buren");
  box.innerHTML="";
  box.classList.remove("koppel");
  if(!plan||!pl.pin||pl.nummeren)return;
  const buren=burenBij(pl.pin.x,pl.pin.y,5);
  if(buren.length<2)return;
  buren.forEach(l=>{
    const b=document.createElement("button");
    b.type="button";b.textContent=l.nr;b.title=l.naam||"";
    if(pl.pin.lokaal&&pl.pin.lokaal.nr===l.nr&&Math.abs(pl.pin.lokaal.x-l.x)<0.01)b.className="actief";
    b.onclick=()=>{pl.pin.lokaal=l;planTeken();planVoet();};
    box.appendChild(b);
  });
}

/* Welk bestaand punt ligt onder deze tik? In schermpixels gemeten, want een vingertop is
   even groot ongeacht hoe ver je ingezoomd bent. */
function puntGeraakt(sx,sy){
  if(!plan)return null;
  let best=null,bd=22;
  puntenOpDitPlan().concat(oudePuntenOpDitPlan()).forEach(p=>{
    const gx=pl.dx+p.plek.x/100*plan.breedte*pl.schaal;
    const gy=pl.dy+p.plek.y/100*plan.hoogte*pl.schaal;
    const d=Math.hypot(gx-sx,gy-sy);
    if(d<bd){bd=d;best=p;}
  });
  return best;
}

function veilig(t){return String(t).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));}
function datumKort(d){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||"");
  return m?(+m[3]+"/"+ +m[2]):(d||"vorige keer");
}

/* Een punt van vorige keer afvinken. Het verdwijnt van de kaart maar niet uit het archief:
   dat je het opgelost hebt en wanneer, is zelf een vaststelling. */
async function merkAfgehandeld(oud){
  const dag=archief.find(d=>d.datum===oud.datum);
  if(!dag)return;
  const p=(dag.punten||[]).find(x=>x.id===oud.id);
  if(!p)return;
  p.status="klaar";
  p.afgehandeld=staat.datum; raakAan(p);
  await zetDag(dag.datum,dag);
  pl.gekozen=null;
  planTeken();planVoet();
  melding("Afgevinkt — stond open sinds "+datumKort(oud.datum));
}

/* Tik je onderaan de kaart, dan valt je pin achter de invoer. Dan schuift het plan net genoeg
   omhoog om hem vrij te houden — niet meer, want elke onnodige verschuiving is verwarrend. */
function houdPinVrij(){
  const c=document.getElementById("plancanvas"), voet=document.getElementById("pl-voet");
  if(!plan||!pl.pin||voet.hidden)return;
  const b=c.getBoundingClientRect(), v=voet.getBoundingClientRect();
  const py=pl.dy+pl.pin.y/100*plan.hoogte*pl.schaal;
  const grens=(v.top-b.top)-26;
  if(py>grens){ pl.dy-=(py-grens); planTeken(); }
}

function planVoet(){
  const voet=document.getElementById("pl-voet");
  const el=document.getElementById("pl-lokaal");
  voet.hidden=!plan;
  document.getElementById("pl-invoer").hidden=!(plan&&pl.pin&&!pl.nummeren);
  tekenBuren();
  if(!plan)return;
  if(kp.aan){koppelVoet();return;}
  if(pl.gekozen){
    const p=staat.punten.find(x=>x.id===pl.gekozen);
    const oud=p?null:oudePuntenOpDitPlan().find(x=>x.id===pl.gekozen);
    if(p||oud){
      document.getElementById("pl-invoer").hidden=true;
      const box=document.getElementById("pl-buren"); box.innerHTML="";
      const t=document.getElementById("pl-teller");
      if(p){
        el.innerHTML="<b>punt "+(puntenOpDitPlan().indexOf(p)+1)+" · "+(p.plek.lokaal||"")+"</b><span>"+
          veilig(p.tekst||"(geen notitie)")+" — tik naast het punt om verder te gaan</span>";
        if(t) t.textContent=p.tijd;
      }else{
        // een punt van een vorige vergadering: het enige wat je hier wil doen is zeggen of het
        // opgelost is. Dat is de reden dat het op de kaart staat.
        el.innerHTML="<b>"+datumKort(oud.datum)+" · "+(oud.plek.lokaal||"")+"</b><span>"+
          veilig(oud.tekst||"(geen notitie)")+"</span>";
        if(t) t.textContent=dagenOpen(oud)+" dagen open";
        const k=document.createElement("button");
        k.type="button";k.className="actief";k.textContent="✓ opgelost";
        k.onclick=()=>merkAfgehandeld(oud);
        box.appendChild(k);
        const n=document.createElement("button");
        n.type="button";n.textContent="blijft open";
        n.onclick=()=>{pl.gekozen=null;planTeken();planVoet();};
        box.appendChild(n);
      }
      return;
    }
    pl.gekozen=null;
  }
  const teller=document.getElementById("pl-teller");
  if(teller) teller.textContent=staat.punten.length+" punt"+(staat.punten.length===1?"":"en");
  if(pl.nummeren&&!pl.pin){
    el.innerHTML="<b>nummeren</b><span>tik elk lokaal aan; ze lopen vanzelf op ("+
      ((plan.lokalen||[]).length)+" op dit plan)</span>";
    return;
  }
  if(!pl.pin){
    el.innerHTML="<b>—</b><span>tik waar je staat, of hier voor de lokalenlijst</span>";
    return;
  }
  const l=pl.pin.lokaal;
  el.innerHTML="<b>"+(l?l.nr:plan.zone)+"</b><span>"+
    (l?(l.naam||"lokaal "+l.nr):"geen lokaal in de buurt — coördinaat "+
       Math.round(pl.pin.x)+","+Math.round(pl.pin.y))+"</span>";
}

async function toonPlan(zone){
  const data=await haalPlan(zone);
  document.getElementById("pl-leeg").hidden=!!data;
  if(!data){plan=null;planBeeld=null;planTeken();planVoet();return;}
  plan=data;
  try{planBeeld=await laadBeeld(plan.beeld);}catch(e){planBeeld=null;melding("Plan kon niet geladen worden");}
  pl.pin=wachtendePlek&&wachtendePlek.zone===plan.zone
    ?{x:wachtendePlek.x,y:wachtendePlek.y,lokaal:wachtendePlek.lokaal?{nr:wachtendePlek.lokaal,naam:wachtendePlek.naam||""}:null}
    :null;
  // Waar je was is de beste gok voor waar je bent: op een werf loop je van ruimte naar ruimte,
  // niet kriskras. Het plan opent daarom ingezoomd op je vorige punt in plaats van uitgezoomd op
  // het hele blad — schelen twee knijpbewegingen per punt.
  if(pl.pin)planNaarPin();
  else if(plan.laatst) planNaarPlek(plan.laatst.x,plan.laatst.y,2);
  else planPasIn();
  try{document.getElementById("pl-voet").classList.toggle("klein",
      localStorage.getItem(VOUWSLEUTEL)==="1");
      document.getElementById("pl-vouw").textContent=
        localStorage.getItem(VOUWSLEUTEL)==="1"?"▴":"▾";}catch(e){}
  planTeken();planVoet();
  if(!kp.aan&&plan&&plan.georef)biedOvernameAan(plan);
}

async function openPlan(gevraagd){
  const dlg=document.getElementById("plandlg");
  if(!dlg.open)dlg.showModal();
  planLijst=await planZones();
  // het gevraagde plan, anders dat van de huidige zone, anders het enige dat er is
  const zone=(gevraagd&&planLijst.includes(gevraagd))?gevraagd
            :planLijst.includes(staat.zone)?staat.zone:(planLijst[0]||staat.zone);
  await toonPlan(zone);
  document.getElementById("pl-plan").textContent=planLijst.length>1?("Plan: "+zone):"Plan";
}

/* Bij het openen van de app: welk niveau? En dan meteen de kaart.
   Dat is de volgorde waarin een rondgang begint — je staat ergens, je zegt waar, en je werkt

/* Pannen met één vinger, zoomen met twee. Een tik zonder verschuiving zet de pin. */
function planBedrading(){
  const c=document.getElementById("plancanvas");
  const punt=e=>{const b=c.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top};};

  c.addEventListener("pointerdown",e=>{
    if(!plan)return;
    try{c.setPointerCapture(e.pointerId);}catch(err){}
    pl.wijzers.set(e.pointerId,punt(e));
    if(pl.wijzers.size===1){
      pl.start={...punt(e),tijd:Date.now(),bewogen:0};
    }else if(pl.wijzers.size===2){
      const [a,b]=[...pl.wijzers.values()];
      pl.knijp={afstand:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2};
      pl.start=null;   // knijpen is geen tik meer
    }
  });

  c.addEventListener("pointermove",e=>{
    if(!plan||!pl.wijzers.has(e.pointerId))return;
    const vorig=pl.wijzers.get(e.pointerId), nu=punt(e);
    pl.wijzers.set(e.pointerId,nu);
    if(pl.wijzers.size===1){
      pl.dx+=nu.x-vorig.x; pl.dy+=nu.y-vorig.y;
      if(pl.start)pl.start.bewogen+=Math.hypot(nu.x-vorig.x,nu.y-vorig.y);
      planTeken();
    }else if(pl.wijzers.size===2&&pl.knijp){
      const [a,b]=[...pl.wijzers.values()];
      const af=Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      const f=af/(pl.knijp.afstand||af);
      const nieuw=Math.max(0.05,Math.min(40,pl.schaal*f));
      const echt=nieuw/pl.schaal;
      // zoom om het midden tussen de vingers, en volg dat midden als het verschuift
      pl.dx=mx-(pl.knijp.mx-pl.dx)*echt+(mx-pl.knijp.mx)*0;
      pl.dy=my-(pl.knijp.my-pl.dy)*echt;
      pl.schaal=nieuw;
      pl.knijp={afstand:af,mx,my};
      planTeken();
    }
  });

  const los=e=>{
    if(!plan)return;
    pl.wijzers.delete(e.pointerId);
    if(pl.wijzers.size<2)pl.knijp=null;
    if(pl.wijzers.size===0&&pl.start&&pl.start.bewogen<8&&Date.now()-pl.start.tijd<400){
      const x=(pl.start.x-pl.dx)/(plan.breedte*pl.schaal)*100;
      const y=(pl.start.y-pl.dy)/(plan.hoogte*pl.schaal)*100;
      if(x>=0&&x<=100&&y>=0&&y<=100){
        if(kp.aan){ koppelTik(x,y); }
        else if(pl.nummeren){ nummerHier(x,y); }
        else{
          // Tik je op een punt dat er al staat, dan wil je dát bekijken, geen nieuw punt ernaast.
          const raak=puntGeraakt(pl.start.x,pl.start.y);
          if(raak){ pl.gekozen=raak.id; planTeken(); planVoet(); }
          else{
            pl.gekozen=null;
            pl.pin={x,y,lokaal:lokaalBij(x,y)};
            planTeken();planVoet();houdPinVrij();
          }
        }
      }
    }
    pl.start=null;
  };
  c.addEventListener("pointerup",los);
  c.addEventListener("pointercancel",los);

  c.addEventListener("wheel",e=>{           // op de Mac: zoomen met het scrollwiel
    if(!plan)return;
    e.preventDefault();
    const b=c.getBoundingClientRect(), mx=e.clientX-b.left, my=e.clientY-b.top;
    const f=Math.exp(-e.deltaY*0.0022);
    const nieuw=Math.max(0.05,Math.min(40,pl.schaal*f)), echt=nieuw/pl.schaal;
    pl.dx=mx-(mx-pl.dx)*echt; pl.dy=my-(my-pl.dy)*echt; pl.schaal=nieuw;
    planTeken();
  },{passive:false});

  addEventListener("resize",()=>{if(document.getElementById("plandlg").open)planTeken();});
}

document.getElementById("planknop").onclick=openPlan;
document.getElementById("pl-laad").onclick=()=>document.getElementById("planbestand").click();

/* Meerdere plannen: de knop wisselt er doorheen. Twee niveaus is de praktijk; een lijst zou
   meer schermruimte kosten dan ze oplevert. */
document.getElementById("pl-plan").onclick=async()=>{
  // tijdens het koppelen bepaalt de beurt welk plan je ziet; zelf wisselen zou je kwijtspelen
  if(kp.aan){melding("Tijdens het koppelen wisselt het plan vanzelf");return;}
  if(planLijst.length<2){document.getElementById("planbestand").click();return;}
  const i=plan?planLijst.indexOf(plan.zone):-1;
  const volgende=planLijst[(i+1)%planLijst.length];
  await toonPlan(volgende);
  document.getElementById("pl-plan").textContent="Plan: "+volgende;
};

document.getElementById("pl-wis").onclick=()=>{pl.pin=null;planTeken();planVoet();};
document.getElementById("pl-lokaal").onclick=toonLokalenlijst;

/* Inklappen: op een telefoon telt elke vierkante centimeter kaart. De keuze blijft bewaard,
   want wie inklapt wil dat morgen ook. */
const VOUWSLEUTEL="werfpunten-planvouw";
function zetVouw(klein){
  document.getElementById("pl-voet").classList.toggle("klein",klein);
  document.getElementById("pl-vouw").textContent=klein?"▴":"▾";
  try{localStorage.setItem(VOUWSLEUTEL,klein?"1":"0")}catch(e){}
  planTeken();
}

/* Zoomen met knoppen in plaats van alleen met de vingers: op een grote iPad knijp je niet
   comfortabel met één hand, en een knop kent geen vertraging — bij dubbeltikken zou elke pin
   moeten wachten of er een tweede tik komt. */
function zoomStap(factor){
  const c=document.getElementById("plancanvas");
  const b=c.getBoundingClientRect();
  if(!plan||!b.width)return;
  const mx=b.width/2,my=b.height/2;
  const nieuw=Math.max(0.02,Math.min(60,pl.schaal*factor)), echt=nieuw/pl.schaal;
  pl.dx=mx-(mx-pl.dx)*echt; pl.dy=my-(my-pl.dy)*echt; pl.schaal=nieuw;
  planTeken();
}
document.getElementById("pl-in").onclick=()=>zoomStap(1.6);
document.getElementById("pl-uit").onclick=()=>zoomStap(1/1.6);

  plan.laatst={x:pl.pin.x,y:pl.pin.y};
  zetPlan(plan.zone,plan);
  if(plan.zone!==staat.zone&&ZONES.includes(plan.zone)){staat.zone=plan.zone;bewaarStaat();tekenZones();}

document.getElementById("pl-benoem").onclick=async()=>{
  if(kp.aan){melding("Eerst het koppelen afmaken of stoppen");return;}
  if(!plan||!pl.pin){melding("Zet eerst een pin");return;}
  const l=pl.pin.lokaal;
  const antwoord=await vraagTekst("Plek benoemen",
    "Eén regel: nummer en naam, bijvoorbeeld “1.02 vergaderzaal”.\n"+
    "Leeg laten koppelt het lokaal los van dit punt; een streepje (-) haalt het uit het plan.\n"+
    "De naam blijft bewaard en geldt vanaf nu voor elk punt op deze plek.",
    l?(l.nr+" "+(l.naam||"")).trim():"");
  if(antwoord===null)return;
  const tekst=antwoord.trim();

  // hetzelfde lokaal terugvinden in het plan: nummer én plaats moeten kloppen
  const zelfde=o=>l&&o.nr===l.nr&&Math.abs(o.x-l.x)<0.01&&Math.abs(o.y-l.y)<0.01;

  if(!tekst){
    // leeg = het foute lokaal loskoppelen van dit punt; het plan blijft ongemoeid
    pl.pin.lokaal=null;planTeken();planVoet();return;
  }
  if(tekst==="-"){
    if(l){plan.lokalen=(plan.lokalen||[]).filter(o=>!zelfde(o));await zetPlan(plan.zone,plan);}
    pl.pin.lokaal=null;planTeken();planVoet();
    melding(l?(l.nr+" uit het plan gehaald"):"Er stond hier geen lokaal");
    return;
  }
  const m=tekst.match(/^(\S+)\s*(.*)$/);
  const nieuw={nr:m[1],naam:(m[2]||"").trim(),x:pl.pin.x,y:pl.pin.y};
  // Alleen verplaatsen wat je écht bijwerkt. Zet je hier een ánder nummer, dan hoort dat lokaal
  // gewoon bij dit punt en blijft het oude staan waar het stond — anders wist je met een
  // correctie een lokaal uit dat verderop misschien perfect klopt.
  plan.lokalen=(plan.lokalen||[]).filter(o=>!(zelfde(o)&&o.nr===nieuw.nr));
  // stond dit nummer al ergens anders? Dan is er nu een dubbel, en dat hoor je te weten:
  // één van de twee is fout, en welke kun jij zien en de app niet.
  const elders=plan.lokalen.some(o=>o.nr===nieuw.nr);
  plan.lokalen.push(nieuw);
  pl.pin.lokaal=nieuw;
  await zetPlan(plan.zone,plan);
  planTeken();planVoet();
  melding(elders ? (nieuw.nr+" stond al elders — nu twee keer; haal er één weg met “-”")
        : l&&l.nr!==nieuw.nr ? (nieuw.nr+" toegevoegd; "+l.nr+" bleef staan")
        : "Plek bewaard in het plan");
};

    +" tot je iets anders kiest — lang indrukken om los te laten"):"Plek op het plan aanduiden";

/* Lang indrukken laat de plek los, zonder het plan te moeten openen. Korte tik opent het plan,
   zoals altijd. */
(function(){
  const k=document.getElementById("planknop");
  let t=null;
  const start=()=>{ t=setTimeout(()=>{
      t=null;
      if(!wachtendePlek){melding("Er geldt nu geen plek");return;}
      const was=wachtendePlek.lokaal||plaatsKort(wachtendePlek);
      wachtendePlek=null;merkPlanknop();
      melding(was+" losgelaten");
    },550); };
  const stop=e=>{ if(t===null){e.preventDefault();e.stopPropagation();} clearTimeout(t); };
  k.addEventListener("pointerdown",start);
  k.addEventListener("pointerup",stop,true);
  k.addEventListener("pointercancel",()=>clearTimeout(t));
  k.addEventListener("pointerleave",()=>clearTimeout(t));
})();
function plaatsKort(p){return Math.round(p.x)+","+Math.round(p.y);}

document.getElementById("planbestand").onchange=async e=>{
  const f=e.target.files[0]; e.target.value="";
  if(!f)return;
  // Meldingen met het bestand erbij: gaat het mis, dan wil je op de werf kunnen zien wát er
  // mis is zonder een computer te moeten openen.
  const kort=(f.name||"bestand").slice(0,22);
  let tekst;
  try{tekst=await f.text();}
  catch(err){melding("Kan "+kort+" niet lezen ("+(err.name||"fout")+")");return;}
  if(!tekst||!tekst.trim()){melding(kort+" is leeg ("+Math.round(f.size/1000)+" kB)");return;}
  let data;
  try{data=JSON.parse(tekst);}
  catch(err){melding(kort+" is geen plan — begint met “"+tekst.trim().slice(0,12)+"…”");return;}
  if(!data||!data.zone){melding(kort+": geen zone in het bestand");return;}
  if(!data.beeld||!data.breedte){melding(kort+": geen tekening in het bestand");return;}

  /* Ligt er al een plan voor deze zone met punten erop, dan is dit een nieuwe versie en geen
     nieuw plan. Overschrijven zou die punten verzetten zonder dat iemand het ziet: ze dragen
     procenten van een blad, en dit is een ander blad. */
  const bestaand=await haalPlan(data.zone);
  let geparkeerd=null;
  if(bestaand){
    const raakt=puntenOpZone(data.zone);
    if(raakt.length){
      const naam=await vrijeVersienaam(data.zone);
      const hoeveel=stuks(raakt.length,"punt","punten");
      if(!await vraagJa("Nieuwe versie van "+data.zone,[
        "Op <b>"+veilig(data.zone)+"</b> ligt al een plan, met "+hoeveel+" erop.",
        "Een punt onthoudt zijn plaats in procenten van het blad. Op een ándere tekening wijzen "+
          "diezelfde procenten een andere plek aan, dus zomaar vervangen zou "+hoeveel+
          " verzetten zonder dat iemand het ziet.",
        "Daarom blijft het vorige blad staan als <b>"+veilig(naam)+"</b>, met de punten erop, tot "+
          "je ze hebt overgezet. Dat gaat met <b>Koppel</b>: wijs twee keer dezelfde hoek aan op "+
          "beide tekeningen, en de punten rekenen zichzelf om."
      ],"Nieuwe versie")){melding(kort+" niet geladen — "+data.zone+" blijft zoals het was");return;}
      geparkeerd=await parkeerPlan(bestaand,naam,raakt);
      if(!geparkeerd)return;
    }
  }

  if(!await zetPlan(data.zone,data)){melding("Opslag weigert — ruimte vol of privémodus?");return;}
  planLijst=await planZones();
  tekenZones();
  await toonPlan(data.zone);
  document.getElementById("pl-plan").textContent=planLijst.length>1?("Plan: "+data.zone):"Plan";
  if(geparkeerd){
    // Dragen beide bladen een raam, dan heeft toonPlan het overnemen al aangeboden. Zo niet, dan
    // weet het nieuwe blad nog niet waar het ligt, en is koppelen de eerstvolgende handeling —
    // meteen aanbieden, want een minuut later is de aanleiding weg.
    const t=data.georef?await teNemenPunten(await haalPlan(data.zone)):null;
    if(!(t&&t.passen.length))
      meldingMetActie(stuks(puntenOpZone(geparkeerd.zone).length,"punt staat","punten staan")+
        " nog op "+geparkeerd.zone,"koppel",
        // het koppelen speelt zich op de kaart af, dus die moet openstaan
        ()=>openPlan(data.zone).then(koppelStart));
    return;
  }
  melding("Plan "+data.zone+" geladen — "+((data.lokalen||[]).length)+" lokalen");
};

/* ---- tekenen: aanduiden op een foto, of een losse schets ----
   Alles gebeurt op een canvas in de app zelf; er is geen netwerk voor nodig. */
const KLEUREN=["#e02020","#f5a623","#1f7ae0","#111111"];
let tk={canvas:null,ctx:null,lijnen:[],kleur:KLEUREN[0],basis:null,doel:null,schaal:1,naam:"schets"};

function tkHerteken(){
  const c=tk.canvas,x=tk.ctx;
  x.clearRect(0,0,c.width,c.height);
  if(tk.basis) x.drawImage(tk.basis,0,0,c.width,c.height);
  else{ x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); }
  x.lineCap="round";x.lineJoin="round";
  tk.lijnen.forEach(l=>{
    x.strokeStyle=l.kleur; x.lineWidth=l.dikte;
    x.beginPath();
    l.punten.forEach((pt,i)=> i? x.lineTo(pt.x,pt.y) : x.moveTo(pt.x,pt.y));
    if(l.punten.length===1) x.lineTo(l.punten[0].x+0.1,l.punten[0].y+0.1);
    x.stroke();
  });
}

function tkKleuren(){
  const box=document.getElementById("tk-kleuren");box.innerHTML="";
  KLEUREN.forEach(k=>{
    const b=document.createElement("button");b.type="button";b.className="tk-kleur"+(k===tk.kleur?" actief":"");
    b.style.background=k;b.setAttribute("aria-label","kleur "+k);
    b.onclick=()=>{tk.kleur=k;tkKleuren();};
    box.appendChild(b);
  });
}

async function openTekenscherm(bron, doel){
  const dlg=document.getElementById("tekendlg");
  tk.canvas=document.getElementById("tekencanvas");
  tk.ctx=tk.canvas.getContext("2d");
  tk.lijnen=[];tk.doel=doel;tk.basis=null;
  if(bron){
    const img=new Image();
    await new Promise(res=>{img.onload=res;img.onerror=res;img.src=URL.createObjectURL(bron);});
    tk.basis=img;
    tk.canvas.width=img.width||1200; tk.canvas.height=img.height||1600;
  }else{
    tk.canvas.width=1200; tk.canvas.height=1600;
  }
  tkKleuren(); tkHerteken();
  dlg.showModal();

  const dikte=Math.max(4, Math.round(tk.canvas.width/220));
  let bezig=false, huidige=null;
  const naarCanvas=e=>{
    const r=tk.canvas.getBoundingClientRect();
    return {x:(e.clientX-r.left)*(tk.canvas.width/r.width),
            y:(e.clientY-r.top)*(tk.canvas.height/r.height)};
  };
  tk.canvas.onpointerdown=e=>{
    bezig=true; tk.canvas.setPointerCapture(e.pointerId);
    huidige={kleur:tk.kleur,dikte,punten:[naarCanvas(e)]};
    tk.lijnen.push(huidige); tkHerteken();
  };
  tk.canvas.onpointermove=e=>{ if(!bezig)return; huidige.punten.push(naarCanvas(e)); tkHerteken(); };
  const stop=()=>{bezig=false;huidige=null;};
  tk.canvas.onpointerup=stop; tk.canvas.onpointercancel=stop;
}

document.getElementById("tk-undo").onclick=()=>{tk.lijnen.pop();tkHerteken();};
