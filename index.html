<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d97406">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Werfpunten">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Werfpunten</title>
<style>
  :root{
    --ground:#eef0ec; --surface:#ffffff; --surface-2:#f7f8f5;
    --ink:#161a1e; --ink-soft:#5d646b; --ink-faint:#8c9299;
    --line:#d7dad4; --line-soft:#e6e8e3;
    --accent:#d97406; --accent-ink:#ffffff;
    --zone:#2c5a78; --zone-soft:#e4edf3;
    --ok:#3d7550; --warn:#b04527;
    --radius:10px;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#13161a; --surface:#1b2026; --surface-2:#222830;
      --ink:#e9ebed; --ink-soft:#a3abb3; --ink-faint:#767e86;
      --line:#2d343c; --line-soft:#252b32;
      --accent:#f08a1c; --accent-ink:#16191c;
      --zone:#7fb3d5; --zone-soft:#22303a;
      --ok:#6aab7f; --warn:#e0715a;
    }
  }
  :root[data-theme="dark"]{
    --ground:#13161a; --surface:#1b2026; --surface-2:#222830;
    --ink:#e9ebed; --ink-soft:#a3abb3; --ink-faint:#767e86;
    --line:#2d343c; --line-soft:#252b32;
    --accent:#f08a1c; --accent-ink:#16191c;
    --zone:#7fb3d5; --zone-soft:#22303a;
    --ok:#6aab7f; --warn:#e0715a;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

  header{
    background:var(--surface); border-bottom:1px solid var(--line);
    padding:10px 14px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
    position:sticky; top:0; z-index:6;
  }
  h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em}
  .meta{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-faint);margin-left:auto}
  .versie{font:10px ui-monospace,Menlo,monospace;color:var(--ink-faint);opacity:.6;margin-left:6px}

  .dagboek{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;padding:10px 14px;
    background:var(--surface-2);border-bottom:1px solid var(--line-soft);align-items:center}
  .dagboek label{font:11px ui-monospace,Menlo,monospace;color:var(--ink-soft);letter-spacing:.04em}
  .weerveld{display:flex;gap:6px}
  .weerveld input{flex:1}
  #weerknop{padding:6px 10px;font-size:15px;line-height:1;border:1px solid var(--line);
    background:var(--surface-2);color:var(--ink-soft);border-radius:8px;flex:0 0 auto}
  #weerknop.bezig{opacity:.5}
  #weerknop.klaar{border-color:var(--ok);color:var(--ok)}
  .weerinfo{grid-column:1/-1;font:11px ui-monospace,Menlo,monospace;color:var(--ink-faint);margin:0}
  .dagboek input{
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    border-radius:8px;padding:7px 9px;font-size:14px;width:100%;
  }

  .aanwezig{padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line-soft)}
  .aanwezig-kop{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .aw-label{font:11px ui-monospace,Menlo,monospace;color:var(--ink-soft);letter-spacing:.04em}
  .aw-beheer{background:none;border:none;color:var(--accent);font-size:12px;padding:0;margin-left:auto;cursor:pointer}
  .aw-chips{display:flex;flex-wrap:wrap;gap:6px}
  .aw-chip{border:1.5px solid var(--line);background:transparent;color:var(--ink-soft);
    font-size:13px;padding:6px 11px;border-radius:999px;cursor:pointer}
  .aw-chip[aria-pressed="true"]{background:var(--zone-soft);border-color:var(--zone);color:var(--zone);font-weight:600}
  .aw-leeg{font-size:12.5px;color:var(--ink-faint)}
  .sprekers{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}
  .spreker-knop{border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);
    font:12px ui-monospace,Menlo,monospace;padding:5px 9px;border-radius:7px;cursor:pointer}
  .spreker-knop.actief{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .zone-btn.met-plan{border-color:var(--zone);font-weight:650}
  .zones{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--surface);
    border-bottom:1px solid var(--line);position:sticky;top:44px;z-index:5;-webkit-overflow-scrolling:touch}
  .zones::-webkit-scrollbar{display:none}
  .zone-btn{
    flex:0 0 auto;border:1.5px solid var(--line);background:transparent;color:var(--ink-soft);
    font:13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em;
    padding:11px 14px;border-radius:999px;cursor:pointer;transition:background .12s,color .12s,border-color .12s;
  }
  .zone-btn[aria-pressed="true"]{background:var(--zone);border-color:var(--zone);color:var(--ground)}
  .zone-btn:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px}

  main{flex:1;padding:12px 14px 8px;display:flex;flex-direction:column;gap:8px}
  .leeg{color:var(--ink-faint);font-size:14px;text-align:center;padding:32px 12px;line-height:1.6}

  .punt{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
    padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
  .punt .thumb{width:52px;height:52px;flex:0 0 auto;border-radius:7px;object-fit:cover;background:var(--surface-2);
    border:1px solid var(--line-soft)}
  .punt .body{flex:1;min-width:0}
  .punt .kop{display:flex;gap:7px;align-items:center;margin-bottom:3px;flex-wrap:wrap}
  .chip{font:11px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;padding:4px 7px;border-radius:5px;
    background:var(--zone-soft);color:var(--zone);font-weight:600}
  .tijd{font:11px ui-monospace,Menlo,monospace;color:var(--ink-faint)}
  .spreker{font:11px ui-monospace,Menlo,monospace;color:var(--accent);font-weight:600}
  .punt p{margin:0;font-size:15px;word-wrap:break-word;overflow-wrap:anywhere}
  .punt p.leegnotitie{color:var(--ink-faint);font-style:italic}
  .punt-wrap{position:relative;overflow:hidden;border-radius:var(--radius);touch-action:pan-y}
  .wisknop{position:absolute;top:0;right:0;bottom:0;width:96px;border:none;border-radius:0;
    background:var(--warn);color:#fff;font-size:14px;font-weight:600;padding:0}
  .punt{position:relative;transition:transform .18s ease;will-change:transform;touch-action:pan-y}
  .punt.open{transform:translateX(-96px)}
  .toast{display:flex;align-items:center;gap:14px}
  .toast-actie{background:none;border:none;color:var(--accent);font-weight:650;font-size:14px;padding:0;cursor:pointer}

  .invoer{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);
    padding:10px 14px calc(10px + var(--safe-b));display:flex;flex-direction:column;gap:8px;z-index:6}
  textarea{
    width:100%;min-height:64px;resize:none;border:1px solid var(--line);border-radius:var(--radius);
    padding:10px 11px;font:16px/1.4 inherit;background:var(--surface);color:var(--ink)}
  textarea::placeholder{color:var(--ink-faint)}
  .rij{display:flex;gap:8px}
  button{font:inherit;cursor:pointer;border-radius:var(--radius);border:1px solid var(--line);
    background:var(--surface-2);color:var(--ink);padding:13px 14px;font-size:15px}
  .fotoknop,.docknop{flex:0 0 auto;min-width:80px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:14px}
  .docknop.heeft{border-color:var(--ok);color:var(--ok);font-weight:600}
  .bijlage{width:52px;height:52px;flex:0 0 auto;border-radius:7px;border:1px solid var(--line);
    background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;font:9px ui-monospace,Menlo,monospace;color:var(--ink-soft);text-align:center;padding:3px;overflow:hidden}
  .bijlage span:first-child{font-size:19px;line-height:1}
  .fotoknop.heeft{border-color:var(--ok);color:var(--ok);font-weight:600}
  .bewaar{flex:1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:650}
  .bewaar:disabled{opacity:.4}
  input[type=file]{display:none}

  .acties{display:flex;gap:8px;padding:4px 14px 16px}
  .acties button{flex:1;font-size:14px;padding:11px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--safe-b));
    background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:8px;font-size:14px;
    opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
  .toast.aan{opacity:1}
  dialog{border:none;border-radius:12px;padding:0;max-width:92vw;width:520px;background:var(--surface);color:var(--ink)}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  .dlg-kop{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .dlg-kop h2{margin:0;font-size:15px}
  .dlg-body{padding:14px 16px;max-height:64vh;overflow:auto}
  .dlg-body pre{white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,monospace;margin:0;color:var(--ink)}
  .dlg-body img{width:100%;border-radius:8px;margin-bottom:10px;border:1px solid var(--line-soft)}
  .dlg-voet{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
  .dlg-voet button{flex:1}
  #invoerdlg{width:min(94vw,520px);max-width:94vw}
  #invoerdlg textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:var(--radius);
    padding:10px;font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface);color:var(--ink);resize:vertical}
  .inv-uitleg{margin:0 0 10px;font-size:13px;color:var(--ink-soft);white-space:pre-line}
  #invoerdlg .inv-ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
  #tekendlg{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;background:#111;border-radius:0}
  #tekendlg::backdrop{background:#000}
  .teken-balk{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#1c1c1e;
    padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .teken-balk button{background:#2c2c2e;color:#f2f2f7;border:1px solid #3a3a3c;font-size:14px;padding:9px 12px}
  /* het planscherm heeft vijf knoppen; op 375px moeten die krapper om te passen */
  #plandlg .teken-balk{gap:6px;padding-left:8px;padding-right:8px;padding-top:calc(7px + env(safe-area-inset-top,0px));padding-bottom:7px}
  #plandlg .teken-balk button{font-size:13px;padding:9px 9px;white-space:nowrap}
  .teken-balk .tk-klaar{margin-left:auto;background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}
  .tk-kleuren{display:flex;gap:6px}
  .tk-kleur{width:26px;height:26px;border-radius:50%;border:2px solid #48484a;padding:0;cursor:pointer}
  .tk-kleur.actief{border-color:#fff;transform:scale(1.12)}
  .teken-vlak{flex:1;display:flex;align-items:center;justify-content:center;height:calc(100dvh - 60px);background:#111}
  #tekencanvas{max-width:100%;max-height:100%;touch-action:none;background:#fff}
  /* plan: zelfde schermvullende opzet als het tekenscherm */
  #plandlg{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;background:#111;border-radius:0}
  #plandlg::backdrop{background:#000}
  .plan-vlak{position:relative;height:calc(100dvh - 56px);background:#111;overflow:hidden}
  #plancanvas{display:block;width:100%;height:100%;touch-action:none}
  /* display:flex zou het hidden-attribuut overstemmen */
  .plan-leeg[hidden],.plan-voet[hidden]{display:none}
  .plan-leeg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;color:#c7cbd0;font-size:14px;text-align:center;padding:24px;line-height:1.6}
  .plan-leeg button{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}
  .plan-voet{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:8px;
    padding:10px 12px calc(10px + var(--safe-b));background:rgba(28,28,30,.96);color:#f2f2f7;font-size:13px}
  .plan-kop{display:flex;align-items:center;gap:10px}
  .plan-teller{flex:0 0 auto;font:11px ui-monospace,Menlo,monospace;color:#8e949b}
  .plan-vouw{flex:0 0 auto;background:none!important;border:none!important;color:#8e949b!important;
    font-size:18px!important;padding:4px 8px!important;line-height:1}
  /* ingeklapt: alleen de regel met het lokaal, de rest van het scherm is kaart */
  .plan-voet.klein .plan-buren,.plan-voet.klein .plan-invoer{display:none}
  .plan-voet.klein{gap:0}
  .plan-zoom{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
  .plan-zoom button{width:38px;height:38px;padding:0;font-size:19px;line-height:1;
    background:rgba(28,28,30,.9);color:#f2f2f7;border:1px solid #3a3a3c;border-radius:9px}
  /* de buren: als de gok ernaast zit, is de juiste ruimte bijna altijd een van de dichtstbijzijnde */
  .plan-buren{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  .plan-buren::-webkit-scrollbar{display:none}
  .plan-buren button{flex:0 0 auto;background:#2c2c2e;color:#c9ced4;border:1px solid #3a3a3c;
    font:12px ui-monospace,Menlo,monospace;padding:7px 10px}
  .plan-buren button.actief{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}
  .plan-invoer{display:flex;flex-direction:column;gap:7px}
  .plan-invoer textarea{width:100%;background:#1c1c1e;color:#f2f2f7;border:1px solid #3a3a3c;
    border-radius:9px;padding:9px 10px;font:15px/1.35 inherit;resize:none}
  .plan-invoer textarea::placeholder{color:#7c828a}
  .plan-knoppen{display:flex;gap:7px}
  .plan-knoppen button{background:#2c2c2e;color:#f2f2f7;border:1px solid #3a3a3c;font-size:14px;padding:10px 12px}
  .plan-knoppen .tk-klaar{flex:1;margin-left:0}
  .plan-knoppen button.heeft{border-color:var(--ok);color:var(--ok)}
  .plan-lokaal{flex:1;min-width:0;font:13px ui-monospace,Menlo,monospace;line-height:1.35;cursor:pointer}
  .plan-lokaal b{font-size:15px;letter-spacing:.02em}
  .plan-lokaal span{color:#a0a6ad;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .plan-voet button{background:#2c2c2e;color:#f2f2f7;border:1px solid #3a3a3c;font-size:13px;padding:9px 11px}
  .planknop.heeft{border-color:var(--ok);color:var(--ok);font-weight:600}
  .plek{font:11px/1 ui-monospace,Menlo,monospace;letter-spacing:.04em;padding:4px 7px;border-radius:5px;
    background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line-soft)}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Werfpunten</h1>
    <span class="meta" id="teller">0 punten</span><span class="versie" id="versie"></span>
  </header>

  <div class="dagboek">
    <label for="weer">W:</label><div class="weerveld"><input id="weer" placeholder="droog, 19°, wind matig" autocomplete="off"><button type="button" id="weerknop" title="Weer ophalen via locatie">☁</button></div>
    <label for="bezetting">BZ:</label><input id="bezetting" placeholder="6 man — 2 dakwerkers, 3 schilders" autocomplete="off">
    <p class="weerinfo" id="weerinfo"></p>
  </div>

  <div class="aanwezig">
    <div class="aanwezig-kop">
      <span class="aw-label">Aanwezig</span>
      <button type="button" id="contactbeheer" class="aw-beheer">contacten</button>
    </div>
    <div class="aw-chips" id="awchips"></div>
  </div>

  <nav class="zones" id="zones" aria-label="Zone kiezen"></nav>

  <main id="lijst"></main>

  <div class="acties">
    <button id="kopieer">Kopieer verslagtekst</button>
    <button id="fotos">Bijlagen tonen</button>
  </div>

  <div class="invoer">
    <div class="sprekers" id="sprekers"></div>
    <textarea id="tekst" placeholder="Vaststelling…" rows="2"></textarea>
    <div class="rij">
      <button class="fotoknop" id="fotoknop" type="button">📷 Foto</button>
      <button class="docknop" id="docknop" type="button">📄 Doc</button>
      <button class="docknop" id="schetsknop" type="button">✏️ Schets</button>
      <button class="docknop planknop" id="planknop" type="button">📍 Plan</button>
      <button class="bewaar" id="bewaar" type="button" disabled>Punt bewaren</button>
    </div>
    <input type="file" id="foto" accept="image/*" capture="environment">
    <input type="file" id="doc" accept="image/*,application/pdf">
    <input type="file" id="planbestand" accept=".werfplan,application/json">
  </div>
</div>

<div class="toast" id="toast"></div>

<dialog id="invoerdlg">
  <div class="dlg-kop"><h2 id="inv-titel">Invoer</h2></div>
  <div class="dlg-body">
    <p class="inv-uitleg" id="inv-uitleg"></p>
    <textarea id="inv-veld" rows="6"></textarea>
  </div>
  <div class="dlg-voet">
    <button id="inv-annuleer">Annuleren</button>
    <button id="inv-ok" class="inv-ok">Bewaren</button>
  </div>
</dialog>

<dialog id="tekendlg">
  <div class="teken-balk">
    <button type="button" id="tk-undo">Ongedaan</button>
    <button type="button" id="tk-wis">Wissen</button>
    <span class="tk-kleuren" id="tk-kleuren"></span>
    <button type="button" id="tk-klaar" class="tk-klaar">Klaar</button>
  </div>
  <div class="teken-vlak"><canvas id="tekencanvas"></canvas></div>
</dialog>

<dialog id="plandlg">
  <div class="teken-balk">
    <button type="button" id="pl-plan">Plan</button>
    <button type="button" id="pl-wis">Wis pin</button>
    <button type="button" id="pl-nummer">Nummer</button>
    <button type="button" id="pl-bewaar">Bewaar</button>
    <button type="button" id="pl-klaar" class="tk-klaar">Lijst</button>
  </div>
  <div class="plan-vlak">
    <canvas id="plancanvas"></canvas>
    <div class="plan-zoom">
      <button type="button" id="pl-in" aria-label="Inzoomen">+</button>
      <button type="button" id="pl-uit" aria-label="Uitzoomen">−</button>
      <button type="button" id="pl-heel" aria-label="Hele plan" style="font-size:13px">⤢</button>
    </div>
    <div class="plan-leeg" id="pl-leeg" hidden>
      <div>Nog geen plan op dit toestel.<br>Laad een <code>.werfplan</code>-bestand;
        het blijft daarna offline beschikbaar.</div>
      <button type="button" id="pl-laad">Plan laden</button>
    </div>
    <div class="plan-voet" id="pl-voet" hidden>
      <div class="plan-kop">
        <button type="button" class="plan-vouw" id="pl-vouw" aria-label="Invoer in- of uitklappen">▾</button>
        <div class="plan-lokaal" id="pl-lokaal"></div>
        <span class="plan-teller" id="pl-teller"></span>
        <button type="button" id="pl-benoem">Benoem</button>
      </div>
      <div class="plan-buren" id="pl-buren"></div>
      <div class="plan-invoer" id="pl-invoer" hidden>
        <textarea id="pl-tekst" rows="2" placeholder="Wat zie je hier?"></textarea>
        <div class="plan-knoppen">
          <button type="button" id="pl-foto">📷</button>
          <button type="button" id="pl-schets" title="Op het plan tekenen">✏️</button>
          <button type="button" id="pl-punt" class="tk-klaar">Punt bewaren</button>
        </div>
      </div>
    </div>
  </div>
</dialog>

<dialog id="dlg">
  <div class="dlg-kop"><h2 id="dlg-titel">Verslagtekst</h2></div>
  <div class="dlg-body" id="dlg-body"></div>
  <div class="dlg-voet">
    <button id="dlg-kopieer">Kopieer</button>
    <button id="dlg-sluit">Sluiten</button>
  </div>
</dialog>

<script>
const ZONES=["N3","N4","N5","DAK","KAPEL","KELDER","STELLING","BUITEN"];
const SLEUTEL="werfpunten-v1";
const VERSIE="v24";
let staat={datum:new Date().toISOString().slice(0,10),weer:"",bezetting:"",zone:"N3",punten:[]};
let wachtendeFoto=null;
let wachtendeBijlage=null;

/* opslag: punten in localStorage, foto's in IndexedDB */
let db=null;
function opendb(){return new Promise(res=>{
  let klaar=false;
  const af=v=>{if(!klaar){klaar=true;res(v)}};
  setTimeout(()=>af(null),1500);           // nooit blijven hangen
  try{
    const q=indexedDB.open("werfpunten",3);
    q.onupgradeneeded=()=>{
      // versie 2 voegt de plannen toe, versie 3 het archief per dag; bestaande toestellen
      // houden hun foto's en plannen
      try{if(!q.result.objectStoreNames.contains("fotos"))q.result.createObjectStore("fotos")}catch(e){}
      try{if(!q.result.objectStoreNames.contains("plannen"))q.result.createObjectStore("plannen")}catch(e){}
      try{if(!q.result.objectStoreNames.contains("dagen"))q.result.createObjectStore("dagen")}catch(e){}
    };
    q.onsuccess=()=>{db=q.result;af(db)};
    q.onerror=()=>af(null);
    q.onblocked=()=>af(null);
  }catch(e){af(null)}
});}
function zetFoto(id,blob){return new Promise(res=>{
  if(!db)return res();
  const t=db.transaction("fotos","readwrite");t.objectStore("fotos").put(blob,id);t.oncomplete=()=>res();
});}
function haalFoto(id){return new Promise(res=>{
  if(!db)return res(null);
  const q=db.transaction("fotos","readonly").objectStore("fotos").get(id);
  q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);
});}

/* Contacten staan los van de dag: ze blijven bewaard over vergaderingen heen.
   De lijst zit alleen op dit toestel; er staan geen namen in de app zelf. */
const CONTACTSLEUTEL="werfpunten-contacten";
let contacten=[];
function laadContacten(){
  try{const r=localStorage.getItem(CONTACTSLEUTEL); if(r) contacten=JSON.parse(r)||[];}catch(e){contacten=[];}
}
function bewaarContacten(){try{localStorage.setItem(CONTACTSLEUTEL,JSON.stringify(contacten))}catch(e){}}

function tekenContacten(){
  const box=document.getElementById("awchips"); box.innerHTML="";
  if(!contacten.length){
    const p=document.createElement("span");p.className="aw-leeg";
    p.textContent="nog geen contacten — tik op ‘contacten’ om ze toe te voegen";
    box.appendChild(p);
  }
  contacten.forEach(c=>{
    const b=document.createElement("button");b.type="button";b.className="aw-chip";
    b.textContent=c.naam;
    const aanwezig=(staat.aanwezig||[]).includes(c.code);
    b.setAttribute("aria-pressed",String(aanwezig));
    b.onclick=()=>{
      staat.aanwezig=staat.aanwezig||[];
      const i=staat.aanwezig.indexOf(c.code);
      if(i<0)staat.aanwezig.push(c.code); else staat.aanwezig.splice(i,1);
      bewaarStaat();tekenContacten();tekenSprekers();
    };
    box.appendChild(b);
  });
}

/* Alleen wie aanwezig is, verschijnt als snelknop bij de invoer. */
function tekenSprekers(){
  const box=document.getElementById("sprekers"); box.innerHTML="";
  const lijst=contacten.filter(c=>(staat.aanwezig||[]).includes(c.code));
  lijst.forEach(c=>{
    const b=document.createElement("button");b.type="button";b.className="spreker-knop";
    b.textContent=c.code;b.title=c.naam;
    b.onclick=()=>{
      const ta=document.getElementById("tekst");
      const zonder=ta.value.replace(/^\s*(?:[A-Z0-9]{1,4}\s*:\s*)/,"");
      const zelfde=new RegExp("^\\s*"+c.code+"\\s*:").test(ta.value);
      ta.value = zelfde ? zonder : (c.code+": "+zonder);
      ta.dispatchEvent(new Event("input"));
      tekenSprekers();
      ta.focus();
    };
    const ta=document.getElementById("tekst");
    if(new RegExp("^\\s*"+c.code+"\\s*:").test(ta.value)) b.classList.add("actief");
    box.appendChild(b);
  });
}

async function beheerContacten(){
  const huidig=contacten.map(c=>c.naam+" = "+c.code).join("\n");
  const uitleg="Eén contact per regel:  Naam = CODE\nDe code komt in het verslag voor de uitspraak te staan.\n\nVoorbeeld:\nJan Peeters = JP\nGemeente = GEM";
  const nieuw=await vraagTekst("Contacten", uitleg, huidig);
  if(nieuw===null)return;
  contacten = nieuw.split("\n").map(r=>r.trim()).filter(Boolean).map(r=>{
    const d=r.split("=");
    const naam=(d[0]||"").trim();
    let code=(d[1]||"").trim().toUpperCase();
    if(!code) code=naam.split(/\s+/).map(w=>w[0]||"").join("").slice(0,3).toUpperCase();
    return {naam,code};
  }).filter(c=>c.naam);
  bewaarContacten();
  staat.aanwezig=(staat.aanwezig||[]).filter(code=>contacten.some(c=>c.code===code));
  bewaarStaat();tekenContacten();tekenSprekers();
}
document.getElementById("contactbeheer").onclick=beheerContacten;

function bewaarStaat(){try{localStorage.setItem(SLEUTEL,JSON.stringify(staat))}catch(e){}}
let vorigeDag=null;   // wat er stond toen de app voor het laatst gebruikt werd, op een andere datum
function laadStaat(){
  try{const r=localStorage.getItem(SLEUTEL);if(r){const s=JSON.parse(r);
    if(s.datum===staat.datum)staat=s;
    else if((s.punten||[]).length)vorigeDag=s;}}catch(e){}
  // opschonen van punten uit een eerdere versie die "(enkel foto)" als tekst kregen
  let gewijzigd=false;
  (staat.punten||[]).forEach(p=>{ if(p.tekst==="(enkel foto)"){p.tekst="";gewijzigd=true;} });
  if(gewijzigd) bewaarStaat();
}

function melding(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("aan");
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("aan"),1700);}
function meldingMetActie(tekst,actietekst,fn){
  const el=document.getElementById("toast");
  el.innerHTML="";
  const s=document.createElement("span");s.textContent=tekst;el.appendChild(s);
  const b=document.createElement("button");b.className="toast-actie";b.type="button";b.textContent=actietekst;
  b.onclick=()=>{fn();el.classList.remove("aan");};
  el.appendChild(b);
  el.classList.add("aan");
  clearTimeout(el._t); el._t=setTimeout(()=>{el.classList.remove("aan");laatstVerwijderd=null;},6000);
}

function tekenZones(){
  const nav=document.getElementById("zones");nav.innerHTML="";
  ZONES.forEach(z=>{
    const b=document.createElement("button");
    const heeftPlan=planLijst.includes(z);
    b.className="zone-btn"+(heeftPlan?" met-plan":"");
    // Is er een plan voor deze zone, dan opent de knop het meteen. Dat is wat je verwacht als je
    // op N3 drukt: het plan van niveau 3 zien, niet alleen een zone instellen.
    b.textContent=heeftPlan?("📍 "+z):z;
    b.type="button";
    b.setAttribute("aria-pressed",String(z===staat.zone));
    b.onclick=()=>{
      staat.zone=z;bewaarStaat();tekenZones();
      if(planLijst.includes(z)) openPlan(z);
    };
    nav.appendChild(b);
  });
}

async function tekenLijst(){
  const m=document.getElementById("lijst");m.innerHTML="";
  document.getElementById("teller").textContent=staat.punten.length+" punt"+(staat.punten.length===1?"":"en");
  if(!staat.punten.length){
    m.innerHTML='<p class="leeg">Nog geen punten.<br>Kies een zone, typ of dicteer de vaststelling,<br>en bewaar. Een foto is optioneel.<br><span style="font-size:12.5px">Veeg een punt naar links om het te verwijderen.</span></p>';
    return;
  }
  for(const p of staat.punten){
    const wrap=document.createElement("div");wrap.className="punt-wrap";
    const wis=document.createElement("button");wis.className="wisknop";wis.type="button";
    wis.textContent="Verwijder";wis.setAttribute("aria-label","Punt verwijderen");
    wis.onclick=e=>{e.stopPropagation();verwijderPunt(p.id);};
    wrap.appendChild(wis);
    const d=document.createElement("div");d.className="punt";
    if(p.foto){
      const b=await haalFoto(p.id);
      if(p.bijlage && !p.bijlage.beeld){
        const kaart=document.createElement("div");kaart.className="bijlage";
        const ic=document.createElement("span");ic.textContent="📄";
        const nm=document.createElement("span");
        nm.textContent=(p.bijlage.naam||"doc").replace(/\.[^.]+$/,"").slice(0,12);
        kaart.appendChild(ic);kaart.appendChild(nm);
        if(b){kaart.style.cursor="zoom-in";kaart.onclick=ev=>{ev.stopPropagation();window.open(URL.createObjectURL(b),"_blank");};}
        d.appendChild(kaart);
      }else{
        const img=document.createElement("img");img.className="thumb";img.alt="";
        if(b)img.src=URL.createObjectURL(b);
        img.title="Aanduiden op deze foto";
        img.style.cursor="crosshair";
        img.onclick=ev=>{ev.stopPropagation(); if(b) openTekenscherm(b,p.id);};
        d.appendChild(img);
      }
    }
    const body=document.createElement("div");body.className="body";
    const kop=document.createElement("div");kop.className="kop";
    const chip=document.createElement("span");chip.className="chip";chip.textContent=p.zone;kop.appendChild(chip);
    if(p.plek){
      const pk=document.createElement("span");pk.className="plek";
      pk.textContent="📍 "+(p.plek.lokaal||plaatsKort(p.plek));
      pk.title=p.plek.naam||("coördinaat "+p.plek.x+","+p.plek.y+" op plan "+p.plek.zone);
      kop.appendChild(pk);
    }
    if(p.spreker){const s=document.createElement("span");s.className="spreker";s.textContent=p.spreker+":";kop.appendChild(s);}
    const t=document.createElement("span");t.className="tijd";t.textContent=p.tijd;kop.appendChild(t);
    body.appendChild(kop);
    const pp=document.createElement("p");
    if(p.tekst){pp.textContent=p.tekst}
    else{pp.textContent="notitie toevoegen…";pp.className="leegnotitie"}
    body.appendChild(pp);
    body.style.cursor="text";
    body.onclick=()=>bewerkPunt(p.id);
    d.appendChild(body);
    maakVeegbaar(d);
    wrap.appendChild(d);
    m.appendChild(wrap);
  }
}

/* Vegen naar links legt de verwijderknop bloot. Verwijderen vraagt dus altijd een
   tweede, bewuste handeling - en blijft daarna nog even terug te draaien. */
const VEEG=96;
function sluitAlle(behalve){
  document.querySelectorAll(".punt.open").forEach(el=>{ if(el!==behalve) el.classList.remove("open"); });
}
function maakVeegbaar(el){
  let x0=null,y0=null,dx=0,sleept=false;
  el.addEventListener("pointerdown",e=>{
    if(e.target.closest(".wisknop"))return;
    x0=e.clientX;y0=e.clientY;dx=0;sleept=false;el.style.transition="none";
  });
  el.addEventListener("pointermove",e=>{
    if(x0===null)return;
    const vx=e.clientX-x0, vy=e.clientY-y0;
    if(!sleept && Math.abs(vx)>8 && Math.abs(vx)>Math.abs(vy)){sleept=true;sluitAlle(el);}
    if(!sleept)return;
    dx=Math.max(-VEEG,Math.min(0,vx + (el.classList.contains("open")?-VEEG:0)));
    el.style.transform="translateX("+dx+"px)";
  });
  const eind=()=>{
    if(x0===null)return;
    el.style.transition="";el.style.transform="";
    if(sleept) el.classList.toggle("open", dx < -VEEG/2);
    x0=null;sleept=false;
  };
  el.addEventListener("pointerup",eind);
  el.addEventListener("pointercancel",eind);
  el.addEventListener("pointerleave",eind);
  el.addEventListener("click",e=>{
    if(sleept||el.classList.contains("open")){e.stopPropagation();sluitAlle(null);}
  },true);
}

let laatstVerwijderd=null;
async function verwijderPunt(id){
  const idx=staat.punten.findIndex(x=>x.id===id); if(idx<0)return;
  const p=staat.punten[idx];
  const blob=p.foto?await haalFoto(id):null;
  laatstVerwijderd={punt:p,index:idx,blob};
  staat.punten.splice(idx,1);
  bewaarStaat(); await tekenLijst();
  meldingMetActie("Punt verwijderd","Ongedaan maken",async()=>{
    if(!laatstVerwijderd)return;
    const g=laatstVerwijderd;
    staat.punten.splice(Math.min(g.index,staat.punten.length),0,g.punt);
    if(g.blob) await zetFoto(g.punt.id,g.blob);
    laatstVerwijderd=null;bewaarStaat();tekenLijst();
  });
}

async function bewerkPunt(id){
  const p=staat.punten.find(x=>x.id===id); if(!p) return;
  const huidig=(p.spreker?p.spreker+": ":"")+(p.tekst||"");
  const codes=contacten.map(c=>c.code).join(" · ");
  const nieuw=await vraagTekst("Notitie — "+p.zone+", "+p.tijd,
    codes? "Begin met een code om toe te wijzen:  "+codes : "", huidig);
  if(nieuw===null) return;
  let tekst=nieuw.trim(), spreker=null;
  const m=tekst.match(/^([A-Za-z0-9]{1,4})\s*:\s*(.*)$/);
  if(m){spreker=m[1].toUpperCase();tekst=m[2].trim();}
  p.tekst=tekst; p.spreker=spreker;
  bewaarStaat(); tekenLijst();
}

function verkleinFoto(file){return new Promise(res=>{
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=1400,sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=img.width*sc;c.height=img.height*sc;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>res(b||file),"image/jpeg",.75);
    };
    img.onerror=()=>res(file);
    img.src=r.result;
  };
  r.onerror=()=>res(file);
  r.readAsDataURL(file);
});}

/* Eerste tik maakt de foto; is er al een foto, dan opent dezelfde knop het tekenscherm.
   Zo kun je meteen aanduiden wat je bedoelt, vóór het punt bewaard is. */
document.getElementById("fotoknop").onclick=()=>{
  if(wachtendeFoto && (!wachtendeBijlage || wachtendeBijlage.beeld!==false)){
    openTekenscherm(wachtendeFoto,"nieuw");
  }else{
    document.getElementById("foto").click();
  }
};
document.getElementById("docknop").onclick=()=>document.getElementById("doc").click();

/* Scans en documenten: de knop opent de keuze van iOS — fotheek, Bestanden, of camera.
   Een plan, een papier of een bon scan je met de scanner van Notities of Bestanden
   (die maakt een PDF) en kies je hier; de app bewaart hem bij het punt. */
document.getElementById("doc").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const isBeeld=f.type.startsWith("image/");
  wachtendeFoto = isBeeld ? await verkleinFoto(f) : f;
  wachtendeBijlage = {naam:f.name||"document", type:f.type||"onbekend", beeld:isBeeld,
                      grootte:Math.round((f.size||0)/1024)};
  const k=document.getElementById("docknop");k.classList.add("heeft");k.textContent="✓ Doc";
  document.getElementById("bewaar").disabled=false;
};
document.getElementById("foto").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  wachtendeFoto=await verkleinFoto(f);
  const k=document.getElementById("fotoknop");k.classList.add("heeft");k.textContent="✏️ Aanduiden";
  document.getElementById("bewaar").disabled=false;
  // ook op de kaart moet je zien dat er een foto klaarstaat
  const pf=document.getElementById("pl-foto");
  if(pf){pf.classList.add("heeft");pf.textContent="📷 ✓";}
};

const tekstEl=document.getElementById("tekst");
tekstEl.oninput=()=>{
  document.getElementById("bewaar").disabled=!(tekstEl.value.trim()||wachtendeFoto);
  tekenSprekers();
};

/* Eén plek waar een punt ontstaat, aangeroepen vanuit het hoofdscherm én vanaf de kaart.
   `bron` bepaalt alleen waar de tekst vandaan komt; de rest is identiek, zodat een punt van de
   kaart in niets verschilt van een punt uit de lijst. */
async function bewaarPunt(veld){
  const el=veld||tekstEl;
  let tekst=el.value.trim();
  if(!tekst&&!wachtendeFoto)return false;
  let spreker=null;
  const m=tekst.match(/^([A-Za-z0-9]{1,4})\s*:\s*(.*)$/);
  if(m){spreker=m[1].toUpperCase();tekst=m[2].trim();}
  const id="p"+Date.now();
  const punt={id,zone:staat.zone,tekst:tekst,spreker,
    tijd:new Date().toTimeString().slice(0,5),foto:!!wachtendeFoto,bijlage:wachtendeBijlage,
    plek:wachtendePlek};
  if(wachtendeFoto)await zetFoto(id,wachtendeFoto);
  staat.punten.push(punt);bewaarStaat();
  el.value=""; if(el!==tekstEl)tekstEl.value="";
  wachtendeFoto=null;wachtendeBijlage=null;
  // De plek blijft staan. Je zegt één keer waar je bent en elk volgend punt landt daar, tot je
  // iets anders zegt — op een werf komen vaststellingen in trossen per ruimte. Zolang de plek
  // geldt staat ze op de knop, zodat je ziet dat ze meegaat.
  merkPlanknop();
  const k=document.getElementById("fotoknop");k.classList.remove("heeft");k.textContent="📷 Foto";
  const kd=document.getElementById("docknop");kd.classList.remove("heeft");kd.textContent="📄 Doc";
  const ks=document.getElementById("schetsknop");ks.classList.remove("heeft");ks.textContent="✏️ Schets";
  document.getElementById("bewaar").disabled=true;
  document.getElementById("foto").value="";document.getElementById("doc").value="";
  await tekenLijst();
  if(document.getElementById("plandlg").open) planVoet();
  melding("Punt "+staat.punten.length+" bewaard"+(wachtendePlek?(" in "+(wachtendePlek.lokaal||"deze plek")):""));
  if(!staat.weerdata) haalWeer(true);
  return true;
}
document.getElementById("bewaar").onclick=()=>bewaarPunt();

["weer","bezetting"].forEach(k=>{
  const el=document.getElementById(k);
  el.value=staat[k]||"";
  el.oninput=()=>{staat[k]=el.value;bewaarStaat();};
});


/* ---- weer: automatisch op basis van locatie + tijdstip ---- */
function weerOmschrijving(bew, neerslag){
  const lucht = bew < 20 ? "onbewolkt" : bew < 60 ? "halfbewolkt" : "bewolkt";
  return (neerslag > 0 ? "neerslag, " : "droog, ") + lucht;
}
async function haalWeer(stil){
  const k = document.getElementById("weerknop");
  const info = document.getElementById("weerinfo");
  k.classList.add("bezig");
  try{
    if(!staat.coords){
      const pos = await new Promise((res,rej)=>{
        if(!navigator.geolocation) return rej(new Error("geen locatiedienst"));
        navigator.geolocation.getCurrentPosition(res,rej,{timeout:9000,maximumAge:900000});
      });
      staat.coords={lat:+pos.coords.latitude.toFixed(4), lon:+pos.coords.longitude.toFixed(4)};
      bewaarStaat();
    }
    const {lat,lon}=staat.coords;
    const u="https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+
      "&current=temperature_2m,precipitation,wind_speed_10m,cloud_cover"+
      "&daily=temperature_2m_min,temperature_2m_max,precipitation_sum,wind_speed_10m_max"+
      "&forecast_days=1&timezone=Europe%2FBrussels";
    const d = await (await fetch(u)).json();
    const c=d.current, g=d.daily;
    staat.weerdata={
      moment:{tijd:c.time, temp:c.temperature_2m, neerslag:c.precipitation,
              wind:c.wind_speed_10m, bewolking:c.cloud_cover},
      dag:{min:g.temperature_2m_min[0], max:g.temperature_2m_max[0],
           neerslag:g.precipitation_sum[0], windmax:g.wind_speed_10m_max[0]},
      coords:staat.coords, opgehaald:new Date().toISOString()
    };
    const veld=document.getElementById("weer");
    const tekst=weerOmschrijving(c.cloud_cover,c.precipitation)+", "+Math.round(c.temperature_2m)+"°C, wind "+Math.round(c.wind_speed_10m)+" km/u";
    if(!veld.value.trim()){ veld.value=tekst; staat.weer=tekst; }
    info.textContent="dag: "+g.temperature_2m_min[0]+"–"+g.temperature_2m_max[0]+"°C · neerslag "+
      g.precipitation_sum[0]+" mm · max wind "+g.wind_speed_10m_max[0]+" km/u  (open-meteo, "+lat+","+lon+")";
    bewaarStaat();
    k.classList.add("klaar"); k.textContent="✓";
  }catch(e){
    if(!stil) melding("Weer niet opgehaald: "+(e.message||"geen netwerk"));
    // bestaande gegevens laten staan; alleen melden als er nog niets is
    if(!staat.weerdata){
      document.getElementById("weerinfo").textContent="weer nog niet opgehaald — knop rechts van W: (lukt zodra er netwerk is)";
    }
  }finally{ k.classList.remove("bezig"); }
}
document.getElementById("weerknop").onclick=()=>haalWeer(false);

/* prompt() is op iOS eenregelig; voor meerregelige invoer gebruiken we een eigen dialoog. */
function vraagTekst(titel, uitleg, waarde){
  return new Promise(res=>{
    const dlg=document.getElementById("invoerdlg");
    document.getElementById("inv-titel").textContent=titel;
    document.getElementById("inv-uitleg").textContent=uitleg||"";
    const veld=document.getElementById("inv-veld");
    veld.value=waarde||"";
    const sluit=v=>{dlg.close();res(v);};
    document.getElementById("inv-ok").onclick=()=>sluit(veld.value);
    document.getElementById("inv-annuleer").onclick=()=>sluit(null);
    dlg.onclose=()=>res(null);
    dlg.showModal();
    setTimeout(()=>{veld.focus();},50);
  });
}

/* ---- plan: één tik levert de plek ----
   De pin bewaart altijd zijn coördinaat op het plan. Het lokaalnummer is een etiket dat de app
   erbij zoekt; klopt het niet, of draagt het plan geen nummers, dan verandert dat niets aan de
   bruikbaarheid van de coördinaat. Je kunt een plek ook zelf benoemen — die naam gaat het plan
   in en geldt vanaf dan voor elk volgend punt op die plek. */
let planLijst=[];        // welke plannen op dit toestel staan: [{zone, ...}]
let plan=null;           // het plan dat nu open staat
let planBeeld=null;      // het ingeladen beeld
let wachtendePlek=null;  // de plek die geldt: blijft staan tot je hem wist of verlegt
let archief=[];          // vorige vergaderdagen, om te tonen wat er nog openstaat
const pl={schaal:1,dx:0,dy:0,pin:null,wijzers:new Map(),start:null,knijp:null,nummeren:false,gekozen:null};

function zetPlan(zone,data){return new Promise(res=>{
  if(!db)return res(false);
  const t=db.transaction("plannen","readwrite");t.objectStore("plannen").put(data,zone);
  t.oncomplete=()=>res(true);t.onerror=()=>res(false);
});}
function haalPlan(zone){return new Promise(res=>{
  if(!db)return res(null);
  const q=db.transaction("plannen","readonly").objectStore("plannen").get(zone);
  q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);
});}
/* Het archief: één record per vergaderdag. Zonder dit verdwijnt de vorige vergadering zodra de
   datum omslaat, en dan valt er niets te tonen van wat er nog openstaat. Dat is precies wat een
   architect wil zien als hij een ruimte binnenkomt. */
function zetDag(datum,data){return new Promise(res=>{
  if(!db)return res(false);
  const t=db.transaction("dagen","readwrite");t.objectStore("dagen").put(data,datum);
  t.oncomplete=()=>res(true);t.onerror=()=>res(false);
});}
function haalDagen(){return new Promise(res=>{
  if(!db)return res([]);
  const st=db.transaction("dagen","readonly").objectStore("dagen");
  const q=st.getAll();
  q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([]);
});}

function planZones(){return new Promise(res=>{
  if(!db)return res([]);
  const q=db.transaction("plannen","readonly").objectStore("plannen").getAllKeys();
  q.onsuccess=()=>res(Array.from(q.result||[]));q.onerror=()=>res([]);
});}

function laadBeeld(src){return new Promise((res,rej)=>{
  const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;
});}

/* Welk lokaal hoort bij deze pin? Het dichtstbijzijnde label, mits het niet absurd ver ligt —
   anders liever niets dan een verkeerd lokaal in een verslag. */
function lokaalBij(x,y){
  if(!plan||!plan.lokalen||!plan.lokalen.length)return null;
  const verh=plan.hoogte/plan.breedte;   // procenten zijn per as; y terugschalen voor echte afstand
  let best=null,bd=1e9;
  for(const l of plan.lokalen){
    const dx=l.x-x, dy=(l.y-y)*verh;
    const d=Math.hypot(dx,dy);
    if(d<bd){bd=d;best=l;}
  }
  return bd<=14?best:null;
}

/* ---- zelf nummeren ----
   Het plan komt binnen met een voorstel: nummers die het voorbereidingsscript herkend heeft, of
   rastervakken als er niets te herkennen viel. Klopt dat niet, of ontbreekt er een lokaal, dan
   tik je ze er hier zelf bij — oplopend, zonder tussenvraag, want dat is het enige tempo dat op
   een werf haalbaar is. Het nummer mag je daarna aanpassen met Benoem.

   Standaardvorm: niveau_lokaal_index, bijvoorbeeld N3_01_1. */
function volgendNummer(){
  const patroon=new RegExp("^"+plan.zone+"_(\\d+)_(\\d+)$");
  let hoogste=0;
  (plan.lokalen||[]).forEach(l=>{
    const m=patroon.exec(l.nr);
    if(m) hoogste=Math.max(hoogste, +m[1]);
  });
  return plan.zone+"_"+String(hoogste+1).padStart(2,"0")+"_1";
}

async function nummerHier(x,y){
  const nieuw={nr:volgendNummer(), naam:"", x:+x.toFixed(2), y:+y.toFixed(2)};
  plan.lokalen=(plan.lokalen||[]).concat([nieuw]);
  await zetPlan(plan.zone,plan);
  pl.pin={x,y,lokaal:nieuw};
  planTeken(); planVoet();
  melding(nieuw.nr+" toegevoegd — Benoem past het aan");
}

/* De punten die op dit plan thuishoren, in de volgorde waarin ze genoteerd zijn — dezelfde
   nummering als plan_verslag.py op de A4-bijlage zet. */
function puntenOpDitPlan(){
  if(!plan)return [];
  return staat.punten.filter(p=>p.plek&&p.plek.zone===plan.zone);
}

/* Wat er van vorige vergaderingen op dit plan staat. Alleen wat nog openstaat is interessant:
   afgehandelde punten hoeven de kaart niet vol te zetten, maar blijven wel opvraagbaar. */
/* Hoelang staat dit al open? Gerekend in hele dagen tussen de vaststelling en vandaag. */
function dagenOpen(p){
  const a=Date.parse(p.datum+"T00:00:00"), b=Date.parse(staat.datum+"T00:00:00");
  if(isNaN(a)||isNaN(b))return 0;
  return Math.max(0,Math.round((b-a)/86400000));
}

/* De kleurtrap voor ouderdom. Drie banden, niet meer: een week, een maand, langer. Fijner
   verdelen zou schijnnauwkeurigheid geven — je leest een kaart met een oogopslag, niet met een
   meetlat. Kleur is hier de eerste indruk; het getal in de cirkel is de eigenlijke informatie,
   want kleur alleen leest niet in fel zonlicht en niet voor wie kleurenblind is. */
const OUDERDOM=[
  {tot:7,   rand:"#c98a10", tekst:"#8a5c05"},   // deze week nog
  {tot:30,  rand:"#d97406", tekst:"#a2560a"},   // loopt op
  {tot:1e9, rand:"#a8341c", tekst:"#7d2413"}    // ouder dan een maand
];
function ouderdomskleur(dagen){
  return OUDERDOM.find(o=>dagen<=o.tot)||OUDERDOM[OUDERDOM.length-1];
}

function oudePuntenOpDitPlan(){
  if(!plan)return [];
  const uit=[];
  archief.forEach(dag=>{
    (dag.punten||[]).forEach(p=>{
      if(p.plek&&p.plek.zone===plan.zone&&p.status!=="klaar")
        uit.push({...p,datum:dag.datum});
    });
  });
  return uit;
}

function planTeken(){
  const c=document.getElementById("plancanvas");
  const dpr=Math.min(devicePixelRatio||1,2);
  const b=c.getBoundingClientRect();
  if(c.width!==Math.round(b.width*dpr)||c.height!==Math.round(b.height*dpr)){
    c.width=Math.round(b.width*dpr);c.height=Math.round(b.height*dpr);
  }
  const x=c.getContext("2d");
  x.setTransform(dpr,0,0,dpr,0,0);
  x.fillStyle="#111";x.fillRect(0,0,b.width,b.height);
  if(!planBeeld)return;
  x.imageSmoothingQuality="high";
  x.drawImage(planBeeld,pl.dx,pl.dy,plan.breedte*pl.schaal,plan.hoogte*pl.schaal);
  if(pl.nummeren&&plan.lokalen){
    x.fillStyle="rgba(217,116,6,.85)";
    plan.lokalen.forEach(l=>{
      const lx=pl.dx+l.x/100*plan.breedte*pl.schaal, ly=pl.dy+l.y/100*plan.hoogte*pl.schaal;
      x.beginPath();x.arc(lx,ly,4,0,7);x.fill();
    });
  }

  /* De punten van vandaag, op de kaart waar ze horen. Dit maakt van het plan een overzicht in
     plaats van een invoerveld: je ziet in één blik waar je geweest bent en waar niets staat.
     Genummerd zoals in de verslagbijlage, zodat het plan op je scherm en het blad in het dossier
     hetzelfde zeggen. */
  /* Eerst wat er nog openstaat van vorige keren, onder de punten van vandaag. Hol en amber:
     zichtbaar genoeg om op te vallen, rustig genoeg om niet met vandaag te verwarren. */
  oudePuntenOpDitPlan().forEach(p=>{
    const gx=pl.dx+p.plek.x/100*plan.breedte*pl.schaal;
    const gy=pl.dy+p.plek.y/100*plan.hoogte*pl.schaal;
    const gekozen=pl.gekozen===p.id;
    const d=dagenOpen(p), kl=ouderdomskleur(d);
    // hoe ouder, hoe zwaarder de rand: ook zonder kleur te zien valt het verschil op
    const straal=gekozen?13:10, dikte=(d>30?3.5:d>7?2.8:2.2)*(gekozen?1.3:1);
    x.beginPath();x.arc(gx,gy,straal,0,7);
    x.fillStyle="rgba(255,255,255,.94)";x.fill();
    x.lineWidth=dikte;x.strokeStyle=kl.rand;x.stroke();
    x.fillStyle=kl.tekst;
    x.textAlign="center";x.textBaseline="middle";
    // het aantal dagen als de cirkel het draagt, anders een uitroepteken
    const label=d>99?"99+":String(d);
    if(straal>=10&&label.length<=3){
      x.font="600 "+(label.length>2?9:11)+"px ui-monospace,Menlo,monospace";
      x.fillText(label,gx,gy+0.5);
    }else{
      x.font="600 11px ui-monospace,Menlo,monospace";
      x.fillText("!",gx,gy+0.5);
    }
  });
  x.textAlign="start";x.textBaseline="alphabetic";

  const mijne=puntenOpDitPlan();
  mijne.forEach((p,i)=>{
    const gx=pl.dx+p.plek.x/100*plan.breedte*pl.schaal;
    const gy=pl.dy+p.plek.y/100*plan.hoogte*pl.schaal;
    const gekozen=pl.gekozen===p.id;
    x.beginPath();x.arc(gx,gy,gekozen?12:9,0,7);
    x.fillStyle=gekozen?"#1b4f8a":"rgba(27,79,138,.86)";
    x.fill();
    x.lineWidth=2;x.strokeStyle="#fff";x.stroke();
    x.fillStyle="#fff";
    x.font="600 "+(gekozen?13:11)+"px ui-monospace,Menlo,monospace";
    x.textAlign="center";x.textBaseline="middle";
    x.fillText(String(i+1),gx,gy+0.5);
  });
  x.textAlign="start";x.textBaseline="alphabetic";

  if(!pl.pin)return;
  const px=pl.dx+pl.pin.x/100*plan.breedte*pl.schaal;
  const py=pl.dy+pl.pin.y/100*plan.hoogte*pl.schaal;
  x.lineWidth=2.5;x.strokeStyle="#fff";x.fillStyle="#d92b06";
  x.beginPath();x.arc(px,py,11,0,7);x.fill();x.stroke();
  x.beginPath();x.arc(px,py,3,0,7);x.fillStyle="#fff";x.fill();
}

function planPasIn(){
  const c=document.getElementById("plancanvas");
  const b=c.getBoundingClientRect();
  if(!plan||!b.width)return;
  pl.schaal=Math.min(b.width/plan.breedte,b.height/plan.hoogte);
  pl.dx=(b.width-plan.breedte*pl.schaal)/2;
  pl.dy=(b.height-plan.hoogte*pl.schaal)/2;
}

/* Zoomt naar een plek toe. `factor` bepaalt hoe strak: strak voor een punt waar je mee bezig
   bent, ruimer voor een herinnering — een werfrondgang springt van hak op tak, dus de vorige
   plek is géén voorspelling van de volgende. Te strak inzoomen op een gok kost een uitzoombeweging
   in plaats van er een te sparen. */
function planNaarPlek(x,y,factor){
  const c=document.getElementById("plancanvas");
  const b=c.getBoundingClientRect();
  if(!plan||!b.width)return;
  pl.schaal=Math.min(b.width/plan.breedte,b.height/plan.hoogte)*factor;
  pl.dx=b.width/2-x/100*plan.breedte*pl.schaal;
  pl.dy=b.height/2-y/100*plan.hoogte*pl.schaal;
}
function planNaarPin(){ if(pl.pin) planNaarPlek(pl.pin.x,pl.pin.y,4); }

/* Springen naar een lokaal. Op een werf die van verdieping naar verdieping springt is dit de
   enige navigatie die altijd werkt: niet pannen tot je het vindt, maar zeggen waar je bent. */
function toonLokalenlijst(){
  if(!plan||!(plan.lokalen||[]).length){melding("Dit plan heeft geen lokalen");return;}
  const dlg=document.getElementById("dlg");
  document.getElementById("dlg-titel").textContent="Naar welk lokaal?";
  const body=document.getElementById("dlg-body");
  body.innerHTML="";
  const zoek=document.createElement("input");
  zoek.type="search";zoek.placeholder="filter op nummer of naam";
  zoek.style.cssText="width:100%;padding:10px;font-size:16px;border:1px solid var(--line);"+
    "border-radius:8px;margin-bottom:10px;background:var(--surface);color:var(--ink)";
  body.appendChild(zoek);
  const lijst=document.createElement("div");
  lijst.style.cssText="display:flex;flex-wrap:wrap;gap:6px";
  body.appendChild(lijst);
  const teken=filter=>{
    lijst.innerHTML="";
    (plan.lokalen||[])
      .filter(l=>!filter||(l.nr+" "+(l.naam||"")).toLowerCase().includes(filter))
      .forEach(l=>{
        const b=document.createElement("button");
        b.type="button";b.style.cssText="font:13px ui-monospace,Menlo,monospace;padding:9px 11px";
        b.textContent=l.nr;
        b.title=l.naam||"";
        b.onclick=()=>{
          dlg.close();
          planNaarPlek(l.x,l.y,4);
          planTeken();
          melding("Naar "+l.nr+(l.naam?" — "+l.naam:""));
        };
        lijst.appendChild(b);
      });
    if(!lijst.children.length)lijst.innerHTML='<span class="aw-leeg">niets gevonden</span>';
  };
  teken("");
  zoek.oninput=()=>teken(zoek.value.trim().toLowerCase());
  document.getElementById("dlg-kopieer").style.display="none";
  dlg.showModal();
}

/* De dichtstbijzijnde lokalen rond een punt. Zit de gok ernaast, dan staat de juiste ruimte
   bijna altijd hiertussen — één tik, geen zoektocht. De app schat, jij beslist, en fout zijn
   kost één tik; daarom mag ze schatten. */
function burenBij(x,y,hoeveel){
  if(!plan||!plan.lokalen)return [];
  const verh=plan.hoogte/plan.breedte;
  return plan.lokalen
    .map(l=>({l,d:Math.hypot(l.x-x,(l.y-y)*verh)}))
    .sort((a,b)=>a.d-b.d).slice(0,hoeveel).map(o=>o.l);
}

function tekenBuren(){
  const box=document.getElementById("pl-buren");
  box.innerHTML="";
  if(!plan||!pl.pin||pl.nummeren)return;
  const buren=burenBij(pl.pin.x,pl.pin.y,5);
  if(buren.length<2)return;
  buren.forEach(l=>{
    const b=document.createElement("button");
    b.type="button";b.textContent=l.nr;b.title=l.naam||"";
    if(pl.pin.lokaal&&pl.pin.lokaal.nr===l.nr&&Math.abs(pl.pin.lokaal.x-l.x)<0.01)b.className="actief";
    b.onclick=()=>{pl.pin.lokaal=l;planTeken();planVoet();};
    box.appendChild(b);
  });
}

/* Welk bestaand punt ligt onder deze tik? In schermpixels gemeten, want een vingertop is
   even groot ongeacht hoe ver je ingezoomd bent. */
function puntGeraakt(sx,sy){
  if(!plan)return null;
  let best=null,bd=22;
  puntenOpDitPlan().concat(oudePuntenOpDitPlan()).forEach(p=>{
    const gx=pl.dx+p.plek.x/100*plan.breedte*pl.schaal;
    const gy=pl.dy+p.plek.y/100*plan.hoogte*pl.schaal;
    const d=Math.hypot(gx-sx,gy-sy);
    if(d<bd){bd=d;best=p;}
  });
  return best;
}

function veilig(t){return String(t).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));}
function datumKort(d){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||"");
  return m?(+m[3]+"/"+ +m[2]):(d||"vorige keer");
}

/* Een punt van vorige keer afvinken. Het verdwijnt van de kaart maar niet uit het archief:
   dat je het opgelost hebt en wanneer, is zelf een vaststelling. */
async function merkAfgehandeld(oud){
  const dag=archief.find(d=>d.datum===oud.datum);
  if(!dag)return;
  const p=(dag.punten||[]).find(x=>x.id===oud.id);
  if(!p)return;
  p.status="klaar";
  p.afgehandeld=staat.datum;
  await zetDag(dag.datum,dag);
  pl.gekozen=null;
  planTeken();planVoet();
  melding("Afgevinkt — stond open sinds "+datumKort(oud.datum));
}

function planVoet(){
  const voet=document.getElementById("pl-voet");
  const el=document.getElementById("pl-lokaal");
  voet.hidden=!plan;
  document.getElementById("pl-invoer").hidden=!(plan&&pl.pin&&!pl.nummeren);
  tekenBuren();
  if(!plan)return;
  if(pl.gekozen){
    const p=staat.punten.find(x=>x.id===pl.gekozen);
    const oud=p?null:oudePuntenOpDitPlan().find(x=>x.id===pl.gekozen);
    if(p||oud){
      document.getElementById("pl-invoer").hidden=true;
      const box=document.getElementById("pl-buren"); box.innerHTML="";
      const t=document.getElementById("pl-teller");
      if(p){
        el.innerHTML="<b>punt "+(puntenOpDitPlan().indexOf(p)+1)+" · "+(p.plek.lokaal||"")+"</b><span>"+
          veilig(p.tekst||"(geen notitie)")+" — tik naast het punt om verder te gaan</span>";
        if(t) t.textContent=p.tijd;
      }else{
        // een punt van een vorige vergadering: het enige wat je hier wil doen is zeggen of het
        // opgelost is. Dat is de reden dat het op de kaart staat.
        el.innerHTML="<b>"+datumKort(oud.datum)+" · "+(oud.plek.lokaal||"")+"</b><span>"+
          veilig(oud.tekst||"(geen notitie)")+"</span>";
        if(t) t.textContent=dagenOpen(oud)+" dagen open";
        const k=document.createElement("button");
        k.type="button";k.className="actief";k.textContent="✓ opgelost";
        k.onclick=()=>merkAfgehandeld(oud);
        box.appendChild(k);
        const n=document.createElement("button");
        n.type="button";n.textContent="blijft open";
        n.onclick=()=>{pl.gekozen=null;planTeken();planVoet();};
        box.appendChild(n);
      }
      return;
    }
    pl.gekozen=null;
  }
  const teller=document.getElementById("pl-teller");
  if(teller) teller.textContent=staat.punten.length+" punt"+(staat.punten.length===1?"":"en");
  if(pl.nummeren&&!pl.pin){
    el.innerHTML="<b>nummeren</b><span>tik elk lokaal aan; ze lopen vanzelf op ("+
      ((plan.lokalen||[]).length)+" op dit plan)</span>";
    return;
  }
  if(!pl.pin){
    el.innerHTML="<b>—</b><span>tik waar je staat, of hier voor de lokalenlijst</span>";
    return;
  }
  const l=pl.pin.lokaal;
  el.innerHTML="<b>"+(l?l.nr:plan.zone)+"</b><span>"+
    (l?(l.naam||"lokaal "+l.nr):"geen lokaal in de buurt — coördinaat "+
       Math.round(pl.pin.x)+","+Math.round(pl.pin.y))+"</span>";
}

async function toonPlan(zone){
  const data=await haalPlan(zone);
  document.getElementById("pl-leeg").hidden=!!data;
  if(!data){plan=null;planBeeld=null;planTeken();planVoet();return;}
  plan=data;
  try{planBeeld=await laadBeeld(plan.beeld);}catch(e){planBeeld=null;melding("Plan kon niet geladen worden");}
  pl.pin=wachtendePlek&&wachtendePlek.zone===plan.zone
    ?{x:wachtendePlek.x,y:wachtendePlek.y,lokaal:wachtendePlek.lokaal?{nr:wachtendePlek.lokaal,naam:wachtendePlek.naam||""}:null}
    :null;
  // Waar je was is de beste gok voor waar je bent: op een werf loop je van ruimte naar ruimte,
  // niet kriskras. Het plan opent daarom ingezoomd op je vorige punt in plaats van uitgezoomd op
  // het hele blad — schelen twee knijpbewegingen per punt.
  if(pl.pin)planNaarPin();
  else if(plan.laatst) planNaarPlek(plan.laatst.x,plan.laatst.y,2);
  else planPasIn();
  try{document.getElementById("pl-voet").classList.toggle("klein",
      localStorage.getItem(VOUWSLEUTEL)==="1");
      document.getElementById("pl-vouw").textContent=
        localStorage.getItem(VOUWSLEUTEL)==="1"?"▴":"▾";}catch(e){}
  planTeken();planVoet();
}

async function openPlan(gevraagd){
  const dlg=document.getElementById("plandlg");
  if(!dlg.open)dlg.showModal();
  planLijst=await planZones();
  // het gevraagde plan, anders dat van de huidige zone, anders het enige dat er is
  const zone=(gevraagd&&planLijst.includes(gevraagd))?gevraagd
            :planLijst.includes(staat.zone)?staat.zone:(planLijst[0]||staat.zone);
  await toonPlan(zone);
  document.getElementById("pl-plan").textContent=planLijst.length>1?("Plan: "+zone):"Plan";
}

/* Bij het openen van de app: welk niveau? En dan meteen de kaart.
   Dat is de volgorde waarin een rondgang begint — je staat ergens, je zegt waar, en je werkt
   verder op de kaart. De lijst is er voor achteraf, niet om mee te beginnen. */
function vraagNiveau(){
  if(!planLijst.length)return;
  const dlg=document.getElementById("dlg");
  document.getElementById("dlg-titel").textContent="Op welk niveau sta je?";
  const body=document.getElementById("dlg-body");
  body.innerHTML="";
  const rij=document.createElement("div");
  rij.style.cssText="display:flex;flex-wrap:wrap;gap:8px";
  planLijst.forEach(z=>{
    const b=document.createElement("button");
    b.type="button";
    b.style.cssText="font-size:17px;font-weight:650;padding:16px 22px;background:var(--zone-soft);"+
      "color:var(--zone);border-color:var(--zone-soft)";
    b.textContent=z;
    b.onclick=async()=>{
      dlg.close();
      if(ZONES.includes(z)){staat.zone=z;bewaarStaat();tekenZones();}
      await openPlan(z);
    };
    rij.appendChild(b);
  });
  body.appendChild(rij);
  const uitleg=document.createElement("p");
  uitleg.className="inv-uitleg";
  uitleg.style.marginTop="12px";
  uitleg.textContent="Of sluit dit om zonder plan te werken — de zonebalk blijft gewoon staan.";
  body.appendChild(uitleg);
  document.getElementById("dlg-kopieer").style.display="none";
  dlg.showModal();
}

/* Pannen met één vinger, zoomen met twee. Een tik zonder verschuiving zet de pin. */
function planBedrading(){
  const c=document.getElementById("plancanvas");
  const punt=e=>{const b=c.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top};};

  c.addEventListener("pointerdown",e=>{
    if(!plan)return;
    try{c.setPointerCapture(e.pointerId);}catch(err){}
    pl.wijzers.set(e.pointerId,punt(e));
    if(pl.wijzers.size===1){
      pl.start={...punt(e),tijd:Date.now(),bewogen:0};
    }else if(pl.wijzers.size===2){
      const [a,b]=[...pl.wijzers.values()];
      pl.knijp={afstand:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2};
      pl.start=null;   // knijpen is geen tik meer
    }
  });

  c.addEventListener("pointermove",e=>{
    if(!plan||!pl.wijzers.has(e.pointerId))return;
    const vorig=pl.wijzers.get(e.pointerId), nu=punt(e);
    pl.wijzers.set(e.pointerId,nu);
    if(pl.wijzers.size===1){
      pl.dx+=nu.x-vorig.x; pl.dy+=nu.y-vorig.y;
      if(pl.start)pl.start.bewogen+=Math.hypot(nu.x-vorig.x,nu.y-vorig.y);
      planTeken();
    }else if(pl.wijzers.size===2&&pl.knijp){
      const [a,b]=[...pl.wijzers.values()];
      const af=Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      const f=af/(pl.knijp.afstand||af);
      const nieuw=Math.max(0.05,Math.min(40,pl.schaal*f));
      const echt=nieuw/pl.schaal;
      // zoom om het midden tussen de vingers, en volg dat midden als het verschuift
      pl.dx=mx-(pl.knijp.mx-pl.dx)*echt+(mx-pl.knijp.mx)*0;
      pl.dy=my-(pl.knijp.my-pl.dy)*echt;
      pl.schaal=nieuw;
      pl.knijp={afstand:af,mx,my};
      planTeken();
    }
  });

  const los=e=>{
    if(!plan)return;
    pl.wijzers.delete(e.pointerId);
    if(pl.wijzers.size<2)pl.knijp=null;
    if(pl.wijzers.size===0&&pl.start&&pl.start.bewogen<8&&Date.now()-pl.start.tijd<400){
      const x=(pl.start.x-pl.dx)/(plan.breedte*pl.schaal)*100;
      const y=(pl.start.y-pl.dy)/(plan.hoogte*pl.schaal)*100;
      if(x>=0&&x<=100&&y>=0&&y<=100){
        if(pl.nummeren){ nummerHier(x,y); }
        else{
          // Tik je op een punt dat er al staat, dan wil je dát bekijken, geen nieuw punt ernaast.
          const raak=puntGeraakt(pl.start.x,pl.start.y);
          if(raak){ pl.gekozen=raak.id; planTeken(); planVoet(); }
          else{
            pl.gekozen=null;
            pl.pin={x,y,lokaal:lokaalBij(x,y)};
            planTeken();planVoet();
          }
        }
      }
    }
    pl.start=null;
  };
  c.addEventListener("pointerup",los);
  c.addEventListener("pointercancel",los);

  c.addEventListener("wheel",e=>{           // op de Mac: zoomen met het scrollwiel
    if(!plan)return;
    e.preventDefault();
    const b=c.getBoundingClientRect(), mx=e.clientX-b.left, my=e.clientY-b.top;
    const f=Math.exp(-e.deltaY*0.0022);
    const nieuw=Math.max(0.05,Math.min(40,pl.schaal*f)), echt=nieuw/pl.schaal;
    pl.dx=mx-(mx-pl.dx)*echt; pl.dy=my-(my-pl.dy)*echt; pl.schaal=nieuw;
    planTeken();
  },{passive:false});

  addEventListener("resize",()=>{if(document.getElementById("plandlg").open)planTeken();});
}

/* Zoomen met knoppen in plaats van alleen met de vingers: op een grote iPad knijp je niet
   comfortabel met één hand, en een knop kent geen vertraging — bij dubbeltikken zou elke pin
   moeten wachten of er een tweede tik komt. */
function zoomStap(factor){
  const c=document.getElementById("plancanvas");
  const b=c.getBoundingClientRect();
  if(!plan||!b.width)return;
  const mx=b.width/2,my=b.height/2;

  pl.dx=mx-(mx-pl.dx)*echt; pl.dy=my-(my-pl.dy)*echt; pl.schaal=nieuw;
  planTeken();
}

document.getElementById("pl-benoem").onclick=async()=>{
  if(!plan||!pl.pin){melding("Zet eerst een pin");return;}
  const l=pl.pin.lokaal;
  const antwoord=await vraagTekst("Plek benoemen",
    "Eén regel: nummer en naam, bijvoorbeeld “1.02 vergaderzaal”.\n"+
    "Leeg laten koppelt het lokaal los van dit punt; een streepje (-) haalt het uit het plan.\n"+
    "De naam blijft bewaard en geldt vanaf nu voor elk punt op deze plek.",
    l?(l.nr+" "+(l.naam||"")).trim():"");
  if(antwoord===null)return;
  const tekst=antwoord.trim();

  // hetzelfde lokaal terugvinden in het plan: nummer én plaats moeten kloppen
  const zelfde=o=>l&&o.nr===l.nr&&Math.abs(o.x-l.x)<0.01&&Math.abs(o.y-l.y)<0.01;

  if(!tekst){
    // leeg = het foute lokaal loskoppelen van dit punt; het plan blijft ongemoeid
    pl.pin.lokaal=null;planTeken();planVoet();return;
  }
  if(tekst==="-"){
    if(l){plan.lokalen=(plan.lokalen||[]).filter(o=>!zelfde(o));await zetPlan(plan.zone,plan);}
    pl.pin.lokaal=null;planTeken();planVoet();
    melding(l?(l.nr+" uit het plan gehaald"):"Er stond hier geen lokaal");
    return;
  }
  const m=tekst.match(/^(\S+)\s*(.*)$/);
  const nieuw={nr:m[1],naam:(m[2]||"").trim(),x:pl.pin.x,y:pl.pin.y};
  // Alleen verplaatsen wat je écht bijwerkt. Zet je hier een ánder nummer, dan hoort dat lokaal
  // gewoon bij dit punt en blijft het oude staan waar het stond — anders wist je met een
  // correctie een lokaal uit dat verderop misschien perfect klopt.
  plan.lokalen=(plan.lokalen||[]).filter(o=>!(zelfde(o)&&o.nr===nieuw.nr));
  // stond dit nummer al ergens anders? Dan is er nu een dubbel, en dat hoor je te weten:
  // één van de twee is fout, en welke kun jij zien en de app niet.
  const elders=plan.lokalen.some(o=>o.nr===nieuw.nr);
  plan.lokalen.push(nieuw);
  pl.pin.lokaal=nieuw;
  await zetPlan(plan.zone,plan);
  planTeken();planVoet();
  melding(elders ? (nieuw.nr+" stond al elders — nu twee keer; haal er één weg met “-”")
        : l&&l.nr!==nieuw.nr ? (nieuw.nr+" toegevoegd; "+l.nr+" bleef staan")
        : "Plek bewaard in het plan");
};

/* ---- tekenen: aanduiden op een foto, of een losse schets ----
   Alles gebeurt op een canvas in de app zelf; er is geen netwerk voor nodig. */
const KLEUREN=["#e02020","#f5a623","#1f7ae0","#111111"];
let tk={canvas:null,ctx:null,lijnen:[],kleur:KLEUREN[0],basis:null,doel:null,schaal:1,naam:"schets"};

function tkHerteken(){
  const c=tk.canvas,x=tk.ctx;
  x.clearRect(0,0,c.width,c.height);
  if(tk.basis) x.drawImage(tk.basis,0,0,c.width,c.height);
  else{ x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); }
  x.lineCap="round";x.lineJoin="round";
  tk.lijnen.forEach(l=>{
    x.strokeStyle=l.kleur; x.lineWidth=l.dikte;
    x.beginPath();
    l.punten.forEach((pt,i)=> i? x.lineTo(pt.x,pt.y) : x.moveTo(pt.x,pt.y));
    if(l.punten.length===1) x.lineTo(l.punten[0].x+0.1,l.punten[0].y+0.1);
    x.stroke();
  });
}

function tkKleuren(){
  const box=document.getElementById("tk-kleuren");box.innerHTML="";
  KLEUREN.forEach(k=>{
    const b=document.createElement("button");b.type="button";b.className="tk-kleur"+(k===tk.kleur?" actief":"");
    b.style.background=k;b.setAttribute("aria-label","kleur "+k);
    b.onclick=()=>{tk.kleur=k;tkKleuren();};
    box.appendChild(b);
  });
}

async function openTekenscherm(bron, doel){
  const dlg=document.getElementById("tekendlg");
  tk.canvas=document.getElementById("tekencanvas");
  tk.ctx=tk.canvas.getContext("2d");
  tk.lijnen=[];tk.doel=doel;tk.basis=null;
  if(bron){
    const img=new Image();
    await new Promise(res=>{img.onload=res;img.onerror=res;img.src=URL.createObjectURL(bron);});
    tk.basis=img;
    tk.canvas.width=img.width||1200; tk.canvas.height=img.height||1600;
  }else{
    tk.canvas.width=1200; tk.canvas.height=1600;
  }
  tkKleuren(); tkHerteken();
  dlg.showModal();

  const dikte=Math.max(4, Math.round(tk.canvas.width/220));
  let bezig=false, huidige=null;
  const naarCanvas=e=>{
    const r=tk.canvas.getBoundingClientRect();
    return {x:(e.clientX-r.left)*(tk.canvas.width/r.width),
            y:(e.clientY-r.top)*(tk.canvas.height/r.height)};
  };
  tk.canvas.onpointerdown=e=>{
    bezig=true; tk.canvas.setPointerCapture(e.pointerId);
    huidige={kleur:tk.kleur,dikte,punten:[naarCanvas(e)]};
    tk.lijnen.push(huidige); tkHerteken();
  };
  tk.canvas.onpointermove=e=>{ if(!bezig)return; huidige.punten.push(naarCanvas(e)); tkHerteken(); };
  const stop=()=>{bezig=false;huidige=null;};
  tk.canvas.onpointerup=stop; tk.canvas.onpointercancel=stop;
}

document.getElementById("tk-undo").onclick=()=>{tk.lijnen.pop();tkHerteken();};

/* Hoeveelste keer komt dit punt in een verslag? Elke gearchiveerde vergaderdag ná de dag waarop
   het genoteerd werd telt mee, en vandaag ook. Niet in de app bijgehouden maar geteld uit het
   archief: dan kan het niet uit de pas lopen met wat er werkelijk in de verslagen stond. */
function vermelding(p){
  const later=archief.filter(d=>d.datum>p.datum).length;
  return later+2;   // de eerste vermelding + de tussenliggende dagen + vandaag
}

function maakTekst(){
  const r=[];
  r.push("DATUM: "+staat.datum);
  if(staat.weer.trim())r.push("W: "+staat.weer.trim());
  if(staat.bezetting.trim())r.push("BZ: "+staat.bezetting.trim());
  const aw=(staat.aanwezig||[]).map(code=>{
    const c=contacten.find(x=>x.code===code); return c?(c.naam+" ("+c.code+")"):code;
  });
  if(aw.length) r.push("AW: "+aw.join(", "));
  if(staat.weerdata){const w=staat.weerdata.dag;
    r.push("WD: "+w.min+"-"+w.max+" C, neerslag "+w.neerslag+" mm, max wind "+w.windmax+" km/u (open-meteo)");}
  let vorige=null;
  staat.punten.forEach(p=>{
    if(p.zone!==vorige){r.push("-");r.push(p.zone);vorige=p.zone;}
    const merk = p.foto ? ((p.bijlage && !p.bijlage.beeld) ? "D " : "F ") : "";
    // @-marker: het lokaal als het bekend is, anders de coördinaat op het plan. De coördinaat
    // staat er altijd bij, zodat het verwerkingsscript de punten terug op het plan kan tekenen.
    const plek = p.plek ? "@"+(p.plek.lokaal?p.plek.lokaal+" ":"")+p.plek.x+","+p.plek.y+" " : "";
    let l=merk+plek+(p.spreker?p.spreker+": ":"")+(p.tekst||"[nog geen notitie — "+p.tijd+"]");
    if(p.bijlage && !p.bijlage.beeld) l+=" ["+p.bijlage.naam+"]";
    r.push(l);
  });

  /* Wat er van vorige keren nog openstaat, hoort in dit verslag herhaald te worden. Wie een
     vaststelling één keer noteert en daarna zwijgt, verliest ze: de aannemer kan aanvoeren dat
     ze opgelost was of nooit meer ter sprake kwam. Een herhaling met de datum erbij is het
     tegendeel — ze toont hoelang iets al loopt. */
  const open=[];
  archief.forEach(dag=>{
    (dag.punten||[]).forEach(p=>{
      if(p.status!=="klaar") open.push({...p,datum:dag.datum});
    });
  });
  if(open.length){
    open.sort((a,b)=>(a.datum+a.zone).localeCompare(b.datum+b.zone));
    r.push("-");
    r.push("OPEN");
    open.forEach(p=>{
      const plek = p.plek ? "@"+(p.plek.lokaal?p.plek.lokaal+" ":"")+p.plek.x+","+p.plek.y+" " : "";
      r.push("H "+plek+(p.tekst||"[geen notitie]")+
             " SINDS "+p.datum+" x"+vermelding(p)+(p.zone?" ["+p.zone+"]":""));
    });
  }
  return r.join("\n");
}

async function kopieer(t){
  try{await navigator.clipboard.writeText(t);return true}
  catch(e){
    const ta=document.createElement("textarea");ta.value=t;
    ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);
    ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(_){}
    document.body.removeChild(ta);return ok;
  }
}

const dlg=document.getElementById("dlg");
document.getElementById("dlg-sluit").onclick=()=>dlg.close();

document.getElementById("kopieer").onclick=async()=>{
  const t=maakTekst();
  if(!t){melding("Nog niets te kopiëren");return}
  const ok=await kopieer(t);
  document.getElementById("dlg-titel").textContent="Verslagtekst";
  document.getElementById("dlg-body").innerHTML="<pre></pre>";
  document.getElementById("dlg-body").querySelector("pre").textContent=t;
  document.getElementById("dlg-kopieer").style.display="";
  document.getElementById("dlg-kopieer").onclick=async()=>{
    melding(await kopieer(t)?"Gekopieerd":"Selecteer en kopieer handmatig");
  };
  dlg.showModal();
  if(ok)melding("Gekopieerd — plak in Apple Notes");
};

document.getElementById("fotos").onclick=async()=>{
  const metFoto=staat.punten.filter(p=>p.foto);
  document.getElementById("dlg-titel").textContent=metFoto.length+" foto's en documenten";
  const b=document.getElementById("dlg-body");b.innerHTML="";
  if(!metFoto.length){b.innerHTML='<p style="margin:0;color:var(--ink-soft)">Nog geen foto\'s.</p>';}
  for(let i=0;i<metFoto.length;i++){
    const p=metFoto[i];const blob=await haalFoto(p.id);
    const cap=document.createElement("p");
    cap.style.cssText="margin:0 0 4px;font:12px ui-monospace,Menlo,monospace;color:var(--ink-soft)";
    cap.textContent=String(i+1).padStart(2,"0")+" · "+p.zone+" · "+p.tijd+" — "+p.tekst;
    b.appendChild(cap);
    if(blob){
      if(p.bijlage && !p.bijlage.beeld){
        const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.target="_blank";
        a.textContent="📄 "+(p.bijlage.naam||"document")+" openen";
        a.style.cssText="display:block;margin-bottom:12px;color:var(--accent)";
        b.appendChild(a);
      }else{
        const im=document.createElement("img");im.src=URL.createObjectURL(blob);im.alt=p.tekst||"";b.appendChild(im);
      }
    }
  }
  document.getElementById("dlg-kopieer").style.display="none";
  dlg.showModal();
};

/* UI eerst tekenen, opslag daarna — zo werkt de app ook als IndexedDB geweigerd wordt */
laadStaat();
document.getElementById("weer").value=staat.weer||"";
document.getElementById("bezetting").value=staat.bezetting||"";
laadContacten();
tekenContacten();
tekenSprekers();
tekenZones();
tekenLijst();
document.getElementById("versie").textContent=VERSIE;
if(staat.weerdata){
  const w=staat.weerdata.dag;
  document.getElementById("weerinfo").textContent="dag: "+w.min+"–"+w.max+"°C · neerslag "+w.neerslag+" mm · max wind "+w.windmax+" km/u";
  document.getElementById("weerknop").classList.add("klaar");
  document.getElementById("weerknop").textContent="✓";
}
planBedrading();
opendb().then(async d=>{
  if(!d){
    const k=document.getElementById("fotoknop");
    k.disabled=true;k.textContent="📷 n.v.t.";k.title="Fotoopslag niet beschikbaar in deze weergave";
    const p=document.getElementById("planknop");
    p.disabled=true;p.textContent="📍 n.v.t.";p.title="Planopslag niet beschikbaar in deze weergave";
  }else{
    planLijst=await planZones();
    archief=await haalDagen();
    tekenZones();          // nu pas is bekend welke zones een plan hebben
    if(vorigeDag){
      // Alleen wegschrijven als die dag er nog niet in zit: een gearchiveerde dag kan intussen
      // afvinkingen bevatten, en die mogen niet overschreven worden door de oude localStorage.
      if(!archief.some(d=>d.datum===vorigeDag.datum)){
        await zetDag(vorigeDag.datum,vorigeDag);
        archief=await haalDagen();
      }
      vorigeDag=null;
      bewaarStaat();   // de verouderde dag uit localStorage halen, anders komt hij terug
    }
  }
  tekenLijst();
  // Bij een verse dag begint een rondgang met de vraag waar je staat. Hervat je een dag waarin
  // al punten staan, dan onderbreken we niet — dan weet je zelf wel waar je gebleven was.
  // De kaart is de werkplek, niet een omweg. Was je daar gebleven, dan kom je daar terug —
  // en dan hoeft de vraag naar het niveau niet nog eens.
  if(planLijst.length){
    if(planLijst.includes(staat.zone) && staat.punten.length) setTimeout(()=>openPlan(staat.zone),300);
    else setTimeout(vraagNiveau,350);
  }
});
</script>
