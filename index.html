/* Hoeveelste keer komt dit punt in een verslag? Elke gearchiveerde vergaderdag ná de dag waarop
   het genoteerd werd telt mee, en vandaag ook. Niet in de app bijgehouden maar geteld uit het
   archief: dan kan het niet uit de pas lopen met wat er werkelijk in de verslagen stond. */
function vermelding(p){
  const later=archief.filter(d=>d.datum>p.datum).length;
  return later+2;   // de eerste vermelding + de tussenliggende dagen + vandaag
}

function maakTekst(){
  const r=[];
  r.push("DATUM: "+staat.datum);
  // Welk beroep dit verslag schrijft. Zonder deze regel neemt het verwerkingsscript de architect,
  // zodat oudere notities blijven werken.
  r.push("PROFIEL: "+profiel.sleutel);
  if(staat.weer.trim())r.push("W: "+staat.weer.trim());
  if(staat.bezetting.trim())r.push("BZ: "+staat.bezetting.trim());
  const aw=(staat.aanwezig||[]).map(code=>{
    const c=contacten.find(x=>x.code===code); return c?(c.naam+" ("+c.code+")"):code;
  });
  if(aw.length) r.push("AW: "+aw.join(", "));
  // Welke code welke rol vervult. Zonder deze regel moet het verwerkingsscript de codes van één
  // dossier hardgecodeerd kennen; mét deze regel bepaalt de app wie wat mág, en groepeert het
  // script daarop. Namen blijven in de notitie, de juridische indeling wordt expliciet.
  const rollen=contacten.filter(c=>c.rol&&(staat.aanwezig||[]).concat(
      staat.punten.map(p=>p.aan).filter(Boolean)).includes(c.code));
  if(rollen.length) r.push("ROL: "+rollen.map(c=>c.code+"="+c.rol).join(", "));
  // De namen van de gebruikte hoofdstukken erbij, zodat het verslag "#07 dak" kan schrijven en
  // niet "#07". Wie het leest moet meteen zien welk deel van zijn bestek geraakt wordt.
  const gebruikt=[...new Set(staat.punten.map(p=>p.hoofdstuk).filter(Boolean))]
    .map(nr=>hoofdstukVan(nr)).filter(Boolean);
  if(gebruikt.length) r.push("HFDST: "+gebruikt.map(h=>h.nr+"="+h.naam).join(", "));
  if(staat.weerdata){const w=staat.weerdata.dag;
    r.push("WD: "+w.min+"-"+w.max+" C, neerslag "+w.neerslag+" mm, max wind "+w.windmax+" km/u (open-meteo)");}
  let vorige=null;
  staat.punten.forEach(p=>{
    if(p.zone!==vorige){r.push("-");r.push(p.zone);vorige=p.zone;}
    const merk = p.foto ? ((p.bijlage && !p.bijlage.beeld) ? "D " : "F ") : "";
    // @-marker: het lokaal als het bekend is, anders de coördinaat op het plan. De coördinaat
    // staat er altijd bij, zodat het verwerkingsscript de punten terug op het plan kan tekenen.
    const plek = p.plek ? "@"+(p.plek.lokaal?p.plek.lokaal+" ":"")+p.plek.x+","+p.plek.y+" " : "";
    // De volgorde is die van het verwerkingsscript: markers, spreker, dan pas VERBOD, en de
    // toewijzing en deadline achteraan waar ze uit de zin gehaald worden.
    // De soort staat vooraan als merk, zoals VERBOD. "gebrek" is de gewone gang van zaken en
    // krijgt er geen; de andere twee wél, want die veranderen wie moet herstellen en waarom.
    // Het merk is de sleutel in hoofdletters. Welke er bestaan hangt van het profiel af, dus
    // er staat hier geen vaste lijst — het verwerkingsscript leest ze uit hetzelfde profiel.
    const so=SOORTEN.find(o=>o.sleutel===p.soort);
    const soortmerk = (p.urgent?"URGENT: ":"") + (so&&so.blok?so.sleutel.toUpperCase()+": ":"");
    let l=merk+plek+(p.spreker?p.spreker+": ":"")+(p.verbod?"VERBOD: ":"")+soortmerk+
      (p.tekst||"[nog geen notitie — "+p.tijd+"]");
    if(p.hoofdstuk) l+=" #"+p.hoofdstuk;
    if(p.aan) l+=" >"+p.aan;
    if(p.deadline) l+=" DL "+p.deadline;
    if(p.bijlage && !p.bijlage.beeld) l+=" ["+p.bijlage.naam+"]";
    r.push(l);
  });

  /* Wat er van vorige keren nog openstaat, hoort in dit verslag herhaald te worden. Wie een
     vaststelling één keer noteert en daarna zwijgt, verliest ze: de aannemer kan aanvoeren dat
     ze opgelost was of nooit meer ter sprake kwam. Een herhaling met de datum erbij is het
     tegendeel — ze toont hoelang iets al loopt. */
  const open=openPunten();
  if(open.length){
    r.push("-");
    r.push("OPEN");
    open.forEach(p=>{
      const plek = p.plek ? "@"+(p.plek.lokaal?p.plek.lokaal+" ":"")+p.plek.x+","+p.plek.y+" " : "";
      r.push("H "+plek+(p.tekst||"[geen notitie]")+
             " SINDS "+p.datum+" x"+vermelding(p)+(p.zone?" ["+p.zone+"]":""));
    });
  }
  return r.join("\n");
}

/* ---- het verslag ----
   Tot nu toe eindigde de app bij een exporttekst: die ging naar Apple Notes, en op de Mac maakte
   werf_verwerk.py er een verslag van. Dat is één computer te veel. De browser kan afdrukken, en
   in datzelfde venster zit "Bewaar als PDF" — op iOS de deelknop in het afdrukvoorbeeld. Er komt
   dus geen PDF-bibliotheek aan te pas: wat je krijgt is deze bladzijde zelf, met een afdrukstijl
   eroverheen.

   De indeling is die van werf_verwerk.py, tot en met de toelichting onder elke kop. Dat is geen
   nabootsing om de netheid: de indeling ís de juridische lijn — aan de aannemer wijst de architect
   aan, aan de opdrachtgever legt hij voor, en de soort gaat vóór de rol. Twee verslagen die
   hetzelfde dossier anders indelen, is één te veel.

   Eén model, drie gebruiken: dit verslag, de doorstuurlijsten per rol en per hoofdstuk, en de
   exporttekst blijft ernaast staan voor wie de Mac-route toch wil. */

function maakEl(tag,klasse,tekst){
  const e=document.createElement(tag);
  if(klasse)e.className=klasse;
  if(tekst!==undefined&&tekst!==null)e.textContent=tekst;
  return e;
}

/* Wat er van vorige vergaderingen nog openstaat. Eén plek, want zowel de exporttekst als het
   verslag als de kaart stellen dezelfde vraag. */
function openPunten(){
  const uit=[];
  archief.forEach(dag=>(dag.punten||[]).forEach(p=>{
    if(p.status!=="klaar")uit.push({...p,datum:dag.datum});
  }));
  uit.sort((a,b)=>(a.datum+(a.zone||"")).localeCompare(b.datum+(b.zone||"")));
  return uit;
}

function naamVan(code){
  const c=contacten.find(x=>x.code===code);
  return c?(c.naam+" ("+c.code+")"):code;
}

/* De soort gaat vóór de rol. Een beschadiging aan de aannemer toewijzen onder "uit te voeren
   binnen de aanneming" is precies de fout die dit onderscheid moet voorkomen: heeft een derde de
   schade veroorzaakt, dan is de aannemer niet gehouden ze binnen zijn aanneming te herstellen. */
function functieVan(p){
  const s=SOORTEN.find(o=>o.sleutel===p.soort);
  if(s&&s.blok)return {sleutel:"soort:"+s.sleutel,kop:s.blok,toelichting:s.blokuitleg||""};
  const r=p.aan?rolVan(p.aan):null;
  if(r)return {sleutel:"rol:"+r.sleutel,kop:r.kop,toelichting:r.toelichting};
  return {sleutel:"opvolging",kop:profiel.rest.kop,toelichting:profiel.rest.toelichting||""};
}

function hoofdstukTekst(nr){
  const h=hoofdstukVan(nr);
  return h?("#"+h.nr+" "+h.naam):("#"+nr);
}

/* Dezelfde tabel als ZONES in werf_verwerk.py: op een blad leest "niveau 3" beter dan "N3".
   Staat er een zone in die de app niet kent, dan blijft de code staan — verzinnen doen we niet. */
const ZONENAAM={N3:"niveau 3",N4:"niveau 4",N5:"niveau 5",DAK:"dak",KAPEL:"kapel",
  KELDER:"kelder",STELLING:"stelling",BUITEN:"buiten"};
function zoneNaam(z){return ZONENAAM[z]||z||"zonder zone";}

function plekTekst(p){
  if(p.plek&&p.plek.lokaal)return p.plek.lokaal;
  if(p.plek)return (p.zone||p.plek.zone||"")+" "+plaatsKort(p.plek);
  return p.zone||"";
}
/* Met de zone erbij. In de lijst per zone staat die al boven de kop, maar een afvinklijst die je
   doorstuurt komt straks los van dit verslag te staan — daar moet "3.15" zichzelf kunnen plaatsen. */
function plekVol(p){
  const z=zoneNaam(p.zone);
  const k=p.plek&&p.plek.lokaal?p.plek.lokaal:(p.plek?plaatsKort(p.plek):"");
  return k?(z+" · "+k):z;
}

function verslagModel(){
  const punten=staat.punten||[];
  // de foto's krijgen hun eigen doorlopende nummer: ze vormen een eigen bijlage, en die
  // verwijzing moet gelden ongeacht in welk blok een punt terechtkomt
  const fotonr=new Map();
  punten.filter(p=>p.foto).forEach((p,i)=>fotonr.set(p.id,i+1));

  const zones=[];
  punten.forEach(p=>{
    let z=zones.find(o=>o.zone===p.zone);
    if(!z){z={zone:p.zone,punten:[]};zones.push(z);}
    z.punten.push(p);
  });
  // binnen een zone lopen de nummers door zoals op het plan: scherm en blad zeggen hetzelfde
  zones.forEach(z=>z.punten.forEach((p,i)=>{p._nr=i+1;}));

  const hoofdstukken=[];
  punten.forEach(p=>{
    if(!p.hoofdstuk)return;
    let h=hoofdstukken.find(o=>o.nr===p.hoofdstuk);
    if(!h){h={nr:p.hoofdstuk,kop:hoofdstukTekst(p.hoofdstuk),punten:[]};hoofdstukken.push(h);}
    h.punten.push(p);
  });
  hoofdstukken.sort((a,b)=>String(a.nr).localeCompare(String(b.nr)));

  // De doorstuurblokken. Alleen wat aan iemand is toegewezen: een blok is een lijst die je
  // doorstuurt, en een lijst zonder geadresseerde stuur je nergens heen. Wat niet is toegewezen
  // staat gewoon onder zijn zone.
  const blokken=[];
  punten.filter(p=>p.aan).forEach(p=>{
    const f=functieVan(p);
    let b=blokken.find(o=>o.sleutel===f.sleutel);
    if(!b){b={sleutel:f.sleutel,kop:f.kop,toelichting:f.toelichting,partijen:[]};blokken.push(b);}
    let w=b.partijen.find(o=>o.code===p.aan);
    if(!w){w={code:p.aan,naam:naamVan(p.aan),punten:[]};b.partijen.push(w);}
    w.punten.push(p);
  });
  // urgent bovenaan: wie een lijst van boven naar onder afwerkt, doet dan het dringende eerst
  blokken.forEach(b=>b.partijen.forEach(w=>
    w.punten.sort((a,c)=>(a.urgent?0:1)-(c.urgent?0:1))));

  const aw=(staat.aanwezig||[]).map(naamVan);
  return {datum:staat.datum, weer:(staat.weer||"").trim(), bezetting:(staat.bezetting||"").trim(),
          weerdata:staat.weerdata||null, aanwezig:aw,
          zones, hoofdstukken, verboden:punten.filter(p=>p.verbod),
          blokken, open:openPunten(), fotonr, punten};
}

/* ---- de afdruk ----
   Alles wordt in een eigen blok gebouwd dat op het scherm niet bestaat en bij het afdrukken het
   enige is wat overblijft. Zo hoeft er niets van de app zelf "afdrukvriendelijk" gemaakt te
   worden, en kan de afdruk een documentindeling volgen in plaats van een scherm-indeling. */

function afdrukMeta(p,m,opties){
  const o=opties||{};
  const uit=[];
  const plek=o.volledig?plekVol(p):plekTekst(p);
  if(plek)uit.push(plek);
  if(p.hoofdstuk&&!o.zonderHoofdstuk)uit.push(hoofdstukTekst(p.hoofdstuk));
  const s=SOORTEN.find(o=>o.sleutel===p.soort);
  if(s&&s.sleutel!=="gebrek")uit.push(s.kop.toLowerCase());
  if(p.spreker)uit.push("volgens "+naamVan(p.spreker));
  // Binnen een blok dat al aan iemand gericht is, hoeft er niet in elke regel te staan aan wie.
  if(p.aan&&!o.zonderAan)uit.push("→ "+naamVan(p.aan));
  if(p.deadline)uit.push("tegen "+p.deadline);
  if(p.foto&&m.fotonr.has(p.id))uit.push("foto "+m.fotonr.get(p.id));
  if(p.bijlage&&!p.bijlage.beeld)uit.push(p.bijlage.naam||"document");
  return uit.join(" · ");
}

function afdrukPunt(p,m,opties){
  const o=opties||{};
  const rij=maakEl("div","af-punt");
  rij.appendChild(maakEl("span","af-nr",o.vinkje?"☐":(p._nr?p._nr+".":"–")));
  const body=maakEl("div","af-body");
  const kop=maakEl("p","af-tekst");
  if(p.urgent)kop.appendChild(maakEl("span","af-urgent","URGENT"));
  if(p.verbod)kop.appendChild(maakEl("span","af-verbod","VERBOD"));
  kop.appendChild(document.createTextNode(p.tekst||"[geen notitie — "+(p.tijd||"")+"]"));
  body.appendChild(kop);
  const meta=afdrukMeta(p,m,o);
  if(meta)body.appendChild(maakEl("p","af-meta",meta));
  rij.appendChild(body);
  return rij;
}

function afdrukKop(el,tekst,toelichting){
  el.appendChild(maakEl("h2","af-kop",tekst));
  if(toelichting)el.appendChild(maakEl("p","af-toelichting",toelichting));
}

/* Hoelang staat dit al open, en de hoeveelste keer het in een verslag komt. Beide staan er, want
   ze zeggen iets anders: het aantal dagen telt in een termijndiscussie, de vermelding toont dat
   er niet gezwegen is. */
function ouderdomTekst(p){
  const d=dagenOpen(p), delen=[];
  delen.push(d+" dagen open (sinds "+datumKort(p.datum)+")");
  delen.push(vermelding(p)+"e vermelding");
  return delen.join(" · ");
}

/* Het plan als bijlage, met de stippen erop. Dit is wat plan_verslag.py op de Mac deed; hier
   hoeft er geen bestand meer heen en weer. Bewust een eigen tekening en niet het scherm: op een
   blad wil je het hele plan zien, niet de uitsnede waarop je stond te werken. */
async function afdrukPlan(zone,punten){
  const data=await haalPlan(zone);
  if(!data||!data.beeld)return null;
  let beeld;
  try{beeld=await laadBeeld(data.beeld);}catch(e){return null;}
  const breed=Math.min(1600,Math.max(900,data.breedte));
  const f=breed/data.breedte;
  const c=document.createElement("canvas");
  c.width=Math.round(data.breedte*f); c.height=Math.round(data.hoogte*f);
  const x=c.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);
  x.imageSmoothingQuality="high";
  x.drawImage(beeld,0,0,c.width,c.height);
  const straal=Math.max(11,Math.round(c.width/95));
  x.textAlign="center";x.textBaseline="middle";
  punten.forEach(p=>{
    const gx=p.plek.x/100*c.width, gy=p.plek.y/100*c.height;
    x.beginPath();x.arc(gx,gy,straal,0,7);
    x.fillStyle="#1b4f8a";x.fill();
    x.lineWidth=straal/5;x.strokeStyle="#fff";x.stroke();
    x.fillStyle="#fff";
    x.font="600 "+Math.round(straal*1.15)+"px ui-monospace,Menlo,monospace";
    x.fillText(String(p._nr),gx,gy+straal*0.05);
  });
  return new Promise(res=>c.toBlob(b=>res(b?URL.createObjectURL(b):null),"image/jpeg",0.9));
}

let afdrukUrls=[];
function ruimAfdrukOp(){
  afdrukUrls.forEach(u=>{try{URL.revokeObjectURL(u)}catch(e){}});
  afdrukUrls=[];
  document.getElementById("afdruk").innerHTML="";
}

async function bouwAfdruk(){
  const m=verslagModel();
  const el=document.getElementById("afdruk");
  ruimAfdrukOp();

  const kop=maakEl("div","af-hoofd");
  kop.appendChild(maakEl("h1",null,"Werfverslag"));
  kop.appendChild(maakEl("p","af-datum",datumLang(m.datum)));
  const feiten=[];
  if(m.weer)feiten.push("Weer: "+m.weer);
  if(m.weerdata){const w=m.weerdata.dag;
    feiten.push("Weer, hele dag: "+w.min+"–"+w.max+" °C · neerslag "+w.neerslag+
                " mm · max wind "+w.windmax+" km/u");}
  if(m.bezetting)feiten.push("Bezetting: "+m.bezetting);
  if(m.aanwezig.length)feiten.push("Aanwezig: "+m.aanwezig.join(", "));
  feiten.forEach(t=>kop.appendChild(maakEl("p","af-feit",t)));
  el.appendChild(kop);

  m.zones.forEach(z=>{
    afdrukKop(el,"Vaststellingen — "+zoneNaam(z.zone));
    z.punten.forEach(p=>el.appendChild(afdrukPunt(p,m)));
  });

  if(m.hoofdstukken.length){
    afdrukKop(el,"Per bestekhoofdstuk",
      "Welk deel van het werk het betreft. Wie dit leest, ziet meteen welk hoofdstuk van zijn "+
      "bestek geraakt wordt.");
    m.hoofdstukken.forEach(h=>{
      const dringend=h.punten.filter(p=>p.urgent).length;
      el.appendChild(maakEl("p","af-subkop",h.kop+" — "+stuks(h.punten.length,"punt","punten")+
        (dringend?(", waarvan "+dringend+" urgent"):"")));
      // Eén regel per punt: dit is een ingang tot de lijst hierboven, geen tweede lijst. De
      // verwijzing vooraan is de zone met het nummer dat het punt daar draagt — en op het plan.
      h.punten.forEach(p=>{
        const r=maakEl("div","af-punt");
        r.appendChild(maakEl("span","af-nr af-wijs",(p.zone||"")+" "+(p._nr||"")));
        const b=maakEl("div","af-body");
        b.appendChild(maakEl("p","af-tekst",(p.urgent?"🔴 ":"")+(p.tekst||"[geen notitie]")+
          (p.plek&&p.plek.lokaal?"  ("+p.plek.lokaal+")":"")));
        r.appendChild(b);
        el.appendChild(r);
      });
    });
  }

  if(m.open.length){
    afdrukKop(el,"Nog steeds open",
      "Onderstaande vaststellingen zijn op een eerdere werfvergadering gedaan en op heden niet "+
      "opgelost. Deze herhaling geldt als aanmaning.");
    m.open.forEach(p=>{
      const rij=maakEl("div","af-punt");
      rij.appendChild(maakEl("span","af-nr","–"));
      const body=maakEl("div","af-body");
      body.appendChild(maakEl("p","af-tekst",p.tekst||"[geen notitie]"));
      body.appendChild(maakEl("p","af-meta",plekVol(p)+" · "+ouderdomTekst(p)));
      rij.appendChild(body);
      el.appendChild(rij);
    });
  }

  if(m.verboden.length){
    afdrukKop(el,(profiel.bijzonder&&profiel.bijzonder.kop)||"Verbod",
      (profiel.bijzonder&&profiel.bijzonder.verslag)||"");
    m.verboden.forEach(p=>el.appendChild(afdrukPunt(p,m,{volledig:true})));
  }

  m.blokken.forEach(b=>{
    afdrukKop(el,b.kop,b.toelichting);
    b.partijen.forEach(w=>{
      el.appendChild(maakEl("p","af-subkop",w.naam+" — "+stuks(w.punten.length,"punt","punten")));
      w.punten.forEach(p=>el.appendChild(
        afdrukPunt(p,m,{vinkje:true,volledig:true,zonderAan:true})));
    });
  });

  // Het plan met de stippen. Per zone waarvoor een plan op dit toestel staat; de nummers zijn
  // die van de lijst hierboven.
  for(const z of m.zones){
    const opPlan=z.punten.filter(p=>p.plek&&p.plek.zone===z.zone);
    if(!opPlan.length)continue;
    const url=await afdrukPlan(z.zone,opPlan);
    if(!url)continue;
    afdrukUrls.push(url);
    const blok=maakEl("section","af-bijlage");
    blok.appendChild(maakEl("h2","af-kop","Plan "+z.zone));
    const im=maakEl("img","af-plan");im.src=url;im.alt="Plan "+z.zone;
    blok.appendChild(im);
    el.appendChild(blok);
  }

  // De foto's, genummerd zoals ze in de tekst aangehaald worden.
  const metFoto=m.punten.filter(p=>p.foto);
  if(metFoto.length){
    const blok=maakEl("section","af-bijlage");
    blok.appendChild(maakEl("h2","af-kop","Foto's en documenten"));
    for(const p of metFoto){
      const nr=m.fotonr.get(p.id);
      const kader=maakEl("figure","af-foto");
      const blob=await haalFoto(p.id);
      if(blob&&!(p.bijlage&&!p.bijlage.beeld)){
        const url=URL.createObjectURL(blob);afdrukUrls.push(url);
        const im=maakEl("img");im.src=url;im.alt=p.tekst||"";
        kader.appendChild(im);
      }else{
        kader.appendChild(maakEl("p","af-geenbeeld",
          blob?("document: "+((p.bijlage&&p.bijlage.naam)||"bijlage")):"beeld niet beschikbaar"));
      }
      kader.appendChild(maakEl("figcaption",null,
        nr+" · "+plekVol(p)+" · "+(p.tijd||"")+(p.tekst?" — "+p.tekst:"")));
      blok.appendChild(kader);
    }
    el.appendChild(blok);
  }

  el.appendChild(maakEl("p","af-voet",
    "Opgemaakt met Werfpunten "+VERSIE+" op "+datumLang(new Date().toISOString().slice(0,10))+"."));
  return m;
}

function datumLang(iso){
  const M=["januari","februari","maart","april","mei","juni","juli","augustus","september",
           "oktober","november","december"];
  const d=new Date(iso+"T00:00:00");
  if(isNaN(d))return iso;
  return d.getDate()+" "+M[d.getMonth()]+" "+d.getFullYear();
}

async function drukAf(){
  if(!(staat.punten||[]).length&&!openPunten().length){melding("Nog niets om af te drukken");return;}
  melding("Verslag klaarmaken…");
  await bouwAfdruk();
  // Afdrukken vanuit een open venster gaat op iOS mis: dat venster ligt in de bovenste laag en
  // de afdrukstijl krijgt het er niet altijd uit. Dus eerst sluiten.
  document.querySelectorAll("dialog[open]").forEach(d=>d.close());
  const na=()=>{
    removeEventListener("afterprint",na);
    setTimeout(ruimAfdrukOp,1500);
  };
  addEventListener("afterprint",na);
  setTimeout(()=>{try{print()}catch(e){melding("Afdrukken lukt niet in deze browser");na();}},350);
}

/* ---- doorsturen ----
   De blokken bestaan al; wat ontbrak was ze de deur uit krijgen. Dat gaat via het deelvenster van
   het toestel — dan werkt AirDrop, en dat werkt zónder netwerk. Op een werf zonder bereik is dat
   niet een detail maar het verschil tussen wel en niet doorsturen.

   Wat er meegaat is één blok: de tekst als afvinklijst plus de foto's die erbij horen. Niet het
   hele verslag — de dakwerker krijgt hoofdstuk dak, en niets van de rest. Dat is de reden dat de
   blokken bestaan. */

/* De bestanden dragen het nummer waarmee ze in de lijst staan, en de plek in de naam. Wie de
   foto's in zijn deelvenster ziet staan, hoort ze zonder de lijst ernaast te kunnen thuisbrengen —
   en ze komen in dezelfde volgorde binnen als de regels. */
async function bestandenVan(punten){
  const uit=[];
  let n=0;
  for(const p of punten){
    if(!p.foto)continue;
    n++;
    const b=await haalFoto(p.id);
    if(!b)continue;
    const doc=p.bijlage&&!p.bijlage.beeld;
    const kort=String(n).padStart(2,"0")+"-"+
      ((p.plek&&p.plek.lokaal?p.plek.lokaal:p.zone||"werf").replace(/[^\w.-]/g,""));
    const naam=doc?(kort+"-"+(p.bijlage.naam||"document").replace(/[^\w.-]/g,"-")):(kort+".jpg");
    try{uit.push(new File([b],naam,{type:b.type||(doc?"application/octet-stream":"image/jpeg")}));}
    catch(e){}
  }
  return uit;
}

function doorstuurTekst(titel,toelichting,punten,m){
  const r=[titel,""];
  if(toelichting)r.push(toelichting,"");
  // De foto's krijgen hier hun eigen nummer, want alleen die van dít blok gaan mee. Het nummer
  // uit het volledige verslag zou naar een foto verwijzen die de ontvanger niet heeft.
  const fotonr=new Map();
  punten.filter(p=>p.foto).forEach((p,i)=>fotonr.set(p.id,i+1));
  const mm={...m,fotonr};
  punten.forEach(p=>{
    const meta=afdrukMeta(p,mm,{volledig:true,zonderAan:true});
    r.push("- [ ] "+(p.urgent?"URGENT — ":"")+(p.tekst||"[geen notitie]")+(meta?"  ("+meta+")":""));
  });
  r.push("");
  r.push("Werfvergadering "+datumLang(m.datum)+" — uittreksel uit het werfverslag.");
  return r.join("\n");
}

async function stuurDoor(titel,tekst,punten){
  const bestanden=await bestandenVan(punten);
  const kan=f=>{try{return navigator.canShare&&navigator.canShare(f)}catch(e){return false}};
  if(navigator.share){
    // eerst mét de foto's; kan het toestel dat niet, dan de tekst alleen — en dan zeggen we dat,
    // want een lijst die naar een foto verwijst die niet meekwam is erger dan geen foto
    if(bestanden.length&&kan({files:bestanden})){
      try{await navigator.share({title:titel,text:tekst,files:bestanden});return;}
      catch(e){if(e&&e.name==="AbortError")return;}
    }
    try{
      await navigator.share({title:titel,text:tekst});
      if(bestanden.length)melding("Zonder de "+bestanden.length+" foto's — dit toestel deelt geen bestanden");
      return;
    }catch(e){if(e&&e.name==="AbortError")return;}
  }
  melding(await kopieer(tekst)?"Gekopieerd — dit toestel heeft geen deelvenster"
                              :"Delen én kopiëren lukken niet in deze browser");
}

function toonDoorsturen(perWat){
  const m=verslagModel();
  const lijst=[];
  if(perWat==="rol"){
    m.blokken.forEach(b=>b.partijen.forEach(w=>lijst.push({
      titel:b.kop+" — "+w.naam, toelichting:b.toelichting, punten:w.punten})));
    if(m.verboden.length&&profiel.bijzonder)lijst.unshift({titel:profiel.bijzonder.kop,
      toelichting:profiel.bijzonder.verslag, punten:m.verboden});
  }else{
    m.hoofdstukken.forEach(h=>lijst.push({titel:h.kop,toelichting:"",punten:h.punten}));
  }
  const dlg=document.getElementById("dlg");
  document.getElementById("dlg-titel").textContent=
    perWat==="rol"?"Doorsturen per rol":"Doorsturen per bestekhoofdstuk";
  const body=document.getElementById("dlg-body");
  body.innerHTML="";
  if(!lijst.length){
    body.appendChild(maakEl("p","inv-uitleg", perWat==="rol"
      ? "Nog geen punt is aan iemand toegewezen. Dat gebeurt in de keet: daar zeg je wie er iets "+
        "mee moet, en dáárop zijn deze lijsten gebouwd."
      : "Nog geen punt draagt een bestekhoofdstuk. Dat kies je in de keet, bovenaan."));
  }
  lijst.forEach(o=>{
    const rij=maakEl("div","door-rij");
    const links=maakEl("div","door-wat");
    links.appendChild(maakEl("b",null,o.titel));
    const fotos=o.punten.filter(p=>p.foto).length;
    links.appendChild(maakEl("span",null,stuks(o.punten.length,"punt","punten")+
      (fotos?(" · "+stuks(fotos,"foto","foto's")):"")));
    rij.appendChild(links);
    const knop=maakEl("button",null,"Doorsturen");
    knop.type="button";
    knop.onclick=()=>stuurDoor(o.titel,doorstuurTekst(o.titel,o.toelichting,o.punten,m),o.punten);
    rij.appendChild(knop);
    body.appendChild(rij);
  });
  document.getElementById("dlg-kopieer").style.display="none";
  dlg.showModal();
}

/* Eén knop waar het verslag de app verlaat, in vier vormen. Dit is keetwerk, niet werfwerk —
   hier telt volledigheid, niet het aantal tikken. */
function openVerslag(){
  const m=verslagModel();
  const dlg=document.getElementById("dlg");
  document.getElementById("dlg-titel").textContent="Verslag";
  const body=document.getElementById("dlg-body");
  body.innerHTML="";
  const zonderwoorden=(staat.punten||[]).filter(p=>!(p.tekst||"").trim()).length;
  const samen=stuks((staat.punten||[]).length,"punt","punten")+" van vandaag"+
    (m.open.length?(", "+stuks(m.open.length,"punt","punten")+" nog open van vorige keren"):"");
  body.appendChild(maakEl("p","inv-uitleg",samen+"."));
  if(zonderwoorden)
    body.appendChild(maakEl("p","inv-uitleg",zonderwoorden+" daarvan staat er nog zonder woorden. "+
      "Werk ze eerst af in de keet — een verslag met lege regels is er geen."));
  const knop=(tekst,uitleg,knoptekst,fn)=>{
    const rij=maakEl("div","door-rij");
    const links=maakEl("div","door-wat");
    links.appendChild(maakEl("b",null,tekst));
    links.appendChild(maakEl("span",null,uitleg));
    rij.appendChild(links);
    const b=maakEl("button",null,knoptekst);b.type="button";
    b.onclick=()=>{dlg.close();fn();};
    rij.appendChild(b);
    body.appendChild(rij);
  };
  knop("Afdrukken of als PDF bewaren",
       "het hele verslag, met het plan en de foto's erbij","Afdrukken",drukAf);
  knop("Doorsturen per rol",
       "elk blok naar wie er iets mee moet, met zijn foto's","Kiezen",()=>toonDoorsturen("rol"));
  knop("Doorsturen per bestekhoofdstuk",
       "de dakwerker krijgt hoofdstuk dak, en niets van de rest","Kiezen",
       ()=>toonDoorsturen("hoofdstuk"));
  knop("Verslagtekst kopiëren",
       "de steno-export voor werf_verwerk.py op de Mac","Kopiëren",kopieerVerslagtekst);
  document.getElementById("dlg-kopieer").style.display="none";
  dlg.showModal();
}

async function kopieer(t){
  try{await navigator.clipboard.writeText(t);return true}
  catch(e){
    const ta=document.createElement("textarea");ta.value=t;
    ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);
    ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(_){}
    document.body.removeChild(ta);return ok;
  }
}

const dlg=document.getElementById("dlg");
document.getElementById("dlg-sluit").onclick=()=>dlg.close();

async function kopieerVerslagtekst(){
  const t=maakTekst();
  if(!t){melding("Nog niets te kopiëren");return}
  const ok=await kopieer(t);
  document.getElementById("dlg-titel").textContent="Verslagtekst";
  document.getElementById("dlg-body").innerHTML="<pre></pre>";
  document.getElementById("dlg-body").querySelector("pre").textContent=t;
  document.getElementById("dlg-kopieer").style.display="";
  document.getElementById("dlg-kopieer").onclick=async()=>{
    melding(await kopieer(t)?"Gekopieerd":"Selecteer en kopieer handmatig");
  };
  dlg.showModal();
  if(ok)melding("Gekopieerd — plak in Apple Notes");
}
document.getElementById("verslag").onclick=openVerslag;

document.getElementById("fotos").onclick=async()=>{
  const metFoto=staat.punten.filter(p=>p.foto);
  document.getElementById("dlg-titel").textContent=metFoto.length+" foto's en documenten";
  const b=document.getElementById("dlg-body");b.innerHTML="";
  if(!metFoto.length){b.innerHTML='<p style="margin:0;color:var(--ink-soft)">Nog geen foto\'s.</p>';}
  for(let i=0;i<metFoto.length;i++){
    const p=metFoto[i];const blob=await haalFoto(p.id);
    const cap=document.createElement("p");
    cap.style.cssText="margin:0 0 4px;font:12px ui-monospace,Menlo,monospace;color:var(--ink-soft)";
    cap.textContent=String(i+1).padStart(2,"0")+" · "+p.zone+" · "+p.tijd+" — "+p.tekst;
    b.appendChild(cap);
    if(blob){
      if(p.bijlage && !p.bijlage.beeld){
        const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.target="_blank";
        a.textContent="📄 "+(p.bijlage.naam||"document")+" openen";
        a.style.cssText="display:block;margin-bottom:12px;color:var(--accent)";
        b.appendChild(a);
      }else{
        const im=document.createElement("img");im.src=URL.createObjectURL(blob);im.alt=p.tekst||"";b.appendChild(im);
      }
    }
  }
  document.getElementById("dlg-kopieer").style.display="none";
  dlg.showModal();
};

/* UI eerst tekenen, opslag daarna — zo werkt de app ook als IndexedDB geweigerd wordt */
laadStaat();
document.getElementById("weer").value=staat.weer||"";
document.getElementById("bezetting").value=staat.bezetting||"";
laadContacten();
laadHoofdstukken();
laadProfiel();          // zet ROLLEN en SOORTEN, en laadt de woorden van dít profiel
merkProfiel();
tekenContacten();
tekenSprekers();
tekenZones();
tekenLijst();
document.getElementById("versie").textContent=VERSIE;
if(staat.weerdata){
  const w=staat.weerdata.dag;
  document.getElementById("weerinfo").textContent="dag: "+w.min+"–"+w.max+"°C · neerslag "+w.neerslag+" mm · max wind "+w.windmax+" km/u";
  document.getElementById("weerknop").classList.add("klaar");
  document.getElementById("weerknop").textContent="✓";
}
planBedrading();
opendb().then(async d=>{
  if(!d){
    const k=document.getElementById("fotoknop");
    k.disabled=true;k.textContent="📷 n.v.t.";k.title="Fotoopslag niet beschikbaar in deze weergave";
    const p=document.getElementById("planknop");
    p.disabled=true;p.textContent="📍 n.v.t.";p.title="Planopslag niet beschikbaar in deze weergave";
  }else{
    planLijst=await planZones();
    archief=await haalDagen();
    tekenZones();          // nu pas is bekend welke zones een plan hebben
    if(vorigeDag){
      // Alleen wegschrijven als die dag er nog niet in zit: een gearchiveerde dag kan intussen
      // afvinkingen bevatten, en die mogen niet overschreven worden door de oude localStorage.
      if(!archief.some(d=>d.datum===vorigeDag.datum)){
        await zetDag(vorigeDag.datum,vorigeDag);
        archief=await haalDagen();
      }
      vorigeDag=null;
      bewaarStaat();   // de verouderde dag uit localStorage halen, anders komt hij terug
    }
  }
  tekenLijst();
  // Bij een verse dag begint een rondgang met de vraag waar je staat. Hervat je een dag waarin
  // al punten staan, dan onderbreken we niet — dan weet je zelf wel waar je gebleven was.
  // De kaart is de werkplek, niet een omweg. Was je daar gebleven, dan kom je daar terug —
  // en dan hoeft de vraag naar het niveau niet nog eens.
  if(planLijst.length){
    if(planLijst.includes(staat.zone) && staat.punten.length) setTimeout(()=>openPlan(staat.zone),300);
    else setTimeout(vraagNiveau,350);
  }
  // Achteraan, en maar één keer: eerst mag je werken. Maar niet zwijgen, want een toestel dat
  // stukgaat vóór de eerste back-up neemt het hele dossier mee.
  merkBackupknop();
  if(backupAchterstand())
    setTimeout(()=>meldingMetActie("Nog geen back-up van wat hier staat","nu bewaren",
      ()=>document.getElementById("backup").click()),2500);
});
